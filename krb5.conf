# Kerberos realm config for the LINDS Windows domain.
#
# Used via KRB5_CONFIG so the system /etc/krb5.conf is left alone:
#   KRB5_CONFIG=$PWD/krb5.conf kinit Administrator@LINDS.COM.AU
#
# No credentials live here. Authentication comes from the operator's ticket
# cache, obtained with kinit before an Ansible run.

[libdefaults]
    default_realm = LINDS.COM.AU
    dns_lookup_realm = false
    dns_lookup_kdc = true
    rdns = false
    forwardable = true
    udp_preference_limit = 0

[realms]
    LINDS.COM.AU = {
        kdc = jd-dc-01.linds.com.au
        kdc = linds-dc.linds.com.au
        kdc = linds-dc2.linds.com.au
        admin_server = jd-dc-01.linds.com.au
        default_domain = linds.com.au
    }

[domain_realm]
    .linds.com.au = LINDS.COM.AU
    linds.com.au = LINDS.COM.AU
