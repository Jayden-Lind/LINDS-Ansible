---
torrent:
  children:
    jd_torrent:
      hosts:
        jd-torrent-01.linds.com.au:
    linds_torrent:
      hosts:
        10.0.36.2:
      vars:
        nfs_server: linds-truenas-01.linds.com.au
        nfs_path: /mnt/ZFS_NAS
        # qBittorrent runs as this system account, not root. The NAS maps
        # every NFS client to its media user anyway (inventory/truenas.yml),
        # so this is about the host, not file ownership.
        torrent_user: qbittorrent
        # Downloads go to downloads/<category>. Plex does not scan that
        # folder: its libraries are Movies, TVShows and torrent (Sonarr keeps
        # series in torrent). Radarr and Sonarr mount the whole share at
        # /mnt/nas, as this host does, and hardlink what they import.
        # A change here moves the data of every torrent in the category when
        # qBittorrent starts again (automatic torrent management).
        torrent_categories:
          radarr:
            save_path: /mnt/nas/downloads/radarr
          tv-sonarr:
            save_path: /mnt/nas/downloads/tv-sonarr
