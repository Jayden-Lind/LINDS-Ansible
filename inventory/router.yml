---
# The Debian 13 routers (playbooks/router.yml). The settings of each site are
# in group_vars/jd_router.yml and group_vars/linds_router.yml. The secrets are
# in group_vars/router/secrets.yml and host_vars/<router>/secrets.yml.
router:
  vars:
    ansible_user: jayden
    ansible_python_interpreter: /usr/bin/python3
  children:
    jd_router:
      hosts:
        jd-router-01:
          ansible_host: 10.0.50.1
    linds_router:
      hosts:
        linds-router-01:
          ansible_host: 192.168.6.1
