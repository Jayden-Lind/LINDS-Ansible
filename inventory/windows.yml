---
# Windows domain: linds.com.au
#
# Hosts are FQDNs so Kerberos SPNs match. Authentication is Kerberos against
# the operator's ticket cache - run `kinit -f Administrator@LINDS.COM.AU`
# first. No credentials here.
windows:
  children:
    windows_dc:
      hosts:
        jd-dc-01.linds.com.au:
          ansible_host: 10.0.50.200
          ad_site: JD
          # Built from the template as VM 1114 on jd-proxmox-02 (19 October 2026).
          windows_hostname: JD-DC-01
          windows_ipv4_address: 10.0.50.200
          windows_ipv4_prefix: 24
          windows_ipv4_gateway: 10.0.50.1
          # The other two domain controllers; a member must resolve through
          # the domain or it cannot find it to join. The role adds itself.
          windows_dns_servers:
            - 10.3.1.200
            - 10.3.1.201
          windows_vm:
            hypervisor: jd-proxmox-02
            id: 1114
            data_disks: []
          # external-dns (LINDS-Kubernetes) reads linds.com.au with a zone
          # transfer from this server, and writes to it with RFC 2136.
          windows_dc_dns_zone_transfers:
            - { zone: linds.com.au, secure_secondaries: TransferAnyServer }
        linds-dc.linds.com.au:
          ansible_host: 10.3.1.200
          ad_site: LINDS
          # Built from the Windows template on 2026-10-12 (VM 113 on linds-proxmox-01).
          # Also the CA and the LINDS file server: see the groups below, and
          # inventory/host_vars/linds-dc.linds.com.au/ for its shares.
          windows_hostname: LINDS-DC
          windows_ipv4_address: 10.3.1.200
          windows_ipv4_prefix: 24
          windows_ipv4_gateway: 10.3.1.1
          windows_dns_servers:
            - 10.3.1.201
            - 10.0.50.200
          # The VM, and the data disk that outlives it. The disk belongs to
          # VM 102, the server this one replaces, which is kept switched off;
          # 104 is the LINDS-Backup VM, which mounts the same disk for its
          # Backblaze runs (as scsi1, with discard=on, so that its deletes
          # reach the thin pool). 104 is not in Terraform or in this
          # inventory. Only one of the three may ever be running.
          windows_vm:
            hypervisor: linds-proxmox-01
            id: 113
            data_disks:
              - slot: scsi1
                volume: NAS:vm-102-disk-0
                options: backup=0,cache=none,discard=on,iothread=1
                never_running_with: [102, 104]
        linds-dc2.linds.com.au:
          ansible_host: 10.3.1.201
          ad_site: LINDS
          # Built from the Windows template on 2026-10-11 (VM 112 on linds-proxmox-01).
          windows_hostname: LINDS-DC2
          windows_ipv4_address: 10.3.1.201
          windows_ipv4_prefix: 24
          windows_ipv4_gateway: 10.3.1.1
          # The other two domain controllers; a member must resolve through
          # the domain or it cannot find it to join.
          windows_dns_servers:
            - 10.3.1.200
            - 10.0.50.200

    windows_fileserver:
      hosts:
        jd-fs-01.linds.com.au:
          ansible_host: 10.0.50.201
          ad_site: JD
          # Built from the template as VM 1113 on jd-proxmox-02 (19 October 2026).
          # The share and the other file server settings are in
          # inventory/host_vars/jd-fs-01.linds.com.au/.
          windows_hostname: JD-FS-01
          windows_ipv4_address: 10.0.50.201
          windows_ipv4_prefix: 24
          windows_ipv4_gateway: 10.0.50.1
          windows_dns_servers:
            - 10.0.50.200
            - 10.3.1.200
          # The data disk was reassigned from VM 1103 to 1113 at the swap on
          # 19 October 2026 (qm disk move, a rename). 1113 owns it; VM 1103
          # (JD-FS-01-old) owns nothing and can go.
          windows_vm:
            hypervisor: jd-proxmox-02
            id: 1113
            data_disks:
              - slot: scsi1
                volume: NAS-SSD:vm-1113-disk-0
                options: backup=0,discard=on,iothread=1
                never_running_with: []
        linds-dc.linds.com.au:

    # The enterprise root CA, linds-CA. A server is in every group whose role
    # it carries: this one is also a domain controller above.
    windows_ca:
      hosts:
        linds-dc.linds.com.au:

    # The servers whose settings the code owns. playbooks/windows.yml applies
    # the baseline and the settings of their other groups to them, and the GPO
    # "Server - Baseline" applies to them. All four are built from the template.
    windows_managed:
      hosts:
        jd-dc-01.linds.com.au:
        linds-dc.linds.com.au:
        linds-dc2.linds.com.au:
        jd-fs-01.linds.com.au:
