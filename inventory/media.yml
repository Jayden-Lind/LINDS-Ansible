---
# The media hosts (playbooks/media.yml): Plex, and qBittorrent at both sites.
plex:
  hosts:
    linds-plex-01.linds.com.au:
  vars:
    # /mnt/nas: the media share of the LINDS NAS.
    plex_nas_server: linds-truenas-01.linds.com.au
    plex_nas_path: /mnt/ZFS_NAS
    # /mnt/cifs: a folder of the NAS share on LINDS-DC.
    plex_smb_server: linds-dc.linds.com.au
    plex_smb_path: /nas/holiday videos
    # /mnt/truenas: the NAS export of jd-proxmox-02.
    plex_truenas_server: jd-truenas-01.linds.com.au
    plex_truenas_path: /mnt/NAS

torrent:
  children:
    jd_torrent:
      hosts:
        jd-torrent-01.linds.com.au:
    linds_torrent:
      hosts:
        # VM 105 on linds-proxmox-01, on VLAN 36.
        linds-torrent-02:
          ansible_host: 10.0.36.2
      vars:
        torrent_nfs_server: linds-truenas-01.linds.com.au
        torrent_nfs_path: /mnt/ZFS_NAS
        # qBittorrent runs as this system account, not root. The NAS maps
        # every NFS client to its media user anyway (inventory/nas.yml),
        # so this is about the host, not file ownership.
        torrent_user: qbittorrent
        # Downloads go to downloads/<category>. Plex does not scan that
        # folder: its libraries are Movies, TVShows and torrent (Sonarr keeps
        # series in torrent). Radarr and Sonarr mount the whole share at
        # /mnt/nas, as this host does, and hardlink what they import.
        # A change here moves the data of every torrent in the category when
        # qBittorrent starts again (automatic torrent management).
        # legacy: old torrents whose files Radarr and Sonarr did not import
        # (spare copies and other releases of a title, moved here on
        # 2026-10-25). Radarr and Sonarr do not watch this category, so they
        # never try to import these over the files they manage. qbit_manage
        # (LINDS-Kubernetes) removes them once no library file links to them.
        torrent_categories:
          legacy:
            save_path: /mnt/nas/downloads/legacy
          radarr:
            save_path: /mnt/nas/downloads/radarr
          tv-sonarr:
            save_path: /mnt/nas/downloads/tv-sonarr
