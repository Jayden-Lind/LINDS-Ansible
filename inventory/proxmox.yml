---
proxmox:
  children:
    jd_proxmox:
      hosts:
        jd-proxmox-01.linds.com.au:
          ansible_host: 10.0.50.246
      vars:
        proxmox_zfs_datasets:
          # Pool root, not a data dataset. /usr/lib/zfs-linux/trim reads this
          # user property off the root dataset to decide what the monthly cron
          # trims; unset it defaults to "auto", which only trims NVMe-only
          # pools and so silently skipped this SATA pool. Pairs with the
          # zfs_trim_extent_bytes_min floor in the proxmox role defaults: the
          # floor keeps inline autotrim off the hot path, this makes the
          # periodic full trim actually run. Not set on VM — those disks
          # present discard_max_bytes=0 via the Adaptec and reject trim.
          - name: NAS-SSD
            properties:
              org.debian:periodic-trim: enable
          - name: VM/truenas-nas
            properties:
              mountpoint: /mnt/NAS
              recordsize: 1M
              compression: zstd
              atime: "off"
              acltype: posix
          # Backs jd-s3-01 (versitygw, LXC 107): buckets are plain files under
          # /mnt/NAS/s3/buckets. VM/truenas-nas/minio (the old MinIO data) is
          # no longer managed; it stays until LXC 106 is deleted, then goes too.
          - name: VM/truenas-nas/s3
            properties:
              recordsize: 1M
          - name: HDD-20T/data
            properties:
              mountpoint: /mnt/HDD
              recordsize: 1M
              # lz4 early-aborts on incompressible media, so it is close to
              # free on this pool and catches whatever compressible files
              # land alongside it. Set live on 2026-09-02 (pool root too).
              compression: lz4
              atime: "off"

        proxmox_nfs_exports:
          - path: /mnt/NAS
            options: rw,no_root_squash,insecure,no_subtree_check
            networks:
              - 10.0.50.0/24
              - 10.0.53.0/24
              - 10.3.1.0/24
              - 10.0.36.0/24
          - path: /mnt/HDD
            options: rw,anonuid=0,anongid=0,all_squash,insecure,no_subtree_check
            networks:
              - 10.0.53.0/24
              - 10.0.50.0/24

        proxmox_iscsi_targets:
          - iqn: iqn.2005-10.org.truenas:arr-suite
            portal_ip: 10.0.50.246
            portal_port: 3260
            luns:
              - name: arr-iscsi
                wwn: f41b5e6d-1ccd-400e-bff4-713ef6d53d9f
                plugin: fileio
                path: /mnt/NAS/arr-iscsi
                size: 21474840576
                write_back: true

        proxmox_sanoid_policies:
          - dataset: VM/truenas-nas
            template: ssd_short
            recursive: true

        # k8s zvols whose churn makes snapshots expensive and worthless. The
        # zvols are named after their PV, so a recreated PVC needs its new
        # name here (the role reports names it cannot find).
        proxmox_sanoid_optout:
          # monitoring/prometheus-...-prometheus-0: TSDB compaction rewrites
          # blocks every few hours - 14 dailies pinned 20.9G of deleted data.
          - VM/truenas-nas/k8s-iscsi/v/pvc-6bc3d715-6306-4c54-a4ca-871de99d36f1
          # monitoring/storage-loki-0: WAL and compactor scratch (chunks live
          # on jd-s3-01) - 3.7G of snapshots for ~20MB of live data.
          - VM/truenas-nas/k8s-iscsi/v/pvc-cf4eacc1-da88-451b-92a7-71126abc6559
          # valheim/valheim-server-files: the SteamCMD-downloaded game server
          # (~4G), re-fetched from Steam in about a minute and replaced
          # wholesale on every Valheim patch. The world is the OTHER valheim
          # zvol (pvc-95d1127b, ~66M) and stays on dailies.
          - VM/truenas-nas/k8s-iscsi/v/pvc-8a4d142e-81a0-42b0-a61b-73229e7ff2e2

        # The only container here was the S3 server, and LINDS-Terraform/bootstrap
        # owns it: it sets the environment (the root credentials) and re-adopts
        # the container through an import block. Listing it here as well put two
        # writers on the same /etc/pve/lxc/<id>.conf, and this entry, still
        # describing MinIO (LXC 106, retired 2026-10-17), would have restarted
        # it with the address versitygw (LXC 107) now uses.
        proxmox_lxc_containers: []
