---
# The base settings of linds-proxmox-01 (roles/proxmox_base).

# On 2026-11-18 the host had 23 GiB of free memory and KSM saved 0.1 GiB.
# With KSM off, the VMs keep their 2 MiB pages.
proxmox_base_ksm_enabled: false

# The host does not export or mount NFS.
proxmox_base_rpcbind_enabled: false
# The kernel default is the performance governor.
proxmox_base_cpu_governor: schedutil
proxmox_base_nic_ring_interfaces:
  - eno1
  - eno2

# No CPU vulnerability mitigations, as on the other hosts and in the VMs (see
# common_disable_mitigations in roles/common): the site has one tenant. On
# these CPUs (Broadwell) the mitigations make each entry to and exit from a
# VM slower, and KVM splits the executable 2 MiB pages of the VMs. The
# parameter applies at the next boot of the host.
proxmox_base_kernel_cmdline: mitigations=off
