---
# The base settings of jd-proxmox-02 (roles/proxmox_base).

# The host has more free memory than KSM saves. With KSM off, the VMs keep
# their 2 MiB pages.
proxmox_base_ksm_enabled: false

proxmox_base_sysctl:
  # Memory. The host has 256 GiB, and the ZFS ARC and the VMs use most of it.
  # Keep 1 GiB free for the kernel. Write dirty pages early, in small amounts.
  vm.min_free_kbytes: 1048576
  vm.dirty_background_bytes: 536870912
  vm.dirty_bytes: 2147483648
  vm.vfs_cache_pressure: 50
  vm.swappiness: 10

  # TCP of the host: NFS and iSCSI to the cluster, and replication to LINDS.
  # /etc/modules loads tcp_bbr.
  net.core.default_qdisc: fq
  net.ipv4.tcp_congestion_control: bbr
  net.ipv4.tcp_notsent_lowat: 131072
  net.ipv4.tcp_slow_start_after_idle: 0
  net.ipv4.tcp_fastopen: 3
  net.ipv4.tcp_mtu_probing: 1

  # Socket buffers for the 10 Gbit/s LAN port: 1 MiB at the start, 64 MiB at
  # most.
  net.core.rmem_max: 67108864
  net.core.wmem_max: 67108864
  net.core.rmem_default: 1048576
  net.core.wmem_default: 1048576
  net.ipv4.tcp_rmem: 4096 1048576 67108864
  net.ipv4.tcp_wmem: 4096 1048576 67108864

  # Queues for bursts of packets and of new connections.
  net.core.netdev_max_backlog: 250000
  net.core.netdev_budget: 600
  net.core.netdev_budget_usecs: 8000
  net.core.somaxconn: 65535
  net.ipv4.tcp_max_syn_backlog: 8192
