---
# The GPOs that the code owns (role windows_gpo). Their links are in
# directory.yml, windows_directory_gpo_links. Apply with `ansible-playbook playbooks/windows.yml --tags gpo,directory`.

windows_gpo_wmi_filters:
  - name: PDC emulator
    description: The domain controller that holds the PDC emulator role.
    query: SELECT * FROM Win32_ComputerSystem WHERE DomainRole = 5

windows_gpo_definitions:
  # The settings of roles/windows_baseline, kept in place after the domain join.
  # If you change a setting here, change it in that role too.
  - name: Server - Baseline
    comment: >-
      Firewall, Defender, event logs, Remote Desktop, SMB1, Print Spooler,
      unused services, LLMNR and mDNS, CPU mitigations and IPv6 of the servers. Made by LINDS-Ansible, role
      windows_gpo. Do not edit it in GPMC.
    # The computer names of the servers in the inventory group windows_managed.
    apply_to: "{{ groups['windows_managed'] | map('split', '.') | map('first') | map('upper') | list }}"
    policy:
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile', name: EnableFirewall, type: DWord, value: 1 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile', name: EnableFirewall, type: DWord, value: 1 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile', name: EnableFirewall, type: DWord, value: 1 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection', name: DisableRealtimeMonitoring, type: DWord, value: 0 }
      # The maximum size of each event log, in KB.
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security', name: MaxSize, type: DWord, value: 1048576 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\System', name: MaxSize, type: DWord, value: 262144 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application', name: MaxSize, type: DWord, value: 262144 }
      # 0 turns off LLMNR and mDNS: the servers find names with DNS only.
      # See windows_baseline_multicast_names.
      - key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
        name: EnableMulticast
        type: DWord
        value: 0
        state: "{{ 'absent' if windows_baseline_multicast_names | default(true) | bool else 'present' }}"
      - key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
        name: EnableMDNS
        type: DWord
        value: 0
        state: "{{ 'absent' if windows_baseline_multicast_names | default(true) | bool else 'present' }}"
      # Allow Remote Desktop, with Network Level Authentication.
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services', name: fDenyTSConnections, type: DWord, value: 0 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services', name: UserAuthentication, type: DWord, value: 1 }
    # No administrative template has these settings, so they are preference
    # items. A preference item stays on the server if the GPO goes.
    preferences:
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: SMB1, type: DWord, value: 0 }
      # 4 is Disabled. The service stops at the next restart.
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\Spooler', name: Start, type: DWord, value: 4 }
      # The DNS Client service reads this value when it starts. 0 turns off
      # mDNS. The change takes effect at the next restart.
      - key: 'HKLM\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters'
        name: EnableMDNS
        type: DWord
        value: 0
        state: "{{ 'absent' if windows_baseline_multicast_names | default(true) | bool else 'present' }}"
      # The services of windows_baseline_services_disabled (role
      # windows_baseline), also Disabled.
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\Audiosrv', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\AudioEndpointBuilder', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\PcaSvc', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\RmSvc', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\ShellHWDetection', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\WpnService', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\lfsvc', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\DiagTrack', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\SysMain', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\DPS', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\TrkWks', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\BalloonService', name: Start, type: DWord, value: 4 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\UALSVC', name: Start, type: DWord, value: 4 }
      # 3 turns off the mitigations for Spectre variant 2 and Meltdown. The
      # change takes effect at the next restart. See windows_baseline_cpu_mitigations.
      - key: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
        name: FeatureSettingsOverride
        type: DWord
        value: 3
        state: "{{ 'absent' if windows_baseline_cpu_mitigations | default(true) | bool else 'present' }}"
      - key: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
        name: FeatureSettingsOverrideMask
        type: DWord
        value: 3
        state: "{{ 'absent' if windows_baseline_cpu_mitigations | default(true) | bool else 'present' }}"
      # 255 turns off IPv6 on every interface except the loopback. The change
      # takes effect at the next restart. See windows_baseline_ipv6.
      - key: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
        name: DisabledComponents
        type: DWord
        value: 255
        state: "{{ 'absent' if windows_baseline_ipv6 | default(true) | bool else 'present' }}"
      # TLS 1.0 and 1.1 off for what the server serves (LDAPS on the domain
      # controllers, Remote Desktop); TLS 1.2 and 1.3 stay on (PingCastle
      # A-DCLdapsProtocolAdvanced). Schannel reads these when Windows starts,
      # so the change takes effect at the next restart.
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server', name: Enabled, type: DWord, value: 0 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server', name: DisabledByDefault, type: DWord, value: 1 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Server', name: Enabled, type: DWord, value: 0 }
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Server', name: DisabledByDefault, type: DWord, value: 1 }
      # 5: send NTLMv2 only, and refuse LM and NTLMv1 (PingCastle S-OldNtlm;
      # unset, Windows uses 3, which accepts them). On 2026-11-21 the Security
      # logs of the four servers (32 to 41 days) had no LM or NTLMv1 logon of
      # a real account. The only NTLM V1 entries were ANONYMOUS LOGON (null
      # sessions), which carry no password and which this setting does not
      # change.
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: LmCompatibilityLevel, type: DWord, value: 5 }

  # The time hierarchy. Every domain controller gets its time from the domain.
  # The PDC emulator gets its time from ntp_servers, and is the reliable source
  # for the domain. The other computers follow the domain by default. If the
  # PDC emulator role moves, the two GPOs move with it.
  - name: Domain Controller - Time
    comment: >-
      The domain controllers get their time from the domain hierarchy. Made by
      LINDS-Ansible, role windows_gpo. Do not edit it in GPMC.
    policy:
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Parameters', name: Type, type: String, value: NT5DS }
      # 10: a time server, and a reliable one only if it is the PDC emulator.
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Config', name: AnnounceFlags, type: DWord, value: 10 }

  # The security settings of the domain controllers.
  - name: Domain Controller - Security
    comment: >-
      LDAP channel binding and the audit policy of the domain controllers.
      Made by LINDS-Ansible, role windows_gpo. Do not edit it in GPMC.
    preferences:
      # LDAP channel binding when the client supports it (PingCastle
      # A-DCLdapsChannelBinding). 2 would also refuse clients that cannot.
      # LDAP signing is already required (LDAPServerIntegrity 2).
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters', name: LdapEnforceChannelBinding, type: DWord, value: 1 }
      # Audit: Force audit policy subcategory settings to override audit
      # policy category settings. The domain controllers then use the
      # audit_policy below and ignore the old categories of "Server - GPO".
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: SCENoApplyLegacyAuditPolicy, type: DWord, value: 1 }
    # Each subcategory that was on before (auditpol on all three domain
    # controllers, 2026-11-21: the old categories of "Server - GPO" and the
    # Windows defaults), then four more (PingCastle A-AuditDC): Security
    # System Extension (4697, a new service), Process Creation (4688), DPAPI
    # Activity (4692, an export of the DPAPI backup key) and Sensitive
    # Privilege Use. The attack alerts in LINDS-Kubernetes
    # (base/monitoring/windows-security-alerts.yaml) read Kerberos 4768 and
    # 4769 and Directory Service Access 4662: keep these on.
    audit_policy:
      - { subcategory: System Integrity, guid: '{0CCE9212-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Other System Events, guid: '{0CCE9214-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Security State Change, guid: '{0CCE9210-69AE-11D9-BED3-505054503030}', setting: success }
      - { subcategory: Logon, guid: '{0CCE9215-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Logoff, guid: '{0CCE9216-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Account Lockout, guid: '{0CCE9217-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: IPsec Main Mode, guid: '{0CCE9218-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: IPsec Quick Mode, guid: '{0CCE9219-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: IPsec Extended Mode, guid: '{0CCE921A-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Special Logon, guid: '{0CCE921B-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Other Logon/Logoff Events, guid: '{0CCE921C-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Network Policy Server, guid: '{0CCE9243-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: User / Device Claims, guid: '{0CCE9247-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Group Membership, guid: '{0CCE9249-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Access Rights, guid: '{0CCE924B-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Audit Policy Change, guid: '{0CCE922F-69AE-11D9-BED3-505054503030}', setting: success }
      - { subcategory: Authentication Policy Change, guid: '{0CCE9230-69AE-11D9-BED3-505054503030}', setting: success }
      - { subcategory: Computer Account Management, guid: '{0CCE9236-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Security Group Management, guid: '{0CCE9237-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Distribution Group Management, guid: '{0CCE9238-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Application Group Management, guid: '{0CCE9239-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Other Account Management Events, guid: '{0CCE923A-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: User Account Management, guid: '{0CCE9235-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Directory Service Access, guid: '{0CCE923B-69AE-11D9-BED3-505054503030}', setting: success }
      - { subcategory: Kerberos Service Ticket Operations, guid: '{0CCE9240-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Other Account Logon Events, guid: '{0CCE9241-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Kerberos Authentication Service, guid: '{0CCE9242-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Credential Validation, guid: '{0CCE923F-69AE-11D9-BED3-505054503030}', setting: success_and_failure }
      - { subcategory: Security System Extension, guid: '{0CCE9211-69AE-11D9-BED3-505054503030}', setting: success }
      - { subcategory: Process Creation, guid: '{0CCE922B-69AE-11D9-BED3-505054503030}', setting: success }
      - { subcategory: DPAPI Activity, guid: '{0CCE922D-69AE-11D9-BED3-505054503030}', setting: success }
      - { subcategory: Sensitive Privilege Use, guid: '{0CCE9228-69AE-11D9-BED3-505054503030}', setting: success }

  # Link it before "Domain Controller - Time", so that it wins on the PDC emulator.
  - name: PDC Emulator - Time
    comment: >-
      The PDC emulator gets its time from the external NTP servers. Made by
      LINDS-Ansible, role windows_gpo. Do not edit it in GPMC.
    wmi_filter: PDC emulator
    policy:
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Parameters', name: Type, type: String, value: NTP }
      - key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Parameters'
        name: NtpServer
        type: String
        value: "{{ ntp_servers | map('regex_replace', '$', ',0x8') | join(' ') }}"
      # 5: always a time server, and always a reliable one.
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Config', name: AnnounceFlags, type: DWord, value: 5 }

  # Accounts that only connect over the network: the group Service Accounts
  # (svc-k8s-smb for the cluster's SMB volumes) and svc-plex-smb (Plex on
  # linds-plex-01). svc-plex-smb is not in the group, because the group can
  # change immich and photos. "Access this computer from the network" stays
  # allowed; every other logon is denied on every computer.
  - name: Service Accounts - Network Logon Only
    comment: >-
      Denies the service accounts every logon except over the network.
      Made by LINDS-Ansible, role windows_gpo. Do not edit it in GPMC.
    privilege_rights:
      SeDenyInteractiveLogonRight: &network_only ['LINDS\Service Accounts', 'LINDS\svc-plex-smb']
      SeDenyRemoteInteractiveLogonRight: *network_only
      SeDenyBatchLogonRight: *network_only
      SeDenyServiceLogonRight: *network_only

# The Default Domain Policy is linked to the domain and enforced, so these
# values overrode the two GPOs above on every computer.
windows_gpo_remove_values:
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Parameters', name: NtpServer }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Parameters', name: Type }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: Enabled }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: CrossSiteSyncFlags }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: ResolvePeerBackoffMinutes }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: ResolvePeerBackoffMaxTimes }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: SpecialPollInterval }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: EventLogFlags }
