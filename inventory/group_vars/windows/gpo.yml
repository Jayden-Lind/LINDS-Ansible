---
# The GPOs that the code owns (role windows_gpo). Their links are in
# directory.yml, windows_directory_gpo_links. Apply with `ansible-playbook playbooks/windows.yml --tags gpo,directory`.

windows_gpo_wmi_filters:
  - name: PDC emulator
    description: The domain controller that holds the PDC emulator role.
    query: SELECT * FROM Win32_ComputerSystem WHERE DomainRole = 5

windows_gpo_definitions:
  # The settings of roles/windows_baseline, kept in place after the domain join.
  # If you change a setting here, change it in that role too.
  - name: Server - Baseline
    comment: >-
      Firewall, Defender, event logs, Remote Desktop, SMB1, Print Spooler, CPU
      mitigations and IPv6 of the servers. Made by LINDS-Ansible, role
      windows_gpo. Do not edit it in GPMC.
    # The computer names of the servers in the inventory group windows_managed.
    apply_to: "{{ groups['windows_managed'] | map('split', '.') | map('first') | map('upper') | list }}"
    policy:
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile', name: EnableFirewall, type: DWord, value: 1 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile', name: EnableFirewall, type: DWord, value: 1 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile', name: EnableFirewall, type: DWord, value: 1 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection', name: DisableRealtimeMonitoring, type: DWord, value: 0 }
      # The maximum size of each event log, in KB.
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security', name: MaxSize, type: DWord, value: 1048576 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\System', name: MaxSize, type: DWord, value: 262144 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application', name: MaxSize, type: DWord, value: 262144 }
      # Allow Remote Desktop, with Network Level Authentication.
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services', name: fDenyTSConnections, type: DWord, value: 0 }
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services', name: UserAuthentication, type: DWord, value: 1 }
    # No administrative template has these settings, so they are preference
    # items. A preference item stays on the server if the GPO goes.
    preferences:
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: SMB1, type: DWord, value: 0 }
      # 4 is Disabled. The service stops at the next restart.
      - { key: 'HKLM\SYSTEM\CurrentControlSet\Services\Spooler', name: Start, type: DWord, value: 4 }
      # 3 turns off the mitigations for Spectre variant 2 and Meltdown. The
      # change takes effect at the next restart. See windows_baseline_cpu_mitigations.
      - key: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
        name: FeatureSettingsOverride
        type: DWord
        value: 3
        state: "{{ 'absent' if windows_baseline_cpu_mitigations | default(true) | bool else 'present' }}"
      - key: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
        name: FeatureSettingsOverrideMask
        type: DWord
        value: 3
        state: "{{ 'absent' if windows_baseline_cpu_mitigations | default(true) | bool else 'present' }}"
      # 255 turns off IPv6 on every interface except the loopback. The change
      # takes effect at the next restart. See windows_baseline_ipv6.
      - key: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
        name: DisabledComponents
        type: DWord
        value: 255
        state: "{{ 'absent' if windows_baseline_ipv6 | default(true) | bool else 'present' }}"

  # The time hierarchy. Every domain controller gets its time from the domain.
  # The PDC emulator gets its time from ntp_servers, and is the reliable source
  # for the domain. The other computers follow the domain by default. If the
  # PDC emulator role moves, the two GPOs move with it.
  - name: Domain Controller - Time
    comment: >-
      The domain controllers get their time from the domain hierarchy. Made by
      LINDS-Ansible, role windows_gpo. Do not edit it in GPMC.
    policy:
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Parameters', name: Type, type: String, value: NT5DS }
      # 10: a time server, and a reliable one only if it is the PDC emulator.
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Config', name: AnnounceFlags, type: DWord, value: 10 }

  # Link it before "Domain Controller - Time", so that it wins on the PDC emulator.
  - name: PDC Emulator - Time
    comment: >-
      The PDC emulator gets its time from the external NTP servers. Made by
      LINDS-Ansible, role windows_gpo. Do not edit it in GPMC.
    wmi_filter: PDC emulator
    policy:
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Parameters', name: Type, type: String, value: NTP }
      - key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Parameters'
        name: NtpServer
        type: String
        value: "{{ ntp_servers | map('regex_replace', '$', ',0x8') | join(' ') }}"
      # 5: always a time server, and always a reliable one.
      - { key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Config', name: AnnounceFlags, type: DWord, value: 5 }

  # Accounts that only connect over the network: the group Service Accounts
  # (svc-k8s-smb for the cluster's SMB volumes) and svc-plex-smb (Plex on
  # linds-plex-01). svc-plex-smb is not in the group, because the group can
  # change immich and photos. "Access this computer from the network" stays
  # allowed; every other logon is denied on every computer.
  - name: Service Accounts - Network Logon Only
    comment: >-
      Denies the service accounts every logon except over the network.
      Made by LINDS-Ansible, role windows_gpo. Do not edit it in GPMC.
    privilege_rights:
      SeDenyInteractiveLogonRight: &network_only ['LINDS\Service Accounts', 'LINDS\svc-plex-smb']
      SeDenyRemoteInteractiveLogonRight: *network_only
      SeDenyBatchLogonRight: *network_only
      SeDenyServiceLogonRight: *network_only

# The Default Domain Policy is linked to the domain and enforced, so these
# values overrode the two GPOs above on every computer.
windows_gpo_remove_values:
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Parameters', name: NtpServer }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\Parameters', name: Type }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: Enabled }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: CrossSiteSyncFlags }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: ResolvePeerBackoffMinutes }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: ResolvePeerBackoffMaxTimes }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: SpecialPollInterval }
  - { gpo: Default Domain Policy, key: 'HKLM\SOFTWARE\Policies\Microsoft\W32Time\TimeProviders\NtpClient', name: EventLogFlags }
