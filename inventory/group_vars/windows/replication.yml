---
# The NAS replication group between the two file servers (role windows_dfsr).
# Apply with `ansible-playbook playbooks/windows.yml --tags dfsr`. Read roles/windows_dfsr/README.md first.

dfsr_group: NAS

dfsr_folders:
  - business doc
  - Cheryls Files
  - holiday videos
  - immich
  - Jayden
  - Music
  - papa usb
  - Personal Files
  - Photos
  - server
  - Zoe

# immich was only on JD-FS-01 and server only on LINDS-DC when they were added.
dfsr_initial_primary:
  immich: JD-FS-01
  server: LINDS-DC

dfsr_members:
  JD-FS-01: "D:"
  LINDS-DC: "E:"

dfsr_connections:
  - { source: JD-FS-01, destination: LINDS-DC }
  - { source: LINDS-DC, destination: JD-FS-01 }

# The folders hold raw photos and video, so the staging quota is far above the
# 4 GB default.
dfsr_staging_quota_mb: 102400
dfsr_staging_quota_overrides_mb:
  holiday videos: 300000
  immich: 49152    # the 32 largest files are 45 GiB together
  Jayden: 200000
  Photos: 200000
  server: 262144   # three Veeam backups of 33-66 GiB; the whole folder is 248 GiB

dfsr_conflict_quota_mb: 204800
dfsr_rdc_enabled: true
