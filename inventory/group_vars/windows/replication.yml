---
# The NAS replication group between the two file servers (role windows_dfsr).
# Apply with `ansible-playbook playbooks/windows.yml --tags dfsr`. Read roles/windows_dfsr/README.md first.

dfsr_group: NAS

dfsr_folders:
  - business doc
  - Cheryls Files
  - holiday videos
  - immich
  - Jayden
  - Music
  - papa usb
  - Personal Files
  - Photos
  - server
  - Zoe

# immich was only on JD-FS-01 and server only on LINDS-DC when they were added.
dfsr_initial_primary:
  immich: JD-FS-01
  server: LINDS-DC

dfsr_members:
  JD-FS-01: "D:"
  LINDS-DC: "E:"

dfsr_connections:
  - { source: JD-FS-01, destination: LINDS-DC }
  - { source: LINDS-DC, destination: JD-FS-01 }

# The staging quota of each folder, for normal replication. The staging copies
# stay on the data volume up to the quota, and with two members nothing reads
# them again. holiday videos and server have single files of 30 to 66 GiB.
#
# CAUTION: Before a member joins again, or before a permission change on a
# large folder, set the full-sync quotas from
# docs/windows/runbooks/replication.md. With these quotas a full sync is slow.
dfsr_staging_quota_mb: 32768
dfsr_staging_quota_overrides_mb:
  holiday videos: 131072
  server: 131072

dfsr_conflict_quota_mb: 204800
dfsr_rdc_enabled: true
