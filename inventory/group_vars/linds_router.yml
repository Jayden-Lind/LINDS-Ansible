---
# linds-router-01 — the Debian 13 replacement for linds-vyos-01 (roles/router).
#
# Nearly everything is a plain file: roles/router/files/linds/etc/ for what
# is this site's, roles/router/files/etc/ for what every router gets (edit
# those). What is here is what the few remaining templates need: the
# WireGuard tunnel (its endpoint and keys are vaulted in
# inventory/router.yml), which of the role's optional parts this site has,
# and what the validator checks for.

router_hostname: linds-router-01
# The directory under roles/router/files/ that holds this site's files.
router_site: linds

# The kernel jd-router-01 runs: trixie-backports (7.x), the kernel before it
# kept as a fallback GRUB entry. The flowtable's handling of VLANs on the LAN trunk
# was proven on that kernel, so this router does not get a different one.
router_kernel_backports: true

# What this site has of the role's optional parts: everything that does not
# need hardware it lacks. UPnP, the mDNS reflector and Suricata are on by
# default and stay on. There is one WAN, so no failover daemon
# (router_failover), and remote access terminates at JD (router_road_warrior).

# NordVPN egress for VLAN 36. The tunnel's .netdev is rendered from this (the
# peer values are vault secrets); its .network with the policy routing is a
# plain file: files/linds/etc/systemd/network/30-wg101.network. host_name:
# re-resolved by the wg-reresolve timer when NordVPN rotates the server
# behind the name (VyOS: `peer nordvpn host-name`).
router_wireguard_tunnels:
  - name: wg101
    mtu: 1420
    table: 100
    private_key: "{{ wg_priv_key }}"
    peer:
      host_name: "{{ wg_host }}"
      public_key: "{{ wg_pub_key }}"

# Every interface files/linds/etc/systemd/network defines; validate.yml fails
# the run if networkd is not showing one of them.
router_expected_interfaces:
  - lan0
  - wan0
  - lan0.36
  - lan0.80
  - lan0.110
  - lan0.300
  - wg101
  - ipsec0

# What else validate.yml prints for this site (the one connection it checks
# for, LINDS, is the role's default).
router_routing_tables:
  - {id: 100, name: wg101}
