# The domain root and every OU, with the GPOs linked to each, in order.
- dn: DC=linds,DC=com,DC=au
  description: null
  protected_from_deletion: null
  gp_inheritance_blocked: false
  gpo_links:
    - order: 1
      gpo: Default Domain Policy
      enabled: true
      enforced: true
- dn: OU=Domain Controllers,DC=linds,DC=com,DC=au
