---
# Versions are pinned so that Renovate can see them: it ignores an entry with
# no version. `ansible-galaxy collection install -r requirements.yml --force`
# installs exactly these; to move one, merge its Renovate PR (or edit the pin)
# and run that again.
collections:
  - name: ansible.posix
    version: 2.2.2
  - name: community.general
    version: 14.0.0
  - name: arensb.truenas
    version: 2.0.3
  - name: vyos.vyos
    version: 6.2.0
  - name: ansible.windows
    version: 3.9.2
  - name: community.windows
    version: 3.3.0
  - name: microsoft.ad
    version: 1.12.1
