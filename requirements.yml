---
# Versions are pinned so that Renovate can see them: it ignores an entry with
# no version. `make update-requirements` installs exactly these; to move one,
# merge its Renovate PR (or edit the pin) and run that again.
roles:
  - name: robertdebock.autofs
    version: 2.1.10
  - name: robertdebock.auto_update
    version: 3.1.9
  - name: robertdebock.epel
    version: 4.1.7
  - name: robertdebock.ntp
    version: 3.1.7
  - name: robertdebock.logrotate
    version: 2.11.2
  - name: claranet.motd
    version: 2.2.0
collections:
  - name: ansible.posix
    version: 2.2.2
  - name: community.general
    version: 13.5.0
  - name: devsec.hardening
    version: 11.0.0
  - name: kubernetes.core
    version: 6.2.0
  - name: arensb.truenas
    version: 2.0.3
  - name: vyos.vyos
    version: 6.1.0
  - name: community.crypto
    version: 3.0.5
  - name: community.vmware
    version: 7.0.0
  - name: ansible.windows
    version: 3.8.0
  - name: community.windows
    version: 3.1.0
  - name: microsoft.ad
    version: 1.12.1
