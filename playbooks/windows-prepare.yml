---
# Apply the baseline and all Windows updates to a new clone of the template, at
# its DHCP address. Nothing in the domain changes. Use it while the old server
# with the same name is still in service.
#
#   make windows-prepare HOST=<fqdn> ADDRESS=<DHCP address of the clone>
#
# Read playbooks/windows-prepare.md before you use it.

- name: Check the request
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Make sure that the server is in the inventory and has an address
      ansible.builtin.assert:
        that:
          - target is defined
          - target in groups['windows']
          - bootstrap_address is defined
        fail_msg: Give -e target=<fqdn> (a host in the windows group) and -e bootstrap_address=<DHCP address>.

- name: Apply the baseline and the updates to the clone
  hosts: "{{ target | default('none') }}"
  gather_facts: false
  vars_files:
    - vars/windows-local-admin.yml
  vars:
    ansible_host: "{{ bootstrap_address }}"
    windows_baseline_updates: true
  pre_tasks:
    - name: Wait for the clone to answer
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        sleep: 10
        timeout: 900
  roles:
    - windows_baseline
