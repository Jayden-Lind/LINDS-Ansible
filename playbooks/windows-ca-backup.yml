---
# Back up the key, the database and the settings of the certification
# authority to windows-state/ca/backup, encrypted with the Ansible vault.
#
#   ansible-playbook playbooks/windows-ca-backup.yml
#
# Read playbooks/windows-ca-backup.md before you use it.

- name: Prepare
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # In memory, not on disk: the password is here in the clear for a moment.
    # If the backup itself fails the run stops before the last play, and an
    # empty windows-ca-backup-* folder is left in /dev/shm.
    - name: Make a work directory
      ansible.builtin.tempfile:
        state: directory
        prefix: windows-ca-backup-
        path: /dev/shm
      register: windows_ca_backup_tmp

    - name: Work out where the state goes
      ansible.builtin.set_fact:
        windows_ca_backup_work: "{{ windows_ca_backup_tmp.path }}"
        windows_state_dir: "{{ windows_state_dir | default(playbook_dir ~ '/../windows-state') | realpath }}"

    # Reuse the password of an earlier backup, so that it stays the one
    # password for this CA's key.
    - name: Look for the password of an earlier backup
      ansible.builtin.stat:
        path: "{{ windows_state_dir }}/ca/backup/password.yml"
      register: windows_ca_backup_earlier

    - name: Read it
      ansible.builtin.include_vars:
        file: "{{ windows_state_dir }}/ca/backup/password.yml"
      when: windows_ca_backup_earlier.stat.exists
      no_log: true

    - name: Or make one
      ansible.builtin.set_fact:
        windows_ca_backup_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['ascii_letters', 'digits']) }}"
      when: windows_ca_backup_password is not defined
      no_log: true

- name: Take the backup
  hosts: windows_ca
  gather_facts: false
  tasks:
    - name: Back up the CA
      ansible.builtin.include_role:
        name: windows_ca
        tasks_from: backup
      vars:
        windows_ca_backup_password: "{{ hostvars['localhost'].windows_ca_backup_password }}"
        windows_ca_backup_work: "{{ hostvars['localhost'].windows_ca_backup_work }}"

- name: Store it
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    state_tool: "{{ playbook_dir }}/../scripts/windows_state.py"
    vault_file: "{{ playbook_dir }}/../vault_password"
  tasks:
    - name: Encrypt and store, then prove it opens
      block:
        - name: Put the password where the storing step will find it
          ansible.builtin.copy:
            content: "{{ windows_ca_backup_password }}"
            dest: "{{ windows_ca_backup_work }}/ca-backup-password"
            mode: "0600"
          no_log: true

        - name: Encrypt the backup with the vault into the state directory
          ansible.builtin.command:
            argv: ["{{ ansible_playbook_python }}", "{{ state_tool }}", ca-backup, "{{ windows_ca_backup_work }}", "{{ windows_state_dir }}", "{{ vault_file }}"]
          register: windows_ca_backup_stored
          changed_when: true

        - name: Open what was stored and check the key belongs to the certificate
          ansible.builtin.command:
            argv: ["{{ ansible_playbook_python }}", "{{ state_tool }}", verify-ca-backup, "-", "{{ windows_state_dir }}", "{{ vault_file }}"]
          register: windows_ca_backup_verified
          changed_when: false
      always:
        - name: Remove the work directory
          ansible.builtin.file:
            path: "{{ windows_ca_backup_work }}"
            state: absent

    - name: Show the result
      ansible.builtin.debug:
        msg: "{{ [windows_ca_backup_stored.stdout] + windows_ca_backup_verified.stdout_lines }}"
