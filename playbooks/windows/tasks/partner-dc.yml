---
# Choose the existing domain controller that makes or removes the directory
# objects of the server in `target` (the partner), and put it in the group
# windows_partner_dc. Prefer a domain controller in the same AD site, because
# the server talks to that one. `-e windows_join_dc=<fqdn>` sets it.
- name: Choose the partner domain controller
  ansible.builtin.add_host:
    name: "{{ windows_join_dc | default((same_site + others) | first) }}"
    groups: windows_partner_dc
  vars:
    # reject, not difference: difference does not keep the inventory's order.
    others: "{{ groups['windows_dc'] | reject('equalto', target) | list }}"
    same_site: >-
      {{ others | map('extract', hostvars) | selectattr('ad_site', 'defined')
         | selectattr('ad_site', 'equalto', hostvars[target].ad_site | default(''))
         | map(attribute='inventory_hostname') | list }}
  changed_when: false
