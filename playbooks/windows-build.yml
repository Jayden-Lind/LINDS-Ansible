---
# Build a Windows server from a fresh clone of the template, up to and
# including promotion to a domain controller.
#
# The clone comes from LINDS-Terraform (packer/windows builds the template,
# proxmox/vms-linds.tf clones it). It arrives with a random name, a DHCP
# address and a local Administrator password that is in the vault. From there:
#
#   make windows-build   HOST=<fqdn> ADDRESS=<its DHCP address>
#       name and address it, apply the baseline and updates, join the domain
#   make windows-edition HOST=<fqdn>
#       convert an Evaluation install (asks for the product key)
#   make windows-promote HOST=<fqdn>
#       promote it to a domain controller (restore-mode password from the
#       vault, or typed)
#
# HOST must already be in inventory/windows.yml with its windows_* variables.
# Needs a Kerberos ticket (`make kinit`) for everything except the first two
# plays, which talk to the clone as its local Administrator.
#
# The first three stages cannot be re-run against a finished domain
# controller: it has no local Administrator left to connect as.

- name: Check the request
  hosts: localhost
  gather_facts: false
  tags: always
  tasks:
    - name: The host to build must be named and known
      ansible.builtin.assert:
        that:
          - target is defined
          - target in groups['windows']
        fail_msg: Pass -e target=<fqdn>, a host in the windows group of the inventory.

    - name: Pick the domain controller that will act for it
      ansible.builtin.import_tasks: tasks/windows-partner-dc.yml

- name: Name and address the fresh clone
  hosts: "{{ target | default('unset') }}"
  gather_facts: false
  tags: bootstrap
  vars:
    ansible_host: "{{ bootstrap_address }}"
    ansible_user: Administrator
    ansible_password: "{{ vault_windows_bootstrap_password }}"
    ansible_winrm_transport: ntlm
  roles:
    - windows_bootstrap

- name: Baseline and updates, before it joins anything
  hosts: "{{ target | default('unset') }}"
  gather_facts: false
  tags: baseline
  vars:
    ansible_host: "{{ windows_ipv4_address }}"
    ansible_user: Administrator
    ansible_password: "{{ vault_windows_bootstrap_password }}"
    ansible_winrm_transport: ntlm
    windows_baseline_updates: true
  pre_tasks:
    # The bootstrap play leaves the machine renaming, re-addressing and
    # restarting itself.
    - name: Wait for the machine on its own address
      ansible.builtin.wait_for_connection:
        delay: 30
        connect_timeout: 10
        sleep: 10
        timeout: 900

    - name: Check that it came back under its own name
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $env:COMPUTERNAME
      register: windows_build_name
      changed_when: false
      failed_when: windows_build_name.output[0] | lower != windows_hostname | lower
  roles:
    - windows_baseline

- name: See whether it is already in the domain
  hosts: "{{ target | default('unset') }}"
  gather_facts: false
  tags: join
  vars:
    ansible_host: "{{ windows_ipv4_address }}"
    ansible_user: Administrator
    ansible_password: "{{ vault_windows_bootstrap_password }}"
    ansible_winrm_transport: ntlm
  tasks:
    - name: Read the domain membership
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          [bool](Get-CimInstance Win32_ComputerSystem).PartOfDomain
      register: windows_build_membership
      changed_when: false

    - name: Remember whether a join is needed
      ansible.builtin.set_fact:
        windows_build_needs_join: "{{ not windows_build_membership.output[0] }}"

- name: Create its computer account on an existing domain controller
  hosts: windows_partner_dc
  gather_facts: false
  tags: join
  tasks:
    - name: Provision the offline domain join
      ansible.builtin.include_role:
        name: windows_domain_join
        tasks_from: provision
      vars:
        windows_domain_join_machine: "{{ hostvars[target].windows_hostname }}"
      when: hostvars[target].windows_build_needs_join

- name: Join the domain
  hosts: "{{ target | default('unset') }}"
  gather_facts: false
  tags: join
  vars:
    ansible_host: "{{ windows_ipv4_address }}"
    ansible_user: Administrator
    ansible_password: "{{ vault_windows_bootstrap_password }}"
    ansible_winrm_transport: ntlm
  tasks:
    - name: Consume the offline domain join
      ansible.builtin.include_role:
        name: windows_domain_join
        tasks_from: join
      vars:
        windows_domain_join_blob: "{{ hostvars[groups['windows_partner_dc'][0]].windows_domain_join_blob }}"
      when: windows_build_needs_join

# A machine changes its password as it joins, on the domain controller nearest
# to it. The operator's Kerberos client asks a different one, which for the
# next quarter of an hour would issue tickets under the previous key. The new
# member accepts those (it remembers its previous password); once promoted it
# does not, and the restart after promotion then waits for half an hour on
# "the specified credentials were rejected by the server". So: get the new key
# everywhere, then throw away whatever tickets were issued for this name
# before. Renewing the ticket-granting ticket empties the cache of them.
- name: Get its new key onto every domain controller
  hosts: windows_partner_dc
  gather_facts: false
  tags: join
  tasks:
    - name: Replicate until every domain controller holds it
      ansible.builtin.include_role:
        name: windows_ad_converge
      vars:
        windows_ad_converge_computer: "{{ hostvars[target].windows_hostname }}"
        windows_ad_converge_state: present
      when: hostvars[target].windows_build_needs_join

- name: Forget tickets issued for this name before
  hosts: localhost
  gather_facts: false
  tags: join
  tasks:
    - name: Renew the Kerberos ticket
      ansible.builtin.command:
        cmd: timeout 30 kinit -R
        stdin: ""
      register: windows_build_renew
      changed_when: false
      failed_when: false
      when: hostvars[target].windows_build_needs_join | default(false)

    - name: Say so if it could not be renewed
      ansible.builtin.debug:
        msg: >-
          The Kerberos ticket could not be renewed
          ({{ windows_build_renew.stderr | default('') | trim }}). If the next
          stage is refused with "credentials were rejected", run `make kinit`.
      when:
        - windows_build_renew is not skipped
        - windows_build_renew.rc != 0

# From here on the server is a domain member and is reached like every other
# Windows host: over Kerberos, as the operator.

- name: Make sure it is not an Evaluation install
  hosts: "{{ target | default('unset') }}"
  gather_facts: false
  tags: [edition, promote]
  roles:
    - windows_edition

- name: Promote to a domain controller
  hosts: "{{ target | default('unset') }}"
  gather_facts: false
  tags: promote
  roles:
    - windows_baseline
    - windows_domain_controller
    - windows_dc_time
