---
# The jump host: the hardening, the trim and the kernel command line of the
# role `common`.
#
#   ansible-playbook playbooks/jump.yml --check --diff
#
# Read playbooks/jump.md before you use it.

- name: Harden and trim the jump host
  hosts: jump
  become: true
  tasks:
    # The connection is local. On a different computer the play would change
    # that computer.
    - name: Make sure that this is the jump host
      ansible.builtin.assert:
        that: ansible_facts.hostname == 'jd-jump-01'
        fail_msg: Run this playbook on jd-jump-01.

    # `apply` gives the tag to the tasks in each file, so that `--tags <part>`
    # runs them. Without it, the tag selects only the include.
    - name: Apply the hardening of the role common
      ansible.builtin.include_role:
        name: common
        tasks_from: hardening.yml
        apply:
          tags: [hardening]
      tags: [hardening]

    - name: Apply the trim of the role common
      ansible.builtin.include_role:
        name: common
        tasks_from: trim.yml
        apply:
          tags: [trim]
      tags: [trim]

    - name: Set the kernel command line of the role common
      ansible.builtin.include_role:
        name: common
        tasks_from: kernel-cmdline.yml
        apply:
          tags: [kernel-cmdline]
      tags: [kernel-cmdline]
