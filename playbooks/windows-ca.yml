---
# Install the certification authority on one server: restored from the backup
# in windows-state/ca/backup if there is one, new if there is not.
#
#   make windows-ca HOST=<fqdn>
#
# Read playbooks/windows-ca.md before you use it.

- name: Check the request
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The host must be named and be the CA in the inventory
      ansible.builtin.assert:
        that:
          - target is defined
          - target in groups['windows_ca'] | default([])
        fail_msg: Pass -e target=<fqdn>, a host in the windows_ca group of the inventory.

- name: Certification authority
  hosts: "{{ target | default('unset') }}"
  gather_facts: false
  tasks:
    - name: Install or restore the CA
      ansible.builtin.include_role:
        name: windows_ca
        tasks_from: install
