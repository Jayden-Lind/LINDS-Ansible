---
# Apply the server baseline to one server that is already in the domain.
#
#   make windows-baseline HOST=<fqdn>
#   make windows-baseline HOST=<fqdn> UPDATES=true            # also install updates
#   make windows-baseline HOST=<fqdn> TAGS=cpu-mitigations    # one setting only
#
# Read playbooks/windows-baseline.md before you use it.

- name: Check the request
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  tasks:
    - name: The host must be named and known
      ansible.builtin.assert:
        that:
          - target is defined
          - target in groups['windows']
        fail_msg: Pass -e target=<fqdn>, a host in the windows group of the inventory.

- name: Server baseline
  hosts: "{{ target | default('unset') }}"
  gather_facts: false
  roles:
    - windows_baseline
