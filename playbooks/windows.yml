---
# Apply the settings of the whole domain: sites, recovery, NAS replication,
# the GPOs that the code owns, and the directory (OUs, groups, users, GPO links).
#
#   make windows-check      # show what would change
#   make windows            # apply
#   make windows TAGS=dfsr  # one part only: topology, recovery, dfsr, gpo or directory
#
# Read playbooks/windows.md before you use it.

- name: Apply the settings of the forest and the domain
  hosts: windows_dc[0]
  gather_facts: false
  roles:
    - role: windows_ad_topology
      tags: topology
    - role: windows_ad_recovery
      tags: recovery
    - role: windows_dfsr
      tags: dfsr
    # Before the directory, which links the GPOs.
    - role: windows_gpo
      tags: gpo
    - role: windows_directory
      tags: directory
