---
# Apply the settings of the whole domain: sites, recovery, NAS replication,
# the directory (OUs, groups, users, GPO links) and the time hierarchy.
#
#   make windows-check      # show what would change
#   make windows            # apply
#   make windows TAGS=dfsr  # one part only: topology, recovery, dfsr, directory or time
#
# Read playbooks/windows.md before you use it.

- name: Apply the settings of the forest and the domain
  hosts: windows_dc[0]
  gather_facts: false
  roles:
    - role: windows_ad_topology
      tags: topology
    - role: windows_ad_recovery
      tags: recovery
    - role: windows_dfsr
      tags: dfsr
    - role: windows_directory
      tags: directory

- name: Put every domain controller in the time hierarchy
  hosts: windows_dc
  gather_facts: false
  roles:
    - role: windows_dc_time
      tags: time
