---
# Retire a domain controller. Hand over what it carries, demote it, stop it,
# and remove what is left of it in the directory and in DNS.
#
#   make windows-retire-dc HOST=<fqdn>                  # the server goes for good
#   make windows-retire-dc HOST=<fqdn> REPLACING=true   # a new server with the same name comes next
#
# Read playbooks/windows-retire-dc.md before you use it.

- name: Check the request
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  tasks:
    - name: Make sure that the server to retire is a domain controller in the inventory
      ansible.builtin.assert:
        that:
          - target is defined
          - target in groups['windows_dc']
          - hostvars[target].windows_domain is defined
        fail_msg: Give -e target=<fqdn>, a host in the windows_dc group of the inventory.

    - name: Choose the domain controller that does the work (the partner)
      ansible.builtin.import_tasks: tasks/windows-partner-dc.yml

- name: Look for replicated files that only the server to retire holds
  hosts: "{{ target | default('none') }}"
  gather_facts: false
  tags: [handover, unique-files]
  tasks:
    - name: Compare its replicated files with the files of its partner
      ansible.builtin.import_role:
        name: windows_dc_retire
        tasks_from: unique-files

- name: Move its FSMO roles and its replication memberships to the partner
  hosts: windows_partner_dc
  gather_facts: false
  tags: handover
  vars:
    windows_dc_retire_machine: "{{ hostvars[target].windows_hostname | default(target.split('.')[0]) }}"
  tasks:
    - name: Hand over the FSMO roles and the replication memberships
      ansible.builtin.import_role:
        name: windows_dc_retire
        tasks_from: handover

- name: Back up the CA for the last time
  ansible.builtin.import_playbook: windows-ca-backup.yml
  when: target in groups['windows_ca'] | default([])
  tags: handover

- name: Remove the CA from the server to retire
  hosts: "{{ target | default('none') }}"
  gather_facts: false
  tags: handover
  tasks:
    - name: Remove the CA role
      ansible.builtin.import_role:
        name: windows_ca
        tasks_from: remove
      when: inventory_hostname in groups['windows_ca'] | default([])

- name: Move replication between the sites to the partner
  hosts: windows_partner_dc
  gather_facts: false
  tags: bridgehead
  vars:
    windows_dc_retire_machine: "{{ hostvars[target].windows_hostname | default(target.split('.')[0]) }}"
  tasks:
    - name: Make the partner the preferred bridgehead of its site
      ansible.builtin.import_role:
        name: windows_dc_retire
        tasks_from: bridgehead

- name: Demote the server to retire and stop it
  hosts: "{{ target | default('none') }}"
  gather_facts: false
  roles:
    - windows_dc_retire

- name: Remove what is left of the server in the directory and in DNS
  hosts: windows_partner_dc
  gather_facts: false
  tags: cleanup
  vars:
    windows_dc_retire_machine: "{{ hostvars[target].windows_hostname | default(target.split('.')[0]) }}"
    windows_dc_retire_address: "{{ hostvars[target].windows_ipv4_address | default(hostvars[target].ansible_host) }}"
  tasks:
    - name: Clean up the directory and DNS
      ansible.builtin.import_role:
        name: windows_dc_retire
        tasks_from: cleanup
