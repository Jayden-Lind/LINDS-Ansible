---
# Depth by depth, so that a parent exists before its children.
- name: Make the OUs
  microsoft.ad.ou:
    name: "{{ item.1.ou.split(',')[0].split('=', 1)[1] }}"
    path: "{{ (item.1.ou.split(',')[1:] + [windows_directory_base]) | join(',') }}"
    description: "{{ item.1.description | default(omit, true) }}"
    protect_from_deletion: "{{ item.1.protected | default(true) }}"
    state: present
  loop: "{{ range(1, 8) | product(windows_directory_ous) | list }}"
  when: item.1.ou.split(',') | length == item.0
  loop_control:
    label: "{{ item.1.ou }}"

- name: Make the groups
  microsoft.ad.group:
    name: "{{ item.name }}"
    path: "{{ item.ou }},{{ windows_directory_base }}"
    scope: "{{ item.scope }}"
    category: "{{ item.category | default('security') }}"
    description: "{{ item.description | default(omit, true) }}"
    state: present
  loop: "{{ windows_directory_groups }}"
  loop_control:
    label: "{{ item.name }}"

- name: Make the users
  microsoft.ad.user:
    identity: "{{ item.name }}"
    name: "{{ item.display_name | default(item.name) }}"
    sam_account_name: "{{ item.name }}"
    path: "{{ item.ou }},{{ windows_directory_base }}"
    upn: "{{ item.upn | default(omit, true) }}"
    enabled: "{{ item.enabled | default(true) }}"
    description: "{{ item.description | default(omit, true) }}"
    password_never_expires: "{{ item.password_never_expires | default(omit) }}"
    password: "{{ windows_directory_initial_passwords[item.name] | default(omit) }}"
    update_password: on_create
    state: present
  loop: "{{ windows_directory_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: "{{ item.name in windows_directory_initial_passwords }}"

# --check cannot preview the membership of a group, or of a user, that the
# same run would create: it does not exist yet. Those show as errors in a
# check run, are ignored there, and are not errors in a real one.
- name: Set the exact members of the owned groups
  microsoft.ad.group:
    identity: "{{ item.key }}"
    members:
      set: "{{ item.value }}"
    state: present
  loop: "{{ windows_directory_members | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Set the exact members of the privileged groups
  microsoft.ad.group:
    identity: "{{ item.key }}"
    members:
      set: "{{ item.value }}"
    state: present
  loop: "{{ windows_directory_privileged | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  ignore_errors: "{{ ansible_check_mode }}"

# The last of the three tasks removes the links that this task finds.
- name: Find the GPO links that are not in the code
  ansible.windows.win_powershell:
    parameters:
      Base: "{{ windows_directory_base }}"
      Links: "{{ windows_directory_gpo_links | to_json }}"
    script: "{{ lookup('ansible.builtin.file', 'gpo-links-extra.ps1') }}"
  register: windows_directory_links_extra
  changed_when: false
  check_mode: false

# One container at a time, from the first link to the last. When a link is put
# at its place, the links after it move down by one.
# --check cannot link a GPO that the same run would create. That shows as an
# error in a check run, is ignored there, and is not an error in a real one.
- name: Link the GPOs in order
  microsoft.ad.gpo:
    name: "{{ item.1.gpo }}"
    target: "{{ windows_directory_base if item.0.key == 'domain' else item.0.key ~ ',' ~ windows_directory_base }}"
    order: "{{ item.0.value.index(item.1) + 1 }}"
    enabled: "{{ item.1.enabled | default(true) }}"
    enforced: "{{ item.1.enforced | default(false) }}"
    state: present
  loop: "{{ windows_directory_gpo_links | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }}: {{ item.0.value.index(item.1) + 1 }} {{ item.1.gpo }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Remove the GPO links that are not in the code
  microsoft.ad.gpo:
    guid: "{{ item.guid }}"
    target: "{{ item.target }}"
    state: absent
  loop: "{{ windows_directory_links_extra.output }}"
  loop_control:
    label: "{{ item.target }}: {{ item.gpo }}"

# No module sets the default password policy of a domain.
- name: Set the password policy
  ansible.windows.win_powershell:
    parameters:
      Policy: "{{ windows_directory_password_policy | to_json }}"
    script: "{{ lookup('ansible.builtin.file', 'password-policy.ps1') }}"
  register: windows_directory_policy
  when: windows_directory_password_policy is defined

- name: Set the machine account quota
  microsoft.ad.object:
    identity: "{{ windows_directory_base }}"
    type: domainDNS
    attributes:
      set:
        ms-DS-MachineAccountQuota: "{{ windows_directory_machine_account_quota | int }}"
    state: present
  when: windows_directory_machine_account_quota is defined

# Whatever Windows itself made is marked critical, and is not in the code.
- name: Read the users, groups and OUs of the domain
  microsoft.ad.object_info:
    ldap_filter: (|(&(objectCategory=person)(objectClass=user))(objectClass=group)(objectClass=organizationalUnit))
    properties: [sAMAccountName, isCriticalSystemObject]
  register: windows_directory_objects

- name: Show the result
  ansible.builtin.debug:
    msg:
      policy: "{{ windows_directory_policy.output | default([]) }}"
      not_in_the_code: "{{ (unmanaged_users + unmanaged_groups + unmanaged_ous) | sort }}"
  vars:
    found: "{{ windows_directory_objects.objects | rejectattr('isCriticalSystemObject') | list }}"
    unmanaged_users: >-
      {{ found | selectattr('ObjectClass', 'eq', 'user') | map(attribute='sAMAccountName')
         | reject('in', windows_directory_users | map(attribute='name') | list)
         | map('regex_replace', '^', 'user ') | list }}
    unmanaged_groups: >-
      {{ found | selectattr('ObjectClass', 'eq', 'group') | rejectattr('DistinguishedName', 'search', ',CN=Builtin,')
         | map(attribute='sAMAccountName') | reject('in', windows_directory_groups | map(attribute='name') | list)
         | map('regex_replace', '^', 'group ') | list }}
    unmanaged_ous: >-
      {{ found | selectattr('ObjectClass', 'eq', 'organizationalUnit') | map(attribute='DistinguishedName')
         | map('regex_replace', ',' ~ windows_directory_base ~ '$', '')
         | reject('in', windows_directory_ous | map(attribute='ou') | list)
         | map('regex_replace', '^', 'OU ') | list }}
