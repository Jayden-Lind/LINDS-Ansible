---
# What the directory must contain. Set the values in the inventory
# (inventory/group_vars/windows/directory.yml and directory.vault.yml). Read
# the README before you change them: membership and GPO links are exact.

# The distinguished name of the domain, made from windows_domain.
windows_directory_base: "DC={{ windows_domain.split('.') | join(',DC=') }}"

windows_directory_ous: []
windows_directory_groups: []
windows_directory_gpo_links: {}
windows_directory_users: []
windows_directory_members: {}
windows_directory_privileged: {}

# sAMAccountName to first password, in the vault. Used only when the role makes
# the account.
windows_directory_initial_passwords: {}

# Not set: the role does not change the setting of the domain.
# windows_directory_password_policy:
# windows_directory_machine_account_quota:
# windows_directory_ds_heuristics:
