---
# Trust the LINDS CA. The trust store is rebuilt only when the CA file changes.

- name: Copy the LINDS CA
  ansible.builtin.copy:
    src: LINDS-CA.enc
    dest: /usr/local/share/ca-certificates/LINDS-CA.crt
    decrypt: true
    mode: "0644"
  register: common_ca

- name: Rebuild the trust store
  ansible.builtin.command: update-ca-certificates
  changed_when: true
  when: common_ca is changed
