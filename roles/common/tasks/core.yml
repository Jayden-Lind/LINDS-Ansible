---
- name: Install the automatic updates
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Update the package lists and install the updates every day
  ansible.builtin.copy:
    src: 10periodic
    dest: /etc/apt/apt.conf.d/10periodic
    owner: root
    group: root
    mode: "0644"

- name: Keep the APT timers on
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

# pam_exec runs the script at each login and shows what it prints.
- name: Install the login message
  ansible.builtin.copy:
    src: dynmotd
    dest: /usr/local/bin/dynmotd
    owner: root
    group: root
    mode: "0755"

- name: Show the login message at each login
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: session optional pam_exec.so type=open_session stdout /usr/local/bin/dynmotd
  loop:
    - /etc/pam.d/login
    - /etc/pam.d/sshd

- name: Turn off the default login message (PAM)
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^(session\s+optional\s+pam_motd.so\s+.*)'
    replace: '# \1'
  loop:
    - /etc/pam.d/login
    - /etc/pam.d/sshd

- name: Turn off the default login message (sshd)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^PrintMotd "
    line: PrintMotd no

- name: Install logrotate
  ansible.builtin.apt:
    name: logrotate
    state: present

- name: Rotate the logs every day and keep seven, compressed
  ansible.builtin.copy:
    src: logrotate.conf
    dest: /etc/logrotate.conf
    owner: root
    group: root
    mode: "0644"

- name: Keep the logrotate timer on
  ansible.builtin.systemd_service:
    name: logrotate.timer
    state: started
    enabled: true

# The distribution keeps the clock in time (chrony or systemd-timesyncd).
- name: Set the time zone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Include authorized_keys
  ansible.posix.authorized_key:
    user: root
    state: present
    key: "{{ lookup('file', 'authorized_keys') }}"

- name: Include updating trust
  ansible.builtin.include_tasks:
    file: certificates.yml

- name: Ensure remote rsyslog config
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/90-remote.conf
    content: |
      {{ common_rsyslog_remote_line }}
    owner: root
    group: root
    mode: '0644'
  when: common_rsyslog_remote_line | length > 0
  notify: Restart rsyslog

- name: Copy UseDNS SSHD
  ansible.builtin.copy:
    src: 02-disabledns.conf
    dest: /etc/ssh/sshd_config.d
  register: sshd

- name: Restart SSHD (if config changed)
  ansible.builtin.systemd:
    name: sshd
    state: restarted
  when: sshd.changed

- name: Sysctl tuning
  ansible.builtin.include_tasks:
    file: sysctl.yml
  when: common_sysctl_enabled | bool
