---
- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
    enabled: true

- name: Update GRUB
  ansible.builtin.command: update-grub
  changed_when: true

- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Apply the kernel settings
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Stop the masked timers and sockets
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    daemon_reload: true
  loop: "{{ common_units_masked | reject('search', '\\.service$') | list }}"
  failed_when: false
