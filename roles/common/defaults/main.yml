---
# Common role defaults

common_rsyslog_remote_line: "*.* @(o)172.16.1.23:1514;RSYSLOG_SyslogProtocol23Format"

common_enable_qemu_guest_agent: true

common_timezone: Australia/Melbourne

common_disable_mitigations: true

common_sysctl_enabled: true
common_sysctl_vm_only: true
common_sysctl_highmem_threshold_mb: 32768

common_sysctl_highmem:
  vm.swappiness: 10
  vm.vfs_cache_pressure: 50
  vm.dirty_background_ratio: 2
  vm.dirty_ratio: 10
  vm.dirty_expire_centisecs: 3000
  vm.dirty_writeback_centisecs: 500
  fs.file-max: 2097152
  fs.inotify.max_user_watches: 1048576
  net.core.somaxconn: 4096
  net.core.netdev_max_backlog: 16384
  net.ipv4.tcp_fin_timeout: 15
  net.ipv4.tcp_keepalive_time: 300
  net.ipv4.tcp_keepalive_intvl: 30
  net.ipv4.tcp_keepalive_probes: 5
  net.ipv4.tcp_max_syn_backlog: 4096

# The kernel package for a VM: the HWE kernel without firmware and microcode.
common_ubuntu_vm_kernel: true
common_ubuntu_vm_kernel_package: linux-image-virtual-hwe-{{ ansible_facts['distribution_version'] }}
# The kernel packages for hardware. A name with * is a pattern.
common_ubuntu_hardware_kernel_packages:
  - linux-generic
  - linux-generic-hwe-*
  - linux-image-generic
  - linux-image-generic-hwe-*
  - linux-headers-*
  - linux-tools-*
  - linux-firmware
  - intel-microcode
  - amd64-microcode
  - firmware-sof-signed

# Hardening (tasks/hardening.yml).
# These accounts keep their SSH keys and lose their password.
common_password_locked_users:
  - jayden
# cloud-init makes `ubuntu` on a clone of the template.
common_absent_users:
  - ubuntu

# Trim (tasks/trim.yml).
common_cloud_init_disabled: true
# Packages that a VM does not use. See the README for the reason of each group.
common_packages_absent:
  # Services for hardware that a VM does not have.
  - modemmanager
  - usbmuxd
  - bolt
  - upower
  - udisks2
  - fwupd
  - fwupd-signed
  - thermald
  - ubuntu-drivers-common
  - open-vm-tools
  # Storage that these hosts do not have.
  - multipath-tools
  - open-iscsi
  - mdadm
  - bcache-tools
  - btrfs-progs
  - xfsprogs
  - ntfs-3g
  # polkit lets a user without sudo control services. The administrator
  # and Ansible use sudo. It has a setuid program.
  - polkitd
  # cron starts nothing here: logrotate, apt, the dpkg backup and e2scrub
  # each have a systemd timer. The minimal server has no cron.
  - cron
  - cron-daemon-common
  # Ubuntu Pro. The hosts are not attached to a contract. The client gets
  # news and contract data from Canonical. With it go the collection
  # ubuntu-minimal and update-manager-core; do-release-upgrade stays.
  - ubuntu-pro-client
  - ubuntu-pro-client-l10n
  # At the first start it gets random data from entropy.ubuntu.com, and sends
  # the versions of the kernel and of cloud-init with the request.
  - pollinate
  # snap and LXD.
  - snapd
  - lxd-installer
  - lxd-agent-loader
  # Crash reports and crash dumps. kdump-tools keeps 512 MB of memory.
  - apport
  - apport-symptoms
  - apport-core-dump-handler
  - python3-apport
  - kdump-tools
  - kexec-tools
  - makedumpfile
  # Timers and services that collect data or get news.
  - sysstat
  - landscape-common
  - motd-news-config
  - update-notifier-common
  - sos
  - packagekit
  - networkd-dispatcher
  # The telnet client. (ubuntu-standard needs an FTP client, so that stays.)
  - telnet
  - inetutils-telnet
  # Kernel trace tools.
  - bpftrace
  - bpfcc-tools
  - trace-cmd
  # NTP servers. chrony keeps the time.
  - ntpsec
  - ntp
# Tools that the minimal server does not have. No service uses them. A host
# for interactive work, such as the jump host, sets this list to [].
common_tool_packages_absent:
  - git
  - git-man
  - linux-perf
  - bpftool
  - lshw
  - ufw
  - iptables
  - man-db
  - manpages
  - info
  # Says which package has a command that is not installed. It gets an index
  # of all commands at each update of the package lists.
  - command-not-found
  - python3-commandnotfound
# Packages of the two lists above that a host keeps.
common_packages_keep: []
# Units that stay installed, because other packages need their package.
common_units_masked:
  # Gets news from motd.ubuntu.com.
  - motd-news.timer
  - motd-news.service
  # Ubuntu Pro. The hosts are not attached.
  - ua-timer.timer
  - ubuntu-advantage.service
  - esm-cache.service
  - apt-news.service
  # Only NFS version 3 uses rpcbind. The hosts mount with NFS version 4.
  - rpcbind.socket
  - rpcbind.service
