# Managed by LINDS-Ansible: roles/common/files/90-common-hardening.conf.

# No core files. Without apport the kernel writes the memory of a process
# that stops with an error to a file in its working directory.
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# Kernel addresses are hidden from all users. To use perf, set this to 0
# first.
kernel.kptr_restrict = 2
# A process can trace only its own children.
kernel.yama.ptrace_scope = 1
# Nothing can start a different kernel without a restart. The setting stays
# until the next restart.
kernel.kexec_load_disabled = 1
# The BPF compiler hides its constants from programs of all users.
net.core.bpf_jit_harden = 2

# A VM has one gateway and does not route. It does not need ICMP redirects,
# and a redirect lets one host on the network change the routes of this one.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
