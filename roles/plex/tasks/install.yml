---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gnupg2
      - cifs-utils
    state: present
    update_cache: true

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download and dearmor Plex signing key
  ansible.builtin.shell: >
    curl -fsSL https://downloads.plex.tv/plex-keys/PlexSign.v2.key |
    gpg --yes --dearmor -o /etc/apt/keyrings/plexmediaserver.v2.gpg
  args:
    creates: /etc/apt/keyrings/plexmediaserver.v2.gpg

- name: Add the Plex repository
  ansible.builtin.deb822_repository:
    name: plex
    types: deb
    uris: https://repo.plex.tv/deb/
    suites: public
    components: main
    signed_by: /etc/apt/keyrings/plexmediaserver.v2.gpg

# The same repository as one line, as apt_repository wrote it.
- name: Remove the old form of the repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/plex.list
    state: absent

- name: Install Plex Media Server
  ansible.builtin.apt:
    name: plexmediaserver
    state: present
    update_cache: true

- name: Plex enabled and started
  ansible.builtin.service:
    name: plexmediaserver
    enabled: true
    state: started
