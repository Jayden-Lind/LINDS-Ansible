---
- name: Read the crypto policy
  ansible.builtin.command: update-crypto-policies --show
  register: plex_crypto_policy_now
  changed_when: false
  check_mode: false

# LEGACY allows old, weak algorithms. It was set before this role was written
# down, and the reason is not known.
- name: Set the crypto policy
  ansible.builtin.command: update-crypto-policies --set {{ plex_crypto_policy }}
  changed_when: true
  when: plex_crypto_policy_now.stdout | trim != plex_crypto_policy

- name: Install CIFS and NFS utils
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items:
    - nfs-utils
    - cifs-utils
- name: Add Plex Repo
  ansible.builtin.yum_repository:
    name: Plex
    description: Plex repository
    baseurl: https://downloads.plex.tv/repo/rpm/$basearch/
    gpgkey: https://downloads.plex.tv/plex-keys/PlexSign.key
    gpgcheck: true

- name: Install Plex Media Server
  ansible.builtin.dnf:
    name: plexmediaserver
    state: present

- name: Plex enabled and started
  ansible.builtin.service:
    name: plexmediaserver
    enabled: true
    state: started
