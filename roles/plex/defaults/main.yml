---
# The shares under /mnt/. The inventory sets the servers and paths:
# plex_nas_server, plex_nas_path, plex_smb_server, plex_smb_path,
# plex_truenas_server and plex_truenas_path. The SMB account comes from
# vars/plex.yml (vault), loaded as the variable `plex`.

# systemd unmounts a share after this number of seconds without use.
plex_mount_idle_timeout: 60

# The options that make each line of /etc/fstab an automount: no mount at
# the start of the host, a mount at the first use, and the network first.
plex_mount_options:
  - noauto
  - x-systemd.automount
  - x-systemd.idle-timeout={{ plex_mount_idle_timeout }}
  - _netdev

# The file with the SMB user, password and domain. Only root reads it.
plex_smb_credentials_file: /etc/plex-smb.credentials

plex_mounts:
  - path: nas
    src: "{{ plex_nas_server }}:{{ plex_nas_path }}"
    fstype: nfs4
    options: [vers=4.2, soft]
  - path: cifs
    src: "//{{ plex_smb_server }}{{ plex_smb_path }}/"
    fstype: cifs
    options:
      - credentials={{ plex_smb_credentials_file }}
      - vers=3.1.1
      - dir_mode=0777
      - file_mode=0777
      - soft
  - path: truenas
    src: "{{ plex_truenas_server }}:{{ plex_truenas_path }}"
    fstype: nfs4
    options: [vers=4.2, soft]
