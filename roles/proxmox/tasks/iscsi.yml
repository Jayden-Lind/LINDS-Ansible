---
- name: Ensure rtslib-fb-target config directory exists
  ansible.builtin.file:
    path: "{{ proxmox_iscsi_saveconfig | dirname }}"
    state: directory
    owner: root
    group: root

# When target_core_mod loads at boot, it opens /etc/target. If the directory
# is missing, the kernel logs "db_root: cannot open: /etc/target" as an error.
# The directory stays empty: rtslib-fb-targetctl then changes the database
# directory to /etc/rtslib-fb-target, as it does without /etc/target.
- name: Make the directory that the iSCSI target module opens at load
  ansible.builtin.file:
    path: /etc/target
    state: directory
    owner: root
    group: root
    mode: "0755"

# The role does not write saveconfig.json. democratic-csi (the Kubernetes
# storage driver) makes the iSCSI targets and saves the file. A copy from
# this repository would replace those targets.

# Boot-time race: targetctl restore can run before ZFS zvol /dev links from
# late-imported pools exist, silently dropping block backstores + LUN mappings
# (iSCSI login then succeeds but exposes no disk). The drop-in waits for every
# backstore device referenced in saveconfig.json before restoring.
- name: Install LIO backstore device wait script
  ansible.builtin.copy:
    src: wait-lio-backstore-devs.sh
    dest: /usr/local/sbin/wait-lio-backstore-devs.sh
    owner: root
    group: root
    mode: "0755"

- name: Create rtslib-fb-targetctl drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/rtslib-fb-targetctl.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Wait for zvol devices before LIO config restore
  ansible.builtin.copy:
    src: rtslib-wait-zvols.conf
    dest: /etc/systemd/system/rtslib-fb-targetctl.service.d/wait-zvols.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start rtslib-fb-targetctl
  ansible.builtin.systemd:
    name: rtslib-fb-targetctl
    enabled: true
    state: started
