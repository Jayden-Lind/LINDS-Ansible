---
# apt on a router. Everything non-interactive. Security updates apply on
# their own (unattended-upgrades, security origins only, 04:00 local, never
# a reboot); everything else, the backports kernel included, moves only
# inside this role and only when asked for (router_apt_upgrade, off by
# default: a config push must not turn into an upgrade and a reboot).
# needrestart restarts daemons under apt rather than prompt, in the
# unattended run as well.

- name: needrestart conf dir
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    mode: '0755'

- name: needrestart never prompts
  ansible.builtin.copy:
    src: etc/needrestart/conf.d/50-router.conf
    dest: /etc/needrestart/conf.d/50-router.conf
    mode: '0644'

- name: unattended-upgrades (security origins only)
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: unattended-upgrades policy
  ansible.builtin.copy:
    src: "etc/apt/apt.conf.d/{{ item }}"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    mode: '0644'
  loop:
    - 20auto-upgrades
    - 52unattended-upgrades-router

- name: apt-daily-upgrade.timer drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    mode: '0755'

- name: apt-daily-upgrade.timer at 04:00
  ansible.builtin.copy:
    src: etc/systemd/system/apt-daily-upgrade.timer.d/router.conf
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/router.conf
    mode: '0644'
  notify: daemon-reload

- name: Flush handlers (timer drop-in)
  ansible.builtin.meta: flush_handlers

- name: apt timers enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: trixie-backports (kernel only, see router_kernel_backports)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/backports.sources
    content: |
      # Managed by LINDS-Ansible (roles/router). Only linux-image-amd64 is
      # taken from here (router_kernel_backports).
      Types: deb
      URIs: http://deb.debian.org/debian
      Suites: trixie-backports
      Components: main
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
    mode: '0644'
  when: router_kernel_backports

- name: trixie-backports (absent)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/backports.sources
    state: absent
  when: not router_kernel_backports

- name: apt full-upgrade
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: full
    autoremove: true
  # | bool: `-e router_apt_upgrade=true` arrives as the string "true", and
  # ansible-core 2.19+ refuses a non-boolean conditional.
  when: router_apt_upgrade | bool

- name: Router packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - linux-image-cloud-amd64   # the image's kernel flavour, see the note below
      # The package behind conf.d/50-router.conf above. It was missing from
      # this list until 2026-10, so that file configured nothing and no daemon
      # was restarted after an unattended library update.
      - needrestart
      - nftables
      - frr
      - frr-pythontools           # frr-reload.py behind `systemctl reload frr`
      - charon-systemd            # strongSwan daemon (swanctl stack, no ipsec.conf)
      - strongswan-swanctl
      - libcharon-extra-plugins   # eap-mschapv2
      - libstrongswan-extra-plugins
      - libstrongswan-standard-plugins
      - kea-dhcp4-server
      - kea-dhcp-ddns-server
      - pdns-recursor
      - chrony
      - snmpd
      - lldpd
      - ddclient
      - suricata
      - suricata-update
      - rsyslog
      - conntrack                 # failover flushes SNAT entries on switchover
      - wireguard-tools           # wg(8) for the endpoint re-resolver + debugging
      - ethtool
      - tuned
      - iputils-ping
      - tcpdump
      - mtr-tiny
      - bind9-dnsutils
      - jq
      - irqbalance
      # Traffic TUIs: per-flow, per-interface graphs, LAN stations, history.
      - iftop
      - bmon
      - iptraf-ng
      - vnstat
      - qemu-guest-agent
    state: present

# The genericcloud image boots Debian's cloud kernel: same version as the
# full one, trimmed module set — but it carries everything a virtio router
# needs (tunnels, cake/bbr, mlx5 for the ConnectX VF, nf_flow_table). It is
# kept; router_kernel_backports moves it to the backports version.
#
# The kernel only moves when asked to (router_apt_upgrade) or when the box is
# still on stable's kernel (a first build: no "~bpo" in the installed
# version). Until 2026-10 this task was `state: latest` on every run, which
# had two effects on a run meant to change one firewall rule:
#   * a newer kernel in backports was installed and the router rebooted
#     mid-run (network.yml);
#   * between a `linux` upload to backports and the matching
#     `linux-signed-amd64` one, the meta-package is uninstallable ("held
#     broken packages", seen 2026-10-05: 7.1.13 wanting a linux-base that the
#     archive had already replaced with 7.2.6) and the run died here, before
#     any config task. An upgrade run still fails in that window; wait for the
#     signed upload and run it again.
- name: Installed kernel meta-package version
  ansible.builtin.command: dpkg-query -W -f '${Version}' linux-image-cloud-amd64
  register: router_kernel_installed
  changed_when: false
  failed_when: false
  check_mode: false
  when: router_kernel_backports

- name: Kernel from trixie-backports
  ansible.builtin.apt:
    name: linux-image-cloud-amd64
    default_release: trixie-backports
    state: "{{ 'latest' if (router_apt_upgrade | bool or '~bpo' not in router_kernel_installed.stdout) else 'present' }}"
  when: router_kernel_backports
  register: router_kernel_backports_install

- name: Kernel changed -> reboot later in the run
  ansible.builtin.set_fact:
    router_kernel_changed: "{{ router_kernel_backports_install.changed | default(false) }}"
