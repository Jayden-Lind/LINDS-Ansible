---
# ethtool settings the .link files cannot express
# (files/<router_site>/etc/systemd/system/nic-tuning.service, per site
# because it depends on what the NICs are): VF rx ring, UDP GRO forwarding.
# The same unit puts each queue's interrupt on the CPU its driver chose (queue
# N on CPU N, which XPS also uses). irqbalance moved them away from that.

- name: nic-tuning unit
  ansible.builtin.copy:
    src: "{{ router_site }}/etc/systemd/system/nic-tuning.service"
    dest: /etc/systemd/system/nic-tuning.service
    mode: '0644'
  notify:
    - daemon-reload
    - restart nic-tuning

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: nic-tuning enabled
  ansible.builtin.systemd_service:
    name: nic-tuning
    enabled: true
    state: started

# irqbalance ignores the drivers' affinity hints. On 2026-10-20 it had put
# most of lan0's and wan0's queues on CPU3, so one flow's receive, forward
# and transmit work ran on three CPUs. nic-tuning.service sets the drivers'
# layout instead.
- name: irqbalance absent
  ansible.builtin.apt:
    name: irqbalance
    state: absent
    purge: true
