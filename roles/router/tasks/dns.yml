---
# Unbound, the DNS forwarder for the LAN and the VLANs. The site's
# files/<router_site>/etc/unbound/unbound.conf says what it does and why.
# The unit is masked while the package installs so the daemon's first start
# never runs with Debian's config. It replaced pdns-recursor on 2026-10-22;
# the last tasks remove that.

- name: unbound installed?
  ansible.builtin.command: dpkg-query -W -f '${Status}' unbound
  register: router_dns_pkg
  changed_when: false
  failed_when: false

- name: Keep unbound from starting with Debian's config during install
  ansible.builtin.command: systemctl mask unbound.service
  when: "'install ok installed' not in router_dns_pkg.stdout"

- name: unbound package
  ansible.builtin.apt:
    name: unbound
    state: present
    install_recommends: false

# The router's own /etc/resolv.conf is a fixed file: Unbound must not put
# itself into it through resolvconf.
- name: unbound-resolvconf masked
  ansible.builtin.systemd_service:
    name: unbound-resolvconf
    masked: true

- name: unbound helper settings
  ansible.builtin.copy:
    src: etc/default/unbound
    dest: /etc/default/unbound
    mode: '0644'
  notify: restart unbound

# The DNS blocklists (README, "DNS blocklists"). The zone files must be
# there before Unbound reads its configuration: the script makes an empty
# zone for a list that was never fetched.
- name: Blocklist directory
  ansible.builtin.file:
    path: /var/lib/unbound/rpz
    state: directory
    mode: '0755'

- name: Blocklist settings (the lists, and Unbound's zones for them)
  ansible.builtin.copy:
    src: "etc/unbound/{{ item }}"
    dest: "/etc/unbound/{{ item }}"
    mode: '0644'
  loop: [blocklists, blocklist.conf]
  notify: restart unbound

- name: Blocklist update script
  ansible.builtin.copy:
    src: usr/local/sbin/dns-blocklist-update
    dest: /usr/local/sbin/dns-blocklist-update
    mode: '0755'

- name: Blocklist update service + timer
  ansible.builtin.copy:
    src: "etc/systemd/system/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - dns-blocklist-update.service
    - dns-blocklist-update.timer
  notify: daemon-reload

- name: Blocklist zone files are there (empty until the first fetch)
  ansible.builtin.command: /usr/local/sbin/dns-blocklist-update --init
  changed_when: false

- name: unbound config
  ansible.builtin.copy:
    src: "{{ router_site }}/etc/unbound/unbound.conf"
    dest: /etc/unbound/unbound.conf
    mode: '0644'
    validate: /usr/sbin/unbound-checkconf %s
  notify: restart unbound

- name: Unmask unbound (config in place)
  ansible.builtin.command: systemctl unmask unbound.service
  when: "'install ok installed' not in router_dns_pkg.stdout"

# pdns-recursor listened on the same addresses: it goes before unbound
# starts. Its repository goes in packages.yml.
- name: pdns-recursor purged (replaced by unbound)
  ansible.builtin.apt:
    name: pdns-recursor
    state: absent
    purge: true

- name: pdns-recursor config gone
  ansible.builtin.file:
    path: /etc/powerdns
    state: absent

- name: unbound enabled
  ansible.builtin.systemd_service:
    name: unbound
    enabled: true
    state: started

- name: Flush handlers (Unbound runs with the blocklist zones)
  ansible.builtin.meta: flush_handlers

# On a new router the zones are empty. The timer would fill them at night.
# The command only reads, so it runs in check mode too.
- name: A blocklist was never fetched?
  ansible.builtin.command: awk '$2 == 0 { n = 1 } END { exit !n }' /var/lib/unbound/rpz/state
  register: router_blocklist_empty
  changed_when: false
  failed_when: false
  check_mode: false

- name: First fetch of the blocklists
  ansible.builtin.systemd_service:
    name: dns-blocklist-update
    state: started
  when: router_blocklist_empty.rc == 0

- name: Blocklist update timer enabled
  ansible.builtin.systemd_service:
    name: dns-blocklist-update.timer
    enabled: true
    state: started
