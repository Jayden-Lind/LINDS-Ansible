---
# One ruleset file (files/<router_site>/etc/nftables.conf), validated before
# install, replaced atomically on reload.

- name: nftables ruleset
  ansible.builtin.copy:
    src: "{{ router_site }}/etc/nftables.conf"
    dest: /etc/nftables.conf
    mode: '0644'
    validate: nft -c -f %s
  notify: reload nftables

- name: nftables enabled
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Flush handlers (ruleset live before daemons start)
  ansible.builtin.meta: flush_handlers
