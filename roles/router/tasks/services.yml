---
- name: chrony config
  ansible.builtin.copy:
    src: etc/chrony/chrony.conf
    dest: /etc/chrony/chrony.conf
    mode: '0644'
  notify: restart chrony

- name: snmpd config
  ansible.builtin.copy:
    src: etc/snmp/snmpd.conf
    dest: /etc/snmp/snmpd.conf
    mode: '0600'
  notify: restart snmpd

- name: lldpd daemon flags
  ansible.builtin.copy:
    src: etc/default/lldpd
    dest: /etc/default/lldpd
    mode: '0644'
  notify: restart lldpd

- name: sshd listen addresses
  ansible.builtin.copy:
    src: etc/ssh/sshd_config.d/10-router.conf
    dest: /etc/ssh/sshd_config.d/10-router.conf
    mode: '0644'
  notify: reload sshd

- name: ddclient config (Cloudflare token from the vault)
  ansible.builtin.template:
    src: ddclient.conf.j2
    dest: /etc/ddclient.conf
    mode: '0600'
  no_log: true
  notify: restart ddclient

- name: ddclient runs as a daemon
  ansible.builtin.copy:
    src: etc/default/ddclient
    dest: /etc/default/ddclient
    mode: '0644'
  notify: restart ddclient

- name: Services enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - chrony
    - snmpd
    - lldpd
    - ddclient
    - qemu-guest-agent
