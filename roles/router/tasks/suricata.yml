---
# Suricata IDS, detection-only on the LAN trunk, EVE JSON to Loki through an
# rsyslog imfile relay (never journald). Config: files/etc/suricata/, the
# same on every router: the tap is lan0, which every site's .link files name.

# Installed here rather than with the rest (packages.yml) so that a site
# without the IDS (router_suricata) does not get a daemon running on
# Debian's defaults.
- name: Suricata packages
  ansible.builtin.apt:
    name: [suricata, suricata-update]
    state: present

# The user that run-as in suricata.yaml names. Debian's package makes none.
- name: Suricata group
  ansible.builtin.group:
    name: suricata
    system: true

- name: Suricata user
  ansible.builtin.user:
    name: suricata
    group: suricata
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/suricata
    create_home: false

- name: Suricata logs belong to its user
  ansible.builtin.file:
    path: /var/log/suricata
    state: directory
    owner: suricata
    group: suricata
    recurse: true

# The directory holds the socket and the PID file. Debian's tmpfiles.d file
# makes it for root. A file of the same name in /etc replaces that one.
- name: Suricata runtime directory (tmpfiles.d)
  ansible.builtin.copy:
    src: etc/tmpfiles.d/suricata.conf
    dest: /etc/tmpfiles.d/suricata.conf
    mode: '0644'
  register: router_suricata_tmpfiles

- name: Suricata runtime directory now
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/suricata.conf
  when: router_suricata_tmpfiles is changed
  changed_when: true

# The directory belongs to the suricata user, so logrotate must not work in it
# as root: the file adds `su` to Debian's.
- name: Suricata log rotation
  ansible.builtin.copy:
    src: etc/logrotate.d/suricata
    dest: /etc/logrotate.d/suricata
    mode: '0644'

# Per site: HOME_NET (suricata.yaml includes this file) and the alert
# suppressions.
- name: Suricata site files
  ansible.builtin.copy:
    src: "{{ router_site }}/etc/suricata/{{ item }}"
    dest: "/etc/suricata/{{ item }}"
    mode: '0644'
  loop: [site-address-groups.yaml, threshold.config]
  notify: restart suricata

- name: suricata.yaml
  ansible.builtin.copy:
    src: etc/suricata/suricata.yaml
    dest: /etc/suricata/suricata.yaml
    mode: '0644'
  notify: restart suricata

# suricata.yaml leaves stream memory uncapped; MemoryMax= on the unit is what
# keeps a runaway from taking the router's other daemons with it. A cgroup
# limit applies on daemon-reload, no restart needed.
# Where Suricata keeps its compiled rule databases (sgh-mpm-caching in
# suricata.yaml). Suricata does not make the directory itself.
- name: Suricata rule cache dir
  ansible.builtin.file:
    path: /var/lib/suricata/cache
    state: directory
    owner: suricata
    group: suricata
    recurse: true

- name: Suricata rule cache subdir
  ansible.builtin.file:
    path: /var/lib/suricata/cache/sgh
    state: directory
    owner: suricata
    group: suricata
    mode: '0750'

- name: suricata.service drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/suricata.service.d
    state: directory
    mode: '0755'

- name: suricata.service memory backstop
  ansible.builtin.copy:
    src: etc/systemd/system/suricata.service.d/memory.conf
    dest: /etc/systemd/system/suricata.service.d/memory.conf
    mode: '0644'
  notify: daemon-reload

- name: Rule tuning (disable.conf, read by suricata-update)
  ansible.builtin.copy:
    src: etc/suricata/disable.conf
    dest: /etc/suricata/disable.conf
    mode: '0644'
  notify: suricata-update

# The rule test must work as the suricata user, or no rule update succeeds.
- name: suricata-update settings
  ansible.builtin.copy:
    src: etc/suricata/update.yaml
    dest: /etc/suricata/update.yaml
    mode: '0644'

- name: suricata-update service + timer
  ansible.builtin.copy:
    src: "etc/systemd/system/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - suricata-update.service
    - suricata-update.timer
  notify: daemon-reload

- name: Flush handlers (units known)
  ansible.builtin.meta: flush_handlers

- name: Ruleset present?
  ansible.builtin.stat:
    path: /var/lib/suricata/rules/suricata.rules
  register: router_suricata_rules

# A fresh box has no rules and the daemon would start with nothing to load.
- name: Fetch ET Open (first run only)
  ansible.builtin.command: suricata-update --no-reload
  when: not router_suricata_rules.stat.exists
  changed_when: true
  notify: restart suricata

- name: EVE -> Loki rsyslog relay
  ansible.builtin.copy:
    src: etc/rsyslog.d/60-suricata-eve.conf
    dest: /etc/rsyslog.d/60-suricata-eve.conf
    mode: '0644'
  notify: restart rsyslog

- name: suricata enabled
  ansible.builtin.systemd_service:
    name: suricata
    enabled: true
    state: started

- name: suricata-update timer enabled
  ansible.builtin.systemd_service:
    name: suricata-update.timer
    enabled: true
    state: started

# The oneshot's failed state (a rule refresh that hit a bad yaml, say) would
# otherwise trip the failed-unit sweep in validate.yml forever; the ruleset
# itself is verified there with `suricata -T`.
- name: suricata-update failed state cleared
  ansible.builtin.command: systemctl reset-failed suricata-update.service
  changed_when: false
  failed_when: false
