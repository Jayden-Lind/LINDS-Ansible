---
# kea (the DHCP server behind VyOS 1.4's `service dhcp-server`) plus its DDNS
# companion, which pushes leases into AD DNS on the DC pair.
#
# Validation goes through a candidate file inside /etc/kea, checked as the
# _kea user: Debian confines the kea binaries with AppArmor (no dac_override,
# /etc/kea/** only), so `kea-dhcp4 -t` as root cannot read the temp file
# Ansible's `validate:` would hand it, nor a root-only file in /etc/kea.

- name: kea candidate configs
  ansible.builtin.copy:
    src: "{{ router_site }}/etc/kea/{{ item }}"
    dest: "/etc/kea/.{{ item }}.candidate"
    owner: root
    group: _kea
    mode: '0640'
  loop: [kea-dhcp4.conf, kea-dhcp-ddns.conf]

- name: kea configs parse
  ansible.builtin.command: "runuser -u _kea -- {{ item.check }} /etc/kea/.{{ item.name }}.candidate"
  loop:
    - {name: kea-dhcp4.conf, check: kea-dhcp4 -t}
    - {name: kea-dhcp-ddns.conf, check: kea-dhcp-ddns -t}
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

# ISC's packages give /etc/kea/*.conf to _kea:_kea with dpkg-statoverride,
# and dpkg applies the override again on each upgrade. The role keeps the
# files root:_kea 0640 (Kea reads its config but cannot change it), so the
# override must say the same. Otherwise each upgrade and the next run swap
# the owner, and Kea restarts.
- name: kea config ownership (dpkg-statoverride)
  ansible.builtin.shell: |
    f=/etc/kea/{{ item }}
    [ "$(dpkg-statoverride --list "$f")" = "root _kea 640 $f" ] && exit 0
    dpkg-statoverride --remove "$f" > /dev/null 2>&1 || true
    dpkg-statoverride --update --add root _kea 0640 "$f"
    echo changed
  loop: [kea-dhcp4.conf, kea-dhcp-ddns.conf]
  register: router_kea_statoverride
  changed_when: "'changed' in router_kea_statoverride.stdout"

- name: kea-dhcp4 config
  ansible.builtin.copy:
    src: /etc/kea/.kea-dhcp4.conf.candidate
    remote_src: true
    dest: /etc/kea/kea-dhcp4.conf
    owner: root
    group: _kea
    mode: '0640'
  notify: restart kea-dhcp4

- name: kea-dhcp-ddns config
  ansible.builtin.copy:
    src: /etc/kea/.kea-dhcp-ddns.conf.candidate
    remote_src: true
    dest: /etc/kea/kea-dhcp-ddns.conf
    owner: root
    group: _kea
    mode: '0640'
  notify: restart kea-dhcp-ddns

- name: kea enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - isc-kea-dhcp-ddns-server
    - isc-kea-dhcp4-server
