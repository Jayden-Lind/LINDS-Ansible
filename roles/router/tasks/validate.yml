---
# Every daemon's own config checker plus a failed-unit sweep. A green run
# means a box that would route the moment its links come up.

- name: nftables ruleset parses
  ansible.builtin.command: nft -c -f /etc/nftables.conf
  changed_when: false

- name: frr.conf parses
  ansible.builtin.command: vtysh -C -f /etc/frr/frr.conf
  changed_when: false

- name: kea configs parse
  ansible.builtin.command: "{{ item }}"
  loop:
    - runuser -u _kea -- kea-dhcp4 -t /etc/kea/kea-dhcp4.conf
    - runuser -u _kea -- kea-dhcp-ddns -t /etc/kea/kea-dhcp-ddns.conf
  changed_when: false

- name: sshd config parses
  ansible.builtin.command: sshd -t
  changed_when: false

- name: suricata.yaml + rules load
  ansible.builtin.command: suricata -T -c /etc/suricata/suricata.yaml
  changed_when: false
  when: router_suricata | bool

# Every global IPv6 address on lan0 must be inside Suricata's HOME_NET
# (files/<site>/etc/suricata/site-address-groups.yaml). If the ISP delegates
# another prefix, most rules stop matching IPv6 without any error. The output
# lists the addresses that are outside; add their prefix to HOME_NET.
- name: Suricata HOME_NET covers lan0's IPv6 addresses
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import ipaddress, json, re, subprocess, sys
        text = open("/etc/suricata/site-address-groups.yaml").read()
        home = re.search(r'^HOME_NET:\s*"\[(.*)\]"', text, re.M).group(1)
        nets = [ipaddress.ip_network(n.strip(), strict=False) for n in home.split(",")]
        out = subprocess.run(["ip", "-6", "-j", "addr", "show", "dev", "lan0", "scope", "global"],
                             capture_output=True, text=True, check=True).stdout
        addrs = [a["local"] for i in json.loads(out or "[]") for a in i.get("addr_info", []) if "local" in a]
        outside = [a for a in addrs if not any(ipaddress.ip_address(a) in n for n in nets if n.version == 6)]
        print(" ".join(outside))
        sys.exit(1 if outside else 0)
  changed_when: false
  check_mode: false
  when: router_suricata | bool

# Every connection the site's swanctl.conf defines (router_ipsec_connections).
- name: swanctl connections loaded
  ansible.builtin.command: swanctl --list-conns
  register: router_swanctl_conns
  changed_when: false
  failed_when: >-
    router_ipsec_connections | map('regex_replace', '$', ':')
    | reject('in', router_swanctl_conns.stdout) | list | length > 0

- name: unbound answers control
  ansible.builtin.command: unbound-control status
  changed_when: false

- name: Interfaces present
  ansible.builtin.command: networkctl list --no-legend
  register: router_links
  changed_when: false
  failed_when: router_expected_interfaces | reject('in', router_links.stdout) | list | length > 0

- name: No failed units
  ansible.builtin.command: systemctl --failed --no-legend --plain
  register: router_failed_units
  changed_when: false
  failed_when: router_failed_units.stdout | trim | length > 0

- name: Routing state (informational)
  ansible.builtin.shell: |
    echo '--- ip rule'; ip rule
    echo '--- main'; ip route
    {% for table in router_routing_tables %}
    echo '--- table {{ table.id }} ({{ table.name }})'; ip route show table {{ table.id }}
    {% endfor %}
    echo '--- default table'; ip route show table default
    echo '--- addresses'; ip -br a
  register: router_routing_state
  changed_when: false

- name: Routing state
  ansible.builtin.debug:
    msg: "{{ router_routing_state.stdout_lines }}"
