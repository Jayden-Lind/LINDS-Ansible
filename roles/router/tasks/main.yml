---
# Debian 13 router. Ordering matters in four places:
#   * packages -> system -> network: sysctls reference conntrack modules,
#     networkd rename needs the .link files before anything binds to a name.
#   * network before everything that binds an address (with
#     ConfigureWithoutCarrier the addresses exist even with the links down).
#   * firewall before wireguard: a tunnel starts handshaking the moment its
#     netdev exists, by whatever default route there is. On a router still
#     being built that is the management NIC, through the router it will
#     replace, and the VPN provider would see a second peer with the same
#     key. The ruleset is what keeps those packets to the WAN, so it is
#     loaded first (and at boot nftables.service precedes networkd).
#   * ipsec before routing: BGP peers over ipsec0, which strongSwan drives.
# validate.yml runs the daemons' own config checkers last and fails the play
# on any failed unit, so a green run means a box that would route.
#
# Each area carries a tag of the same name, so one area can be pushed on its
# own (`--tags firewall`); validate.yml is tagged `always` and runs after any
# of them. No file depends on a fact registered in another one.

# Every per-site file is addressed as files/<router_site>/..., with no
# fallback to another site's copy, so a site that lacks a file fails at that
# task rather than taking jd's.
- name: The site is one this role has files for
  ansible.builtin.assert:
    that:
      - router_site is defined
      - (role_path ~ '/files/' ~ router_site ~ '/etc/nftables.conf') is file
    fail_msg: >-
      router_site must name a directory under roles/router/files/
      (set it in the site's group_vars); got '{{ router_site | default('nothing') }}'.
    quiet: true
  tags: [always]

- name: Packages
  ansible.builtin.import_tasks: packages.yml
  tags: [packages]

- name: System
  ansible.builtin.import_tasks: system.yml
  tags: [system]

- name: Network
  ansible.builtin.import_tasks: network.yml
  tags: [network]

- name: NIC tuning
  ansible.builtin.import_tasks: tuning.yml
  tags: [tuning]

- name: Firewall
  ansible.builtin.import_tasks: firewall.yml
  tags: [firewall]

- name: UPnP / NAT-PMP
  ansible.builtin.import_tasks: upnp.yml
  when: router_upnp | bool
  tags: [upnp]

- name: mDNS reflector
  ansible.builtin.import_tasks: mdns.yml
  when: router_mdns | bool
  tags: [mdns]

- name: Logging
  ansible.builtin.import_tasks: logging.yml
  tags: [logging]

- name: DNS forwarder
  ansible.builtin.import_tasks: dns.yml
  tags: [dns]

- name: DHCP server
  ansible.builtin.import_tasks: dhcp.yml
  tags: [dhcp]

- name: Services
  ansible.builtin.import_tasks: services.yml
  tags: [services]
- name: Troubleshooting and metrics
  ansible.builtin.import_tasks: tools.yml
  tags: [tools]

- name: IPsec
  ansible.builtin.import_tasks: ipsec.yml
  tags: [ipsec]

- name: WireGuard
  ansible.builtin.import_tasks: wireguard.yml
  tags: [wireguard]

- name: Routing
  ansible.builtin.import_tasks: routing.yml
  tags: [routing]

- name: Dual-WAN failover daemon
  ansible.builtin.import_tasks: failover.yml
  when: router_failover | bool
  tags: [failover]

- name: No failover daemon on a single-WAN site
  ansible.builtin.import_tasks: failover_off.yml
  when: not (router_failover | bool)
  tags: [failover]

- name: Suricata IDS + EVE shipping
  ansible.builtin.import_tasks: suricata.yml
  when: router_suricata | bool
  tags: [suricata]

- name: Validate
  ansible.builtin.import_tasks: validate.yml
  tags: [validate, always]
