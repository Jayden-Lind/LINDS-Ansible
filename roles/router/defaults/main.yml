---
# roles/router — a Debian 13 router built from plain config files.
#
# The daemon configs are real files, mirroring where they land on the box;
# edit them there. What every router gets is under files/etc/, what belongs
# to one site is under files/<router_site>/etc/ (files/jd/etc/,
# files/linds/etc/). Jinja is used only where a file carries vault secrets
# (WireGuard peers, EAP users, the Cloudflare token) or is rendered from
# vault values (certificates, keys).

# Which site's files this router gets: the name of a directory under files/.
# No default on purpose (tasks/main.yml refuses to run without it): a router
# given another site's firewall and DHCP ranges is worse than a failed run.
# router_site: jd

# What a site has. The daemons behind the first three run on every router
# unless a site turns one off; the last two need something only some sites
# have, so a site turns them on (group_vars/jd_router.yml does).
router_upnp: true # miniupnpd: UPnP IGD + NAT-PMP/PCP for the main LAN
router_mdns: true # avahi as an mDNS reflector between VLANs
router_suricata: true # Suricata IDS on the LAN trunk, EVE to Loki
router_failover: false # wan-failover: needs a second WAN to fail over to
router_road_warrior: false # IKEv2 remote access (LINDS_MOBILE): its own
# certificate, the EAP users, an XFRM interface
router_k8s_port_forward: false # k8s-port-forward: WAN ports for the Kubernetes
# Services that ask for them (tasks/port_forward.yml). It needs the settings
# below and a token in the vault (k8s_port_forward_token).

# k8s-port-forward settings. The daemon reads them from
# /etc/k8s-port-forward/config.json (templates/k8s-port-forward.json.j2).
# The site gives the API address and the LoadBalancer pool; only addresses in
# the pool can get a forward. The reserved ports are the ones the router
# answers on its WAN address itself (IKE and NAT-T).
router_k8s_port_forward_api: ""
router_k8s_port_forward_backend_cidrs: []
router_k8s_port_forward_wan_interface: wan0
router_k8s_port_forward_reserved_ports: {tcp: [], udp: [500, 4500]}
router_k8s_port_forward_max_forwards: 128
router_k8s_port_forward_interval: 20

# Connections `swanctl --list-conns` must show (tasks/validate.yml).
router_ipsec_connections: [LINDS]
# Routing tables the validator prints besides main (information only).
router_routing_tables: []
# Upgrades are a deliberate act, not a side effect of a config push. A normal
# run installs what is missing and upgrades nothing: no `apt full-upgrade`,
# the kernel stays at the installed version, so nothing in the run can reboot
# the router. Security fixes arrive on their own (unattended-upgrades,
# security origins only, tasks/packages.yml). To move everything else, the
# backports kernel included, and reboot if the kernel changed:
#   ansible-playbook playbooks/router.yml -e router_apt_upgrade=true
router_apt_upgrade: false
# linux-image-cloud-amd64 from trixie-backports instead of stable's kernel
# (true for jd-router-01, group_vars/jd_router.yml).
router_kernel_backports: false
router_timezone: Australia/Melbourne

# Hostname-endpoint WireGuard tunnels get `wg set … endpoint` re-run when the
# last handshake is older than this many seconds (timer: every 60s).
router_wg_reresolve_stale: 150
