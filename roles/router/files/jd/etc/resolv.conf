# Managed by LINDS-Ansible: roles/router/files/jd/etc/resolv.conf. The router's own resolver
# is its Unbound on 127.0.0.1: the same cache and Quad9 DoT upstream as the LAN (until
# 2026-11-06 it asked Cloudflare directly, in plain text). linds.com.au goes to the DCs,
# except linds-pfsense, the IPsec peer, which Unbound sends to Quad9 (unbound.conf).
# Quad9 in plain text is the fallback while Unbound is not running (glibc moves to the
# next server on a refused connection, a timeout or SERVFAIL).
search linds.com.au
nameserver 127.0.0.1
nameserver 9.9.9.9
options timeout:2 attempts:2
