# Managed by LINDS-Ansible: roles/router/files/etc/miniupnpd/miniupnpd.conf.
# UPnP IGD + NAT-PMP/PCP for the main LAN. Pinholes land in `table inet
# miniupnpd` (created by /usr/local/sbin/miniupnpd-nft, see
# /etc/default/miniupnpd), separate from the Ansible-managed router table so
# a firewall reload keeps them.
ext_ifname=wan0
listening_ip=lan0
http_port=5000
enable_upnp=yes
enable_pcp_pmp=yes
# LAN v6 hosts are globally reachable already (forward is accept); nothing to
# pinhole. Flip when a v6 forward filter exists.
ipv6_disable=yes
# Clients may only map ports to themselves.
secure_mode=yes
system_uptime=yes
notify_interval=60
clean_ruleset_interval=600
lease_file=/var/lib/miniupnpd/upnp.leases
friendly_name=jd-router-01
uuid=21660d5e-e26d-4a60-bb50-d69779ae3b33

# nftables backend: our own table and chain names.
upnp_table_name=miniupnpd
upnp_nat_table_name=miniupnpd
upnp_forward_chain=miniupnpd
upnp_nat_chain=prerouting_miniupnpd
upnp_nat_postrouting_chain=postrouting_miniupnpd

# Who may request what (first match wins).
allow 1024-65535 10.0.50.0/24 1024-65535
deny 0-65535 0.0.0.0/0 0-65535
