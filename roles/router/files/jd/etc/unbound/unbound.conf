# Managed by LINDS-Ansible: roles/router/files/jd/etc/unbound/unbound.conf.
# Unbound (Debian 13): the DNS forwarder for the main LAN, VLAN 52 and the
# cluster (VLAN 53). It answers from its cache and sends the rest to Quad9
# over DNS over TLS, and the internal zones to the DCs and kube-dns. It does
# not resolve from the root and does not check DNSSEC: Quad9 does both.
# It replaced pdns-recursor on 2026-10-22: Unbound can answer from an
# expired record at once and refresh it behind the client (serve-expired).
#
# This file is the whole configuration. Debian's unbound.conf.d snippets
# (root trust anchor, remote control) are not included.

server:
    # Where clients ask. lan0's link-local is what the RA hands out as RDNSS
    # (30-lan0.network). ip-freebind lets Unbound start before an address
    # is up (the unit only waits for network.target).
    interface: 10.0.50.1
    interface: 10.0.53.1
    interface: 10.0.52.1
    interface: fe80::be24:11ff:fe01:1101%lan0
    port: 53
    ip-freebind: yes
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    # Clients that take the RA's RDNSS ask from their own link-local.
    access-control: fe80::/10 allow

    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    msg-cache-size: 64m
    rrset-cache-size: 128m

    # Cache tuning. Measured 2026-10-06 by replaying 30 h of the main LAN's
    # lookups (23,800, from the Suricata DNS log): a miss costs a client
    # 14 ms (median), and 25-30 ms more when the DoT connection to Quad9 has
    # to be made again (Quad9 closes it after about 10 s idle). Share
    # answered from cache: 58% with a 900 s floor, 92% when expired answers
    # are served too.
    #   * serve-expired: an expired record is answered at once (with a TTL
    #     of 30 s) and refreshed behind the client, for up to a day after it
    #     expired (RFC 8767). A site that changes address is followed one
    #     lookup late.
    #   * No TTL floor (cache-min-ttl 0, the default). With serve-expired it
    #     makes no answer faster, and it kept answers past their TTL: when a
    #     CDN takes a server out by short TTLs, the old 900 s floor sent
    #     clients to it for up to 15 minutes.
    #   * prefetch: a record asked for in the last tenth of its life is
    #     refreshed before it expires.
    #   * cache-max-negative-ttl 300: no-data and NXDOMAIN answers (28% of
    #     the lookups) live 5 minutes at most.
    # After changing an internal record: `unbound-control flush NAME`, or
    # `unbound-control flush_zone linds.com.au` for the subtree.
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 0
    serve-expired-reply-ttl: 30
    prefetch: yes
    cache-max-negative-ttl: 300
    # Reliability. infra-keep-probing: ask the forwarders again soon after
    # they all time out (a WAN outage or failover) instead of waiting out a
    # backoff. prefer-ip4: Quad9 over IPv4, whose route fails over to the
    # cellular modem; IPv6 has no backup path, so in a line outage every
    # IPv6 query would time out first. The IPv6 addresses stay as a fallback.
    infra-keep-probing: yes
    prefer-ip4: yes

    # Forwarding only, no DNSSEC validation.
    module-config: "iterator"
    # Quad9's certificate is checked against the system CA store, loaded
    # once at start. Queries over TLS are padded (pad-queries, on by
    # default), so their size does not give the name away.
    tls-system-cert: yes

    # Private reverse zones (10.in-addr.arpa and the like) are answered here
    # with NXDOMAIN, Unbound's default. The four zones that the DCs host are
    # holes in that default and are forwarded (forward-zone below). Do not
    # forward all of 10.in-addr.arpa: jd-dc-01 forwards to this router, so
    # a name that neither has would loop.
    local-zone: "50.0.10.in-addr.arpa." transparent
    local-zone: "250.0.10.in-addr.arpa." transparent
    local-zone: "1.4.10.in-addr.arpa." transparent
    local-zone: "6.168.192.in-addr.arpa." transparent

    # Counters for `router metrics` (Prometheus, through node-exporter): by
    # answer code, and not reset when something reads them.
    extended-statistics: yes
    statistics-cumulative: yes
    statistics-interval: 0

    verbosity: 1
    log-servfail: yes
    # Extended DNS Errors to clients: `dig` shows why an answer failed, and
    # "Stale Answer" for one served from an expired record.
    ede: yes
    ede-serve-expired: yes
    hide-identity: yes
    hide-version: yes

remote-control:
    # unbound-control, for `router` and the admin. A local socket only.
    control-enable: yes
    control-interface: /run/unbound.ctl

# The catch-all is Quad9 (9.9.9.9: validates DNSSEC, refuses known-malicious
# names), not Cloudflare. Which resolver is asked decides where browsers are
# then sent: Cloudflare does not pass the client subnet on, and Google's and
# Microsoft's name servers place its resolvers well over 100 ms away much of
# the time. Measured 2026-10-06/07 (time to answer, median / 95th / share
# over 100 ms, then the mean TCP handshake to the answers, IPv4 / IPv6):
#   Cloudflare 1.1.1.1    11 / 19 ms / 1.7%     61 ms   41 ms
#   Quad9 9.9.9.9         12 / 28 ms / 1.7%     51 ms   24 ms   <- this
#   Quad9 9.9.9.11 (ECS)  15 / 242 ms / 7.0%    50 ms   24 ms
#   Google 8.8.8.8        15 / 189 ms / 13%     51 ms   27 ms
#   Telstra 61.9.134.49   11 / 25 ms / 3.0%     49 ms   24 ms
# Telstra's resolvers are as good, but rewrite the sites that Australian ISPs
# are ordered to block. If Quad9 refuses a name that is wanted: 9.9.9.10 /
# 149.112.112.10 is the same service without the block list.
#
# DNS over TLS: the ISP cannot read the names the router looks up. Measured
# 2026-10-18: on an open connection a lookup takes 9-11 ms, the same as UDP;
# a new connection adds 25-30 ms. #dns.quad9.net is the name the certificate
# must have, so an attacker who intercepts the connection gets SERVFAIL, not
# answers.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 2620:fe::fe@853#dns.quad9.net
    forward-addr: 2620:fe::9@853#dns.quad9.net

# The local DC plus one LINDS DC over the IPsec tunnel as backup. Unbound
# prefers the one that answers faster.
forward-zone:
    name: "linds.com.au."
    forward-addr: 10.0.50.200
    forward-addr: 10.3.1.200

# kube-dns, reachable because Cilium advertises ClusterIPs over BGP.
forward-zone:
    name: "k8s.linds.com.au."
    forward-addr: 10.96.0.10

forward-zone:
    name: "50.0.10.in-addr.arpa."
    forward-addr: 10.0.50.200
    forward-addr: 10.3.1.200
forward-zone:
    name: "250.0.10.in-addr.arpa."
    forward-addr: 10.0.50.200
    forward-addr: 10.3.1.200
forward-zone:
    name: "1.4.10.in-addr.arpa."
    forward-addr: 10.0.50.200
    forward-addr: 10.3.1.200
forward-zone:
    name: "6.168.192.in-addr.arpa."
    forward-addr: 10.0.50.200
    forward-addr: 10.3.1.200
