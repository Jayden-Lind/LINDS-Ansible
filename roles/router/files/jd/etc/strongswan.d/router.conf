# Managed by LINDS-Ansible: roles/router/files/etc/strongswan.d/router.conf. VyOS `vpn ipsec options` and
# `vpn ipsec interface`, as charon settings.
charon {
    # Route-based: the XFRM interfaces and FRR own routing (VyOS
    # disable-route-autoinstall).
    install_routes = no
    install_virtual_ip = yes
    # start_action = start initiates once at load. If that fails because the
    # WAN has no address yet (charon starts before the DHCP lease lands; on the
    # VF this took 16 s) the connection would otherwise sit idle forever.
    retry_initiate_interval = 30
    # IKE only on the WANs (VyOS `vpn ipsec interface`).
    interfaces_use = wan0, lan0.99
    # Move SAs to the best path whenever routing changes. charon otherwise
    # keeps an SA on the path it is on for as long as that path still works,
    # and the cellular backup's keeps working: after the failover of
    # 2026-10-14 (03:40 to 04:03) the LINDS IKE_SA was still bound to
    # 192.168.0.87 a day and a half later. Its packets left by wan0 all the
    # same, since nothing routes by that source address, and only got out
    # because nftables rule 200 masqueraded them. With this on, wan-failover
    # swapping the default route makes charon move the SA by MOBIKE (both
    # ends of the tunnel have it) to the new route's source address: onto
    # the backup when it takes over, and back when the primary returns.
    # MOBIKE tries every address the peer has advertised and keeps the
    # first that answers, IPv6 included: the move tested on 2026-10-15 went
    # to LINDS's IPv6 address. See "After a WAN failover the tunnel follows
    # the best path" in roles/router/README.md.
    prefer_best_path = yes
    plugins {
        # ssh-agent key loading; needs CAP_SETUID and logs a warning otherwise.
        agent {
            load = no
        }
        # Virtual IPs via DHCP: not used, and its socket on 0.0.0.0:68 sits
        # next to networkd's DHCP clients.
        dhcp {
            load = no
        }
        farp {
            load = no
        }
    }
}

charon-systemd {
    journal {
        # VyOS `log level 0`: SA up/down and errors only.
        default = 0
    }
}

# The swanctl CLI has its own plugin loader and would otherwise print the
# agent CAP_SETUID warning on every invocation.
swanctl {
    plugins {
        agent {
            load = no
        }
    }
}
