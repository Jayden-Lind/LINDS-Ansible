# Managed by LINDS-Ansible: roles/router/files/etc/avahi/avahi-daemon.conf.
# avahi as an mDNS reflector and nothing else. mDNS (224.0.0.251:5353) never
# leaves the network it is sent on, so a phone on the main LAN cannot find an
# AirPlay, Chromecast or Spotify Connect device on another VLAN. This repeats
# every question and answer heard on one of the four interfaces below onto
# the other three. Finding a device is all it does: whether the phone may then
# connect to it is the forward chain's business (nftables.conf), and input
# rule 15 there is what lets the multicast in.

[server]
use-ipv4=yes
# IPv4 only. Every device advertises over IPv4, VLANs 53 and 58 have no IPv6
# prefix and VLAN 52 sends no RA, so there is nothing an IPv6 reflector could
# add.
use-ipv6=no
# Without this avahi answers on every interface, the WANs included. lan0.53
# is the cluster's VLAN: Home Assistant runs there (hostNetwork), and the
# iPhones and the Apple TV on the main LAN find its HomeKit Bridge
# (_hap._tcp) through this reflector.
allow-interfaces=lan0,lan0.52,lan0.53,lan0.58
# The cache is left at its default size, and the reflector leans on it: avahi
# attaches what it already knows to each question it repeats ("known
# answers"), the device then stays silent as mDNS says it should, and avahi
# answers whoever asked from the cache instead. Watched on VLAN 58,
# 2026-10-09: the first browse for the Shield was answered by the Shield,
# the next ones by the cache with the Shield silent.
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
# The router advertises nothing of its own.
disable-publishing=yes
disable-user-service-publishing=yes

[reflector]
enable-reflector=yes
reflect-ipv=no
# Every service type is repeated (Jayden's choice, 2026-10-22): a new kind of
# device on another network works without a change here. An allowlist was
# used for one day. The capture behind it (2026-10-21) showed what really
# crosses: the main LAN looks for the Denon on VLAN 52 (AirPlay, Spotify
# Connect) and the Shield on VLAN 58 (Google Cast, Spotify Connect). The rest
# is what the main LAN's Apple devices, printers and file shares say to each
# other, about 41,000 records a day onto each VLAN. `reflect-filters=` (a
# comma separated list of names) would narrow it; in avahi 0.8 it applies to
# the PTR, SRV and TXT records in answers, never to addresses or questions.
