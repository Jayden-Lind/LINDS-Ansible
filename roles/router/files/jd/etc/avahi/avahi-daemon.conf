# Managed by LINDS-Ansible: roles/router/files/etc/avahi/avahi-daemon.conf.
# avahi as an mDNS reflector and nothing else. mDNS (224.0.0.251:5353) never
# leaves the network it is sent on, so a phone on the main LAN cannot find an
# AirPlay, Chromecast or Spotify Connect device on another VLAN. This repeats
# every question heard on one of the three interfaces below onto the other
# two, and the answers for the service types in reflect-filters (at the end).
# Finding a device is all it does: whether the phone may then
# connect to it is the forward chain's business (nftables.conf), and input
# rule 15 there is what lets the multicast in.

[server]
use-ipv4=yes
# IPv4 only. Every device advertises over IPv4, VLAN 58 has no IPv6 prefix
# and VLAN 52 sends no RA, so there is nothing an IPv6 reflector could add.
use-ipv6=no
# Without this avahi answers on every interface, the WANs included.
allow-interfaces=lan0,lan0.52,lan0.58
# The cache is left at its default size, and the reflector leans on it: avahi
# attaches what it already knows to each question it repeats ("known
# answers"), the device then stays silent as mDNS says it should, and avahi
# answers whoever asked from the cache instead. Watched on VLAN 58,
# 2026-10-09: the first browse for the Shield was answered by the Shield,
# the next ones by the cache with the Shield silent.
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
# The router advertises nothing of its own.
disable-publishing=yes
disable-user-service-publishing=yes

[reflector]
enable-reflector=yes
reflect-ipv=no
# Only answers for these service types go to the other networks (since
# 2026-10-22). A day of capture (2026-10-21) chose them: the main LAN's
# phones and Macs looked for AirPlay and RAOP on the Denon (VLAN 52), Google
# Cast on the Shield (VLAN 58) and Spotify Connect on both. Nothing on VLAN 52
# or 58 looked for anything on the main LAN. The other types are for devices
# of the same kinds: Cast groups (_googlezone), Apple TV and HomePod control
# (_companion-link), HomeKit (_hap) and Matter. Not repeated: what the main
# LAN's Apple devices, printers and file shares say to each other, about
# 41,000 records a day onto each VLAN.
#
# How avahi 0.8 applies the list: an answer passes if the name of its PTR
# target, SRV or TXT record contains one of the entries (case sensitive).
# Host address records always pass, and questions are always repeated. A new
# kind of device on another network stays invisible until its type is here.
# To find the type, run `tcpdump -ni lan0.52 udp port 5353` while the app
# looks for the device.
reflect-filters=_airplay._tcp.local, _raop._tcp.local, _googlecast._tcp.local, _googlezone._tcp.local, _spotify-connect._tcp.local, _companion-link._tcp.local, _hap._tcp.local, _hap._udp.local, _matter._tcp.local, _matterc._udp.local
