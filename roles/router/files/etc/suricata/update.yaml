# Managed by LINDS-Ansible: roles/router/files/etc/suricata/update.yaml
# suricata-update tests new rules with a log directory that only root can
# use. Suricata runs as its own user (run-as in suricata.yaml) and cannot write
# there, so the test fails and the old rules stay. This test uses /tmp.
test-command: ${SURICATA_PATH} -T -c /etc/suricata/suricata.yaml -S ${OUTPUT_FILENAME} -l /tmp

# The rule sources. With a list here, suricata-update does not add ET Open by
# itself, so ET Open is the first entry.
#
# Most traffic is encrypted. Suricata sees the names (DNS, TLS and QUIC server
# names) and not the content, so the two additions are lists of names:
#   - IPFire DBL: domain lists as Suricata datasets. disable.conf keeps only
#     the malware and phishing lists (about 640,000 domains).
#   - Echap stalkerware indicators: the servers of phone spyware (about 1,000
#     rules).
# Tested and not used (2026-11-17): pawpatrules, julioliraup/antiphishing and
# the-hunters-ledger put github.com, discord.com or bing.com in their rules;
# abuse.ch URLhaus is gone (HTTP 410), Feodo Tracker had 5 rules, and the
# abuse.ch certificate list cannot see a TLS 1.3 certificate.
sources:
  - https://rules.emergingthreats.net/open/suricata-%(__version__)s/emerging.rules.tar.gz
  - https://dbl.ipfire.org/lists/suricata.tar.gz
  - https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/generated/suricata.rules
