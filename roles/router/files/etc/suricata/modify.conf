# Managed by LINDS-Ansible: roles/router/files/etc/suricata/modify.conf.
# Only on a router where Suricata blocks (router_ips). suricata-update reads
# this file at each rule refresh.
#
# The address lists have "one alert an hour for each source" in each rule.
# That limits the alerts, not the drops: a block would show once an hour.
# Without it, each blocked connection is in the log and on the dashboard.
modifysid re:msg:.ET.(DROP|CINS|COMPROMISED). " *threshold:[^;]*;" | ""
