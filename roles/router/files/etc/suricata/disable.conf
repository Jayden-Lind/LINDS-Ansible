# Managed by LINDS-Ansible: roles/router/files/etc/suricata/disable.conf. Consumed by suricata-update; a
# change here takes effect on the next rule refresh (the handler runs one).
# A `re:` line is a regular expression that suricata-update searches for in
# the text of each rule, without regard to case. Each match is disabled.
#
# The aim: an alert is something to look at. The counts are alerts in the
# 10 days to 2026-11-17 (jd-router-01 52,450, linds-router-01 11,147).
#
# The engine's own protocol events (395 rules: TCP stream, checksums, QUIC,
# DNS and HTTP decoding). They tell that a packet is unusual, not that it is
# hostile: 7,400 alerts at JD and 7,000 at LINDS, and no host to act on. The
# counters in `suricatasc -c dump-counters` still show capture problems.
re:msg:"SURICATA\s
# ET INFO (4,544 rules). "Informational" by its own name: a device used
# Discord, STUN, a package manager, a connectivity check. 30,636 alerts at JD
# (Discord alone 27,179) and 2,672 at LINDS. The DNS and TLS logs keep every
# name, so nothing is lost for a search.
re:msg:"ET INFO\s
# Lookups in the .to and .cc top-level domains. Normal sites use them.
2027757
2027758
# The Steam client, and a user agent that contains "hacker" (a news reader).
2028651
2008460
# The Python package index, as a "file hosting service".
2049201
# IPFire DBL (a source in update.yaml) has a rule set for each category of
# site. Only the malware and phishing lists stay enabled. The others are
# content filters (advertising, games, shopping, streaming and more).
re:msg:"IPFire DBL \[(?!Malware\]|Phishing\])
