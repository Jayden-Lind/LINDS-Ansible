# Managed by LINDS-Ansible: roles/router/files/etc/suricata/drop.conf.
# Only on a router where Suricata blocks (router_ips). suricata-update reads
# this file at each rule refresh: a rule that matches a line becomes a drop
# rule. All other rules only report.
#
# One kind of rule must not drop: a rule with `noalert`. suricata-update turns
# on some rules again because a second rule needs the mark that they set, and
# gives them `noalert`. They match ordinary traffic too. As drop rules they
# would drop it and log nothing. suricata-update makes them drop rules all the
# same (it does that before it turns them on), so suricata-update.service
# makes them alert rules again after each refresh.
#
# What a rule here must be: a list, or a signature of known malware. Not a
# heuristic. On jd-router-01 none of the signature groups had an alert in the
# 33 days before 2026-11-27, so they block nothing that is in use.
# To let one name or address through: `router unblock THING` on the router.
#
# Lists of hostile addresses (Spamhaus DROP, Dshield, CINS, compromised
# hosts). The rule number makes sure that the rule is from Emerging Threats:
# update.yaml has other rule sources.
re:msg:"ET (DROP|CINS|COMPROMISED) .*sid: *(24|25)[0-9]{5};
# The list of malware and phishing names is not here: its rules are in
# /etc/suricata/blocklist.rules, which suricata-update does not read. On a
# router that blocks, the role writes them as drop rules.
# Stalkerware: the servers that phone-spying apps report to.
re:msg:"PTS STALKERWARE
# Signatures of malware traffic, exploit kits, phishing pages and miners.
re:msg:"ET (MALWARE|MOBILE_MALWARE|EXPLOIT_KIT|PHISHING|COINMINER)\s
