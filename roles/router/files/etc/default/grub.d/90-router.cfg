# Managed by LINDS-Ansible: roles/router/files/etc/default/grub.d/90-router.cfg
# Single-tenant homelab: the speculative-execution mitigations cost more than
# they protect here — the same tradeoff LINDS-Terraform makes with the guest
# CPU flags (VyOS `system option kernel disable-mitigations`).
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT mitigations=off"

# GRUB uses the firmware's text console, not gfxterm. The cloud image sets
# "gfxterm serial": GRUB then loads its own bochs video driver and sets
# 800x600x24 on the VGA, but the firmware still reports 1280x800x32. Linux
# draws its console (efifb) in the firmware's mode, so the Proxmox console
# was unreadable. With the text console, GRUB does not change the mode.
GRUB_TERMINAL_OUTPUT="console serial"
