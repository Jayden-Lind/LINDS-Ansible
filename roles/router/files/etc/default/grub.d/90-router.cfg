# Managed by LINDS-Ansible: roles/router/files/etc/default/grub.d/90-router.cfg
# Single-tenant homelab: the speculative-execution mitigations cost more than
# they protect here — the same tradeoff LINDS-Terraform makes with the guest
# CPU flags (VyOS `system option kernel disable-mitigations`).
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT mitigations=off"
