# Managed by LINDS-Ansible: roles/router/files/etc/sysctl.d/91-suricata.conf
# Only on a router where Suricata blocks (router_ips). Conntrack counts the
# packets of each connection. The firewall gives Suricata the first packets
# of a connection (`ct packets < 60` in the chain suricata of nftables.conf),
# and that test needs the count. A connection that started before this
# setting has no count: Suricata does not get it.
net.netfilter.nf_conntrack_acct = 1
