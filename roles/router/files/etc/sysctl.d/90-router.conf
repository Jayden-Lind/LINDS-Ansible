# Managed by LINDS-Ansible: roles/router/files/etc/sysctl.d/90-router.conf. Every sysctl this router sets.

# ----- Forwarding ----------------------------------------------------------
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1
# No socket lookup on every received packet: almost all of them are
# forwarded, not for a local socket (ip-sysctl.rst: disable it for pure
# routing workloads).
net.ipv4.ip_early_demux = 0

# Reverse-path filtering: 2 (0 off, 1 strict, 2 loose).
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Routes whose next-hop link has no carrier are skipped, so a dead WAN (or the
# link-down lan0/wan0 of a router still being built) never black-holes traffic
# that another table could carry.
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1
net.ipv6.conf.all.ignore_routes_with_linkdown = 1
net.ipv6.conf.default.ignore_routes_with_linkdown = 1

# Daemons may bind service addresses before the link carrying them is up.
net.ipv4.ip_nonlocal_bind = 1
net.ipv6.ip_nonlocal_bind = 1

# ----- Firewall global options (VyOS names in defaults/main.yml) -------------
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.tcp_rfc1337 = 1

# ----- Conntrack -----------------------------------------------------------
net.netfilter.nf_conntrack_max = 524288
# (nf_conntrack_helper is gone since 6.0: helpers are only ever assigned
# explicitly, which nftables' helpers chain does.)

# ----- Kernel hardening ------------------------------------------------------
# A daemon that is taken over cannot make a user namespace. A user namespace is
# the usual way to reach kernel code, such as nf_tables, without root.
kernel.unprivileged_userns_clone = 0
# Kernel addresses are hidden from all users, root included. perf and dropwatch
# need them: set this to 0 while you use those tools.
kernel.kptr_restrict = 2
# A process can trace only its own children.
kernel.yama.ptrace_scope = 1

# ----- Kernel faults ---------------------------------------------------------
# Restart after a kernel fault. If not, the router stays down, and the VPN
# with it, until someone gets to the hypervisor.
kernel.panic = 10
kernel.panic_on_oops = 1

# ----- Tuning ----------------------------------------------------------------
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400
net.ipv4.tcp_rmem = 4096 87380 26214400
net.ipv4.tcp_wmem = 4096 87380 26214400
net.core.netdev_max_backlog = 5000
net.core.netdev_budget = 600
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
# Not under 2 h 4 min (RFC 5382 REQ-5): TCP keepalives start after 2 h on
# most clients, so a shorter timeout drops the NAT mapping of a live idle
# session. The other TCP timeouts are the kernel defaults.
net.netfilter.nf_conntrack_tcp_timeout_established = 7440
net.netfilter.nf_conntrack_udp_timeout_stream = 300

# ECMP across the five Talos nodes (172.16.1.x service VIPs have five equal
# BGP next-hops). The default policy 0 hashes on addresses only, so every
# flow from one client to a VIP lands on the same node; 1 hashes the
# 5-tuple and spreads flows per connection.
net.ipv4.fib_multipath_hash_policy = 1
net.ipv6.fib_multipath_hash_policy = 1
