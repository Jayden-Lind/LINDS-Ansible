# Managed by LINDS-Ansible: roles/router/files/etc/rsyslog.d/60-suricata-eve.conf. Ship Suricata EVE JSON straight to
# the Alloy syslog LoadBalancer in the k8s cluster (-> Loki -> Grafana).
# Dedicated ruleset: these lines never reach journald, the default ruleset or
# local log files. EVE alert events embed packet payloads and can exceed
# rsyslog's 8k default; the Alloy TCP listener accepts up to 1 MiB.
global(maxMessageSize="256k")
module(load="imfile")
# reopenOnTruncate: Debian's logrotate.d/suricata rotates eve.json with
#   copytruncate, so the file keeps its inode and its size drops to 0. Without
#   this imfile holds its old offset and waits for the file to grow back past
#   it. That is what happened at the first weekly rotation (2026-09-13): the
#   reader sat 6 GB into a file that never got that big again, nothing was
#   shipped for three weeks and the Grafana Suricata dashboard went empty.
# freshStartTail: with no state file (first start, or one removed by hand)
#   begin at the end of the file rather than replaying all of it, every line
#   stamped with the time it was read.
# PersistStateInterval: save the read position every 1000 lines (a couple of
#   minutes), not only on a clean stop, so a crash replays little.
# Is it flowing?  ss -tn state established '( dport = :1515 )'   shows two
# sessions (this one and 50-remote.conf), and in Grafana/Loki
#   sum by (event_type) (count_over_time({job="suricata"}[5m]))
input(type="imfile"
      File="/var/log/suricata/eve.json"
      Tag="suricata"
      Severity="info"
      Facility="local5"
      reopenOnTruncate="on"
      freshStartTail="on"
      PersistStateInterval="1000"
      Ruleset="suricata-eve")
ruleset(name="suricata-eve") {
    action(type="omfwd"
           target="172.16.1.23"
           port="1515"
           protocol="tcp"
           TCP_Framing="octet-counted"
           template="RSYSLOG_SyslogProtocol23Format"
           queue.type="linkedList"
           queue.size="10000")
}
