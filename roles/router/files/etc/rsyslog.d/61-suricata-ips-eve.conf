# Managed by LINDS-Ansible: roles/router/files/etc/rsyslog.d/61-suricata-ips-eve.conf
# The blocking Suricata's EVE log, through the relay of 60-suricata-eve.conf.
# The tag is the same, so Alloy gives these events job="suricata" and the same
# fields. In Loki a block is:
#   {job="suricata", event_type="alert"} | alert_action="blocked"
input(type="imfile"
      File="/var/log/suricata-ips/eve.json"
      Tag="suricata"
      Severity="info"
      Facility="local5"
      reopenOnTruncate="on"
      freshStartTail="on"
      PersistStateInterval="100"
      Ruleset="suricata-eve")
