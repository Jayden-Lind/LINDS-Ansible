# Managed by LINDS-Ansible: roles/router/files/etc/rsyslog.d/50-remote.conf. All facilities at info -> Alloy.
# include-timezone/RFC5424 template + octet-counted framing: the Alloy TCP
# listener parses strict RFC5424 and silently drops anything else.
*.info action(type="omfwd"
              target="172.16.1.23"
              port="1515"
              protocol="tcp"
              TCP_Framing="octet-counted"
              template="RSYSLOG_SyslogProtocol23Format"
              queue.type="linkedList"
              queue.size="10000"
              queue.filename="remote-alloy"
              queue.saveOnShutdown="on"
              action.resumeRetryCount="-1")
