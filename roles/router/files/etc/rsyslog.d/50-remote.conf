# Managed by LINDS-Ansible: roles/router/files/etc/rsyslog.d/50-remote.conf. All facilities at info -> Alloy.
# include-timezone/RFC5424 template + octet-counted framing: the Alloy TCP
# listener parses strict RFC5424 and silently drops anything else.
#
# Alloy closes a TCP syslog session that has been idle for two minutes
# (loki.source.syslog idle_timeout). Since the journal was quietened this
# stream often is idle that long. rsyslog notices on the next message,
# reconnects and sends it (nothing is lost), and used to say so in five
# lines, one at error priority, about ten times an hour. Two settings keep
# that out of the log:
#   internalmsg.severity  rsyslog's own messages below error are not logged
#                         (the "suspended"/"resumed" pair, the pool warning);
#   ConErrSkip            the "remote server closed connection" error is
#                         logged once per 1000 occurrences.
# A real outage still shows: "cannot connect to 172.16.1.23:1515" is an error
# and is not skipped. Raising idle_timeout on the Alloy listener
# (LINDS-Kubernetes applications/monitoring-loki.yaml) would remove the
# reconnects themselves.
global(internalmsg.severity="error")
*.info action(type="omfwd"
              target="172.16.1.23"
              port="1515"
              protocol="tcp"
              TCP_Framing="octet-counted"
              template="RSYSLOG_SyslogProtocol23Format"
              queue.type="linkedList"
              queue.size="10000"
              queue.filename="remote-alloy"
              queue.saveOnShutdown="on"
              ConErrSkip="1000"
              action.resumeRetryCount="-1")
