# Managed by LINDS-Ansible: roles/router/files/etc/needrestart/conf.d/50-router.conf
# Never prompt; restart services automatically under apt.
$nrconf{restart} = 'a';

# needrestart's stock list never restarts routing or VPN daemons on its own
# (override_rc in /etc/needrestart/needrestart.conf: frr and *swan => 0), so
# after a library fix they would keep running the old code until restarted by
# hand. On this box the unattended 04:00 run is the maintenance window: let
# both go. The cost is one BGP and one IPsec reconvergence, and only when an
# update touches a library they have loaded.
#
# These are regexes used as hash keys: they must be spelled exactly as in the
# stock file, or the stock entry stays alongside and either one may win.
$nrconf{override_rc}{qr(^frr)} = 1;
$nrconf{override_rc}{qr(^(open|free|libre|strong)swan)} = 1;
