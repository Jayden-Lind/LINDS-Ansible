# Managed by LINDS-Ansible: roles/router/files/etc/unbound/blocklist.conf.
# Names that Unbound does not resolve: advertising, trackers, malware and
# phishing. The site's unbound.conf includes this file.
#
# Each list is a response policy zone (RPZ). For a name on a list Unbound
# answers "no such name" (NXDOMAIN) at once, to each device that asks this
# router: the LAN, the cluster's DNS and the domain controllers. A device
# that uses a different resolver is not covered here (on jd-router-01,
# Suricata blocks the connection to a malware or phishing name).
#
# The zone files are in /var/lib/unbound/rpz. dns-blocklist-update.timer
# fetches them each day (/etc/unbound/blocklists: one list on a line, the
# same names as here). To add a list: add it there and add an `rpz:` clause
# here, with the name that the list's file gives in $ORIGIN, if it has one.
#
# rpz-log: each blocked question is one line in the journal ("rpz: applied
# [LIST] ... CLIENT@port NAME. TYPE IN"). The line goes to Loki with the rest
# of the router's log; the dashboard "DNS blocking" and `router blocked`
# read it.
server:
    # respip does the RPZ work. There is no validator: the upstream (Quad9)
    # validates.
    module-config: "respip iterator"

# First, so that it wins: the names of `router unblock`, as pass-through
# records. `router` writes the zone file.
rpz:
    name: "allow.rpz"
    zonefile: "/var/lib/unbound/rpz/allow.rpz"
    rpz-log: no

# Advertising, trackers and telemetry: HaGeZi Multi Normal.
rpz:
    name: "hagezi-normal.rpz"
    zonefile: "/var/lib/unbound/rpz/hagezi-normal.rpz"
    rpz-log: yes
    rpz-log-name: "ads"

# Malware and phishing: IPFire DBL. The same lists that Suricata uses for
# TLS, QUIC and HTTP on jd-router-01. The zone names are the lists' own.
rpz:
    name: "malware.rpz.ipfire.org"
    zonefile: "/var/lib/unbound/rpz/ipfire-malware.rpz"
    rpz-log: yes
    rpz-log-name: "malware"
rpz:
    name: "phishing.rpz.ipfire.org"
    zonefile: "/var/lib/unbound/rpz/ipfire-phishing.rpz"
    rpz-log: yes
    rpz-log-name: "phishing"
