// Managed by LINDS-Ansible: roles/router/files/etc/kea/kea-dhcp-ddns.conf
// Forward updates only, into the AD zone on the DC pair (no TSIG: the zone
// accepts unsigned updates from the router, as it did for VyOS).
{
  "DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,
    "dns-server-timeout": 500,
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea-ddns-ctrl-socket"
    },
    "tsig-keys": [],
    "forward-ddns": {
      "ddns-domains": [
        {
          "name": "linds.com.au.",
          "dns-servers": [
            {
              "ip-address": "10.0.50.200",
              "port": 53
            },
            {
              "ip-address": "10.3.1.200",
              "port": 53
            }
          ]
        }
      ]
    },
    "reverse-ddns": {
      "ddns-domains": []
    },
    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output-options": [
          {
            "output": "syslog"
          }
        ],
        "severity": "INFO",
        "debuglevel": 0
      }
    ]
  }
}
