// Managed by LINDS-Ansible: roles/router/files/etc/kea/kea-dhcp4.conf
// kea-dhcp4 (the server behind VyOS 1.4 `service dhcp-server`), ported from
// jd-vyos-01. Raw sockets bypass netfilter input, as on VyOS; the socket
// retries cover interfaces that are not ready at start. tcode = VyOS time-zone.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [
        "lan0",
        "lan0.53",
        "lan0.52",
        "lan0.51",
        "lan0.58"
      ],
      "dhcp-socket-type": "raw",
      "service-sockets-require-all": false,
      "service-sockets-max-retries": 60,
      "service-sockets-retry-wait-time": 5000
    },
    // lease_cmds: lease4-get-all & co over the control socket (the "show
    // dhcp server leases" of this box; see README status table).
    "hooks-libraries": [
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so" }
    ],
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },
    "valid-lifetime": 86400,
    "calculate-tee-times": true,
    "authoritative": true,
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "127.0.0.1",
      "server-port": 53001
    },
    "ddns-send-updates": true,
    "ddns-update-on-renew": true,
    "ddns-override-client-update": true,
    "ddns-override-no-update": true,
    "ddns-qualifying-suffix": "linds.com.au.",
    "ddns-conflict-resolution-mode": "no-check-with-dhcid",
    "hostname-char-set": "[^A-Za-z0-9.-]",
    "hostname-char-replacement": "",
    "shared-networks": [
      {
        "name": "JD-LAN",
        "comment": "Main LAN",
