! Managed by LINDS-Ansible: roles/router/files/etc/frr/frr.conf.
! router_static_routes in group_vars.
frr defaults traditional
hostname jd-router-01
log syslog informational
service integrated-vtysh-config
!
! le 32: the Talos nodes advertise specific routes (/24 pod CIDRs, /32
! service + LoadBalancer IPs), never the aggregates. Without le these
! exact-match entries never fire and LINDS learns no route back to the
! JD cluster, so replies to JD pods/services are black-holed (radarr
! 'failed to fetch', 2026-09-06).
ip prefix-list K8S-EXT seq 10 permit 172.16.1.0/24 le 32
ip prefix-list K8S-PODS seq 10 permit 10.244.0.0/16 le 32
ip prefix-list K8S-SVC seq 10 permit 10.96.0.0/12 le 32
ip prefix-list JD-LANS seq 10 permit 10.0.50.0/24
ip prefix-list JD-LANS seq 20 permit 10.0.53.0/24
ip prefix-list NO-ADVERTISE seq 10 deny 0.0.0.0/0
!
route-map RM-EXPORT-IPSEC permit 10
 match ip address prefix-list K8S-PODS
exit
route-map RM-EXPORT-IPSEC permit 20
 match ip address prefix-list K8S-SVC
exit
route-map RM-EXPORT-IPSEC permit 30
 match ip address prefix-list K8S-EXT
exit
! Not in VyOS: it exported only the k8s prefixes and LINDS carried statics
! for the JD LANs. Advertising them lets LINDS drop those.
route-map RM-EXPORT-IPSEC permit 40
 match ip address prefix-list JD-LANS
exit
route-map RM-EXPORT-IPSEC deny 100
exit
route-map RM-NO-ADVERTISE deny 10
 match ip address prefix-list NO-ADVERTISE
exit
!
ip route 192.168.6.0/24 10.255.0.2
ip route 10.0.10.0/24 ipsec10
!
router bgp 64550
 bgp router-id 10.0.50.1
 bgp bestpath as-path multipath-relax
 ! FRR >= 7.4 discards every eBGP update in/out of a neighbour with no policy
 ! (RFC 8212). VyOS emits this line unconditionally; without it the k8s
 ! peers show (Policy) and no pod/service routes are learned.
 no bgp ebgp-requires-policy
 neighbor k8s peer-group
 neighbor k8s remote-as 64512
 bgp listen range 10.0.53.0/24 peer-group k8s
 neighbor 10.255.0.2 remote-as 64551
 neighbor 10.255.0.2 update-source ipsec0
 !
 address-family ipv4 unicast
  network 10.0.10.0/24
  network 10.0.50.0/24
  network 10.0.51.0/24
  network 10.0.53.0/24
  network 10.0.58.0/24
  neighbor k8s route-map RM-NO-ADVERTISE out
  neighbor 10.255.0.2 route-map RM-EXPORT-IPSEC out
 exit-address-family
exit
!
end
