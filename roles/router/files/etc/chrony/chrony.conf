# Managed by LINDS-Ansible: roles/router/files/etc/chrony/chrony.conf.
pool 0.au.pool.ntp.org iburst

# Who may query this router for time (VyOS `ntp allow-client`).
allow 192.168.0.0/16
allow 10.0.0.0/8
allow 172.16.0.0/12

# Until chrony syncs to the pool, answer clients as stratum 10 from the local
# clock. An unsynced answer has stratum 0. SNTP clients (linds-switch-01) read
# that as a kiss-o'-death and stop asking this router.
local stratum 10

driftfile /var/lib/chrony/chrony.drift
makestep 1 3
rtcsync
logdir /var/log/chrony
