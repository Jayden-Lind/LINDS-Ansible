# Managed by LINDS-Ansible: roles/router/files/etc/chrony/chrony.conf.
pool 0.au.pool.ntp.org iburst
server time1.vyos.net iburst
server time2.vyos.net iburst
server time3.vyos.net iburst

# Who may query this router for time (VyOS `ntp allow-client`).
allow 192.168.0.0/16
allow 10.0.0.0/8
allow 172.16.0.0/12

driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
makestep 1 3
rtcsync
leapsectz right/UTC
logdir /var/log/chrony
