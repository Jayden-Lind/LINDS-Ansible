# Managed by LINDS-Ansible: roles/router/files/etc/swanctl/swanctl.conf.
connections {

    # Site-to-site to LINDS, route-based over the if_id 10 XFRM
    # interface. Initiator (VyOS connection-type initiate); keyingtries=0
    # keeps retrying through WAN outages, dpd restart re-initiates after
    # a dead peer. remote id pinned to the peer cert DN, our own id is the
    # cert subject (VyOS use-x509-id).
    LINDS {
        version = 2
        local_addrs = %any
        remote_addrs = linds-pfsense.linds.com.au
        proposals = aes256gcm128-sha256-modp2048
        rekey_time = 28800s
        dpd_delay = 30s
        keyingtries = 0
        mobike = yes
        send_cert = always
        local {
            auth = pubkey
            certs = IPSEC.pem
        }
        remote {
            auth = pubkey
            id = "C=AU, ST=Victoria, L=Langwarrin, O=LINDS-IPSEC, CN=LINDS-IPSEC"
            cacerts = LINDS-CA.pem
        }
        children {
            LINDS {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm128,aes256-sha256
                rekey_time = 3600s
                if_id_in = 10
                if_id_out = 10
                mode = tunnel
                start_action = start
                dpd_action = restart
                close_action = none
            }
        }
    }

    # IKEv2 remote access for mobile clients (EAP-MSCHAPv2), route-based over
    # the if_id 20 XFRM interface.
    #   encap = yes    forced UDP encapsulation: the cellular path drops raw
    #                  inbound ESP, so the SA rides the NAT-T pinhole.
    #   mobike         the client's address changes constantly (WiFi<->cell,
    #                  privacy addresses); the SA follows it, no reauth.
    #   unique=replace a client reconnecting from a new address evicts its
    #                  own stale SA instead of leaking a pool address.
    #   fragmentation  IKE_AUTH carries the cert chain; mandatory over IPv6.
    #   dpd clear      a responder never re-initiates to a road warrior.
    #   dpd_delay = 0  and it never probes one either. A phone parks its radio
    #                  between transmits, so a server-initiated INFORMATIONAL
    #                  is answered only once the device next wakes: measured
    #                  25s and 48s late on 2026-09-08, against a 30s probe
    #                  interval. Eventually one probe outlives the retransmit
    #                  budget and charon destroys a healthy SA ("giving up
    #                  after 5 retransmits", 15:31:40) — which is what the
    #                  road-warrior drops were. The client's own DPD is
    #                  prompt and unaffected, and unique=replace still reaps
    #                  a stale SA when it reconnects. The site-to-site keeps
    #                  its 30s: pfSense answers inside the same second.
    LINDS_MOBILE {
        version = 2
        local_addrs = %any
        remote_addrs = %any
        proposals = aes256gcm128-sha256-modp2048
        rekey_time = 28800s
        dpd_delay = 0
        encap = yes
        mobike = yes
        fragmentation = yes
        unique = replace
        send_cert = always
        pools = MOBILE
        local {
            auth = pubkey
            certs = ipsec_remote.pem
            id = jd-pfsense.linds.com.au
        }
        remote {
            auth = eap-mschapv2
            eap_id = %any
        }
        children {
            LINDS_MOBILE {
                local_ts = 0.0.0.0/0
                esp_proposals = aes256gcm128
                rekey_time = 3600s
                if_id_in = 20
                if_id_out = 20
                dpd_action = clear
            }
        }
    }
}

pools {
    MOBILE {
        addrs = 10.0.10.0/24
        dns = 10.0.50.1
    }
}

# EAP users live in conf.d/secrets.conf (rendered from the vault by Ansible).
include conf.d/*.conf
