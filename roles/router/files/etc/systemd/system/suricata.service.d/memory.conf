# Managed by LINDS-Ansible: roles/router/files/etc/systemd/system/suricata.service.d/memory.conf
# suricata.yaml puts no cap on stream memory (see the comment there). This is
# the backstop for the box: if Suricata ever grows past what the router can
# spare, the kernel kills it inside its own cgroup and Restart=on-failure
# brings it back, rather than the whole VM (5.7 GiB, no swap) running out and
# FRR, charon and kea stalling with it. It sits about 2.4 GiB above what
# Suricata used with the old caps; raise it together with the VM's memory.
[Service]
MemoryMax=4G
