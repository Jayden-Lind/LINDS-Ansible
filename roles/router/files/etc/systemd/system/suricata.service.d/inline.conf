# Managed by LINDS-Ansible: roles/router/files/etc/systemd/system/suricata.service.d/inline.conf
# Only on a router where Suricata blocks (router_ips). Suricata takes its
# packets from NFQUEUE 0 (the firewall chains suricata and suricata_dns), not
# from a copy of the traffic on lan0. suricata.yaml is the same file.
#
# While Suricata does not run (a restart, a crash, `router ips off`), the
# firewall rule accepts the packets (`queue flags bypass`): nothing is
# blocked and nothing is logged, and the internet works.
[Unit]
After=nftables.service

[Service]
# The pass rules of `router unblock`, made again from its list at each start.
ExecStartPre=+/usr/local/sbin/router unblock-rules
ExecStart=
ExecStart=/usr/bin/suricata -D -q 0 -c /etc/suricata/suricata.yaml --pidfile /run/suricata/suricata.pid
Restart=always
RestartSec=5
