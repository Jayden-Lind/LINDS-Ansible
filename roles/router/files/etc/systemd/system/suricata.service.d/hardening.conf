# Managed by LINDS-Ansible: roles/router/files/etc/systemd/system/suricata.service.d/hardening.conf
# Suricata parses every packet from the internet. If an attacker gets into it,
# this limits what he can reach. run-as in suricata.yaml drops the capabilities
# further after the start. CAP_CHOWN gives a new log file to that user.
# CAP_DAC_OVERRIDE is for ExecStop: suricatasc runs as root and the socket
# belongs to the suricata user.
# No MemoryDenyWriteExecute: the PCRE JIT needs memory that is executable.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_RAW CAP_NET_ADMIN CAP_SYS_NICE CAP_SETUID CAP_SETGID CAP_SETPCAP CAP_CHOWN CAP_DAC_OVERRIDE
ProtectSystem=strict
ReadWritePaths=/var/log/suricata /var/lib/suricata /run/suricata
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_PACKET AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
