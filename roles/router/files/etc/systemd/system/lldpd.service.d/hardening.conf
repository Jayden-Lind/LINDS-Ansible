# Managed by LINDS-Ansible: roles/router/files/etc/systemd/system/lldpd.service.d/hardening.conf
# lldpd parses LLDP frames from lan0. It splits itself into a root monitor and
# a child in a chroot, so the unit must allow chroot. Debian's unit sets part of
# this, and it sets ProtectKernelTunables=no.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_DAC_OVERRIDE CAP_SETUID CAP_SETGID CAP_SYS_CHROOT CAP_CHOWN CAP_FOWNER CAP_KILL
ProtectSystem=strict
ReadWritePaths=/run
PrivateDevices=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK AF_PACKET
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service chroot
