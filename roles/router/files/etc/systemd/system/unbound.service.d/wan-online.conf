# Managed by LINDS-Ansible: roles/router/files/etc/systemd/system/unbound.service.d/wan-online.conf
# Start after the WAN has its default routes (at most 30 s, wan-online.service).
# Without this drop-in, Unbound started before the DHCP lease and answered
# SERVFAIL to the LAN's first queries (about 50 after the 2026-11-02 boot).
# If the WAN is down, Unbound starts after 30 s and answers the internal zones.
[Unit]
Wants=wan-online.service
After=wan-online.service
