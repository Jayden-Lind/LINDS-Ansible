# Managed by LINDS-Ansible: roles/router/files/etc/systemd/system/prometheus-smokeping-prober.service.d/wan-online.conf
# Start after the WAN has its default routes (at most 30 s, wan-online.service).
# If the first ping to a target fails, the prober never pings that target
# again. Without this drop-in, after the 2026-11-02 boot it sent no ping to
# 1.1.1.1, 9.9.9.9 or the IPv6 targets for 3.5 days.
[Unit]
Wants=wan-online.service
After=wan-online.service
