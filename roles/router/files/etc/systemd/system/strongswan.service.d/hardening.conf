# Managed by LINDS-Ansible: roles/router/files/etc/systemd/system/strongswan.service.d/hardening.conf
# charon answers IKE from the internet. It runs as root and drops by itself to
# CAP_NET_ADMIN, CAP_NET_RAW and CAP_AUDIT_WRITE. It writes kernel settings
# (xfrm_acq_expires), so this unit has no ProtectKernelTunables.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE CAP_AUDIT_WRITE CAP_SETUID CAP_SETGID CAP_SETPCAP CAP_CHOWN CAP_DAC_OVERRIDE CAP_SYS_NICE
ProtectSystem=strict
ReadWritePaths=/run -/var/lib/strongswan
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK AF_PACKET AF_ALG
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
