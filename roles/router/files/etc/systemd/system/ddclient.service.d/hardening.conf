# Managed by LINDS-Ansible: roles/router/files/etc/systemd/system/ddclient.service.d/hardening.conf
# ddclient runs as root and holds the Cloudflare token. It only reads its
# config, makes HTTPS requests and writes its cache and PID file, so it keeps
# no capabilities. Its files belong to root, so it can still use them.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectSystem=strict
ReadWritePaths=/var/cache/ddclient /run
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
