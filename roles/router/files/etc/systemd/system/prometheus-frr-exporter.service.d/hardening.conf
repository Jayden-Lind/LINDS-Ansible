# Managed by LINDS-Ansible: roles/router/files/etc/systemd/system/prometheus-frr-exporter.service.d/hardening.conf
# Talks to FRR's sockets and answers on one TCP port. Debian's unit already
# has part of this. ProtectSystem=strict needs /run/frr: FRR's sockets are there.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectSystem=strict
ReadWritePaths=/run/frr
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
