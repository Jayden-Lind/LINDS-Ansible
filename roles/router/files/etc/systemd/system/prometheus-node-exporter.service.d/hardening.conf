# Managed by LINDS-Ansible: roles/router/files/etc/systemd/system/prometheus-node-exporter.service.d/hardening.conf
# Reads /proc, /sys and the textfile directory, and answers on one TCP port.
# The timex collector reads the clock state with adjtimex, so the unit allows
# that call and has no ProtectClock. With no capabilities it cannot set the
# clock. The alerts on clock sync need these metrics.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service adjtimex
