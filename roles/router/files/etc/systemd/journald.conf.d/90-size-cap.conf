# Managed by LINDS-Ansible: roles/router/files/etc/systemd/journald.conf.d/90-size-cap.conf
# The journal is in RAM (/run/log/journal), 256 MB at most. On disk it wrote
# about 6.7 GB a day to the VM pool (2026-11-06: 23.8 GB in 3.5 days for a
# 282 MB journal): each new line rewrites hash-table pages all through the
# file. Nothing is lost that is needed: rsyslog still writes /var/log/syslog,
# auth.log and kern.log on disk, and sends every line of info and above to
# Loki. After a reboot `journalctl -b -1` is empty; read the earlier boot in
# /var/log/syslog or in Loki.
[Journal]
Storage=volatile
RuntimeMaxUse=256M
