# Managed by LINDS-Ansible: roles/router/files/etc/systemd/system.conf.d/90-watchdog.conf.
#
# systemd writes to the hardware watchdog of the VM. If the kernel or systemd
# stops for 30 s, the watchdog device resets the VM (Proxmox:
# `watchdog: i6300esb,action=reset`), and the site gets its router back
# without a person. A hung guest still answers the QEMU process check, so
# Proxmox HA or `onboot` does not see it.
#
# With no watchdog device in the VM this setting does nothing. Look at
# `systemctl show -p WatchdogDevice -p RuntimeWatchdogUSec` and `wdctl`.
[Manager]
RuntimeWatchdogSec=30
# Time limit for a clean reboot or shutdown before the device resets the VM.
RebootWatchdogSec=10min
