# Managed by LINDS-Ansible: roles/router/files/linds/etc/unbound/unbound.conf.
# Unbound (Debian 13): the DNS forwarder for the main LAN and every VLAN at
# LINDS. The same settings as jd-router-01 (files/jd/etc/unbound/
# unbound.conf has the reasoning and the measurements): answers from the
# cache, expired ones served at once and refreshed behind the client, the
# rest to Quad9 over DNS over TLS, the internal zones to the DCs and
# kube-dns. No DNSSEC validation here: Quad9 does it. linds-vyos-01 had
# none of that, only a 60 s negative TTL.
#
# This file is the whole configuration. Debian's unbound.conf.d snippets
# (root trust anchor, remote control) are not included.

server:
    # The addresses VyOS listened on: the main LAN and every VLAN. No IPv6
    # listener: the RA here carries no DNS server, clients use the one
    # DHCPv4 gives them. ip-freebind lets Unbound start before an address is
    # up (the unit only waits for network.target).
    interface: 192.168.6.1
    interface: 10.3.1.1
    interface: 10.0.80.1
    interface: 10.0.36.1
    interface: 10.0.110.1
    port: 53
    ip-freebind: yes
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    msg-cache-size: 64m
    rrset-cache-size: 128m

    # Cache: as at JD. After changing an internal record:
    # `unbound-control flush NAME`, or
    # `unbound-control flush_zone linds.com.au` for the subtree.
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 0
    serve-expired-reply-ttl: 30
    prefetch: yes
    cache-max-negative-ttl: 300
    infra-keep-probing: yes
    prefer-ip4: yes

    # Forwarding only, no DNSSEC validation.
    module-config: "iterator"
    # Quad9's certificate is checked against the system CA store.
    tls-system-cert: yes

    # Private reverse zones are answered here with NXDOMAIN (Unbound's
    # default), except the four that the DCs host (forward-zone below).
    local-zone: "50.0.10.in-addr.arpa." transparent
    local-zone: "250.0.10.in-addr.arpa." transparent
    local-zone: "1.4.10.in-addr.arpa." transparent
    local-zone: "6.168.192.in-addr.arpa." transparent

    # Counters for `router metrics`.
    extended-statistics: yes
    statistics-cumulative: yes
    statistics-interval: 0

    verbosity: 1
    log-servfail: yes
    ede: yes
    ede-serve-expired: yes
    hide-identity: yes
    hide-version: yes

remote-control:
    control-enable: yes
    control-interface: /run/unbound.ctl

# Quad9, not Cloudflare (which linds-vyos-01 forwarded to). Checked from this
# site on 2026-10-13 (50 common names, four lookups each through both, then
# a TCP handshake to every answer, from linds-proxmox-01):
#   * Cloudflare gave an answer over 50 ms away where Quad9's was under 25 ms
#     every time for 10 of the 50: i.ytimg.com, fonts.gstatic.com,
#     docs.google.com, drive.google.com and five more of Google's at about
#     120 ms where Quad9's were 4 to 5 ms, and outlook.office365.com at
#     154 ms. The reverse: none.
#   * Mean handshake to the answers: Cloudflare 33 ms, Quad9 25 ms.
#   * Time to answer, median / 95th percentile: Cloudflare 5.3 / 6.4 ms,
#     Quad9 4.4 / 5.0 ms.
# If Quad9 refuses a name that is wanted: 9.9.9.10 / 149.112.112.10 is the
# same service without the block list. DNS over TLS as at JD: the ISP cannot
# read the names, and a wrong certificate gives SERVFAIL, not answers.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 2620:fe::fe@853#dns.quad9.net
    forward-addr: 2620:fe::9@853#dns.quad9.net

# The two LINDS DCs, then JD's over the IPsec tunnel. Unbound prefers the
# one that answers faster.
forward-zone:
    name: "linds.com.au."
    forward-addr: 10.3.1.200
    forward-addr: 10.3.1.201
    forward-addr: 10.0.50.200

# kube-dns, reachable because Cilium advertises ClusterIPs over BGP.
forward-zone:
    name: "k8s.linds.com.au."
    forward-addr: 10.96.0.10

forward-zone:
    name: "50.0.10.in-addr.arpa."
    forward-addr: 10.3.1.200
    forward-addr: 10.3.1.201
    forward-addr: 10.0.50.200
forward-zone:
    name: "250.0.10.in-addr.arpa."
    forward-addr: 10.3.1.200
    forward-addr: 10.3.1.201
    forward-addr: 10.0.50.200
forward-zone:
    name: "1.4.10.in-addr.arpa."
    forward-addr: 10.3.1.200
    forward-addr: 10.3.1.201
    forward-addr: 10.0.50.200
forward-zone:
    name: "6.168.192.in-addr.arpa."
    forward-addr: 10.3.1.200
    forward-addr: 10.3.1.201
    forward-addr: 10.0.50.200
