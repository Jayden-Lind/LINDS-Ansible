! Managed by LINDS-Ansible: roles/router/files/linds/etc/frr/frr.conf.
! linds-router-01: what linds-vyos-01's `protocols` came to in FRR
! (`vtysh -c 'show running-config'` there, 2026-10-13), minus what did nothing.
frr defaults traditional
hostname linds-router-01
log syslog informational
service integrated-vtysh-config
!
ip prefix-list NO-ADVERTISE seq 10 deny 0.0.0.0/0
!
route-map RM-NO-ADVERTISE deny 10
 match ip address prefix-list NO-ADVERTISE
exit
!
! Not carried over from VyOS: the K8S-EXT/K8S-PODS/K8S-SVC prefix-lists and
! route-map RM-EXPORT-IPSEC. They were defined there but applied to no
! neighbour, so LINDS has always sent JD everything it has in BGP (its own
! five networks and what the two Talos workers here advertise), and still
! does. To filter it, copy the route-map from files/jd/etc/frr/frr.conf; the
! prefix-lists need `le 32` there for the reason given in that file.
!
! JD's main LAN, as on VyOS. jd-router-01 also advertises it (and 10.0.53.0/24
! and its road-warrior pool) over BGP; the static is what is left when the
! tunnel is up and the session is not.
ip route 10.0.50.0/24 10.255.0.1
!
router bgp 64551
 ! VyOS let FRR pick the highest address, which was this one. Pinned so a
 ! build with lan0 down does not pick another.
 bgp router-id 192.168.6.1
 ! FRR >= 7.4 discards every eBGP update in/out of a neighbour with no policy
 ! (RFC 8212). VyOS emits this line unconditionally; without it the k8s
 ! peers show (Policy) and no pod/service routes are learned.
 no bgp ebgp-requires-policy
 ! The Talos workers at this site (10.3.1.100, .101; Cilium, AS 64513) open
 ! the session. VyOS also listened for 10.0.53.0/24, which is JD's node
 ! network and peers with jd-router-01.
 neighbor k8s peer-group
 neighbor k8s remote-as 64513
 bgp listen range 10.3.1.0/24 peer-group k8s
 neighbor 10.255.0.1 remote-as 64550
 neighbor 10.255.0.1 update-source ipsec0
 !
 address-family ipv4 unicast
  network 10.0.36.0/24
  network 10.0.80.0/24
  network 10.0.110.0/24
  network 10.3.1.0/24
  network 192.168.6.0/24
  neighbor k8s route-map RM-NO-ADVERTISE out
 exit-address-family
exit
!
end
