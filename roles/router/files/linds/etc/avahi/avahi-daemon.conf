# Managed by LINDS-Ansible: roles/router/files/linds/etc/avahi/avahi-daemon.conf.
# avahi as an mDNS reflector and nothing else, as on jd-router-01;
# linds-vyos-01 had no such service. mDNS (224.0.0.251:5353) never leaves the
# network it is sent on, so a phone on the main LAN cannot find by name what
# sits on another VLAN. This repeats every question and answer heard on one
# of the three interfaces below onto the other two. Finding a device is all
# it does: whether the phone may then connect to it is the forward chain's
# business (nftables.conf; here it accepts everything between these
# networks), and input rule 15 there is what lets the multicast in.

[server]
use-ipv4=yes
# IPv4 only. Every device advertises over IPv4 and the VLANs have no IPv6,
# so there is nothing an IPv6 reflector could add.
use-ipv6=no
# Without this avahi answers on every interface, the WAN included.
# The main LAN, VLAN 80 (management) and VLAN 300 (servers): the three
# networks that have something to find or someone looking. Left out: VLAN 36,
# which leaves by the VPN tunnel and is kept apart, and VLAN 110, which had
# nothing on it on 2026-10-13. To add a network, name it here and in input
# rule 15 of nftables.conf.
allow-interfaces=lan0,lan0.80,lan0.300
# The cache is left at its default size, and the reflector leans on it: avahi
# attaches what it already knows to each question it repeats ("known
# answers"), the device then stays silent as mDNS says it should, and avahi
# answers whoever asked from the cache instead.
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
# The router advertises nothing of its own.
disable-publishing=yes
disable-user-service-publishing=yes

[reflector]
enable-reflector=yes
reflect-ipv=no
# Everything is reflected. `reflect-filters=` (a comma separated list of
# service types or host names) would narrow it, at the price of a new kind
# of device staying invisible until its type is added here.
