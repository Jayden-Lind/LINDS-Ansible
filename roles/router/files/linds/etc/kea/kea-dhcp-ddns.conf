// Managed by LINDS-Ansible: roles/router/files/linds/etc/kea/kea-dhcp-ddns.conf
// Forward (A) and reverse (PTR) updates, into the AD zones (no TSIG: the
// zones accept unsigned updates from the router, as they did for VyOS). The
// servers are tried in order: the two DCs at this site, then JD's over the
// tunnel. VyOS's second server was 10.0.50.1, which is JD's router: a
// forwarder, not a DNS server that holds the zone, so it could never have
// taken an update.
{
  "DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,
    "dns-server-timeout": 500,
    // Kea 3 accepts a control socket only in /var/run/kea. It compares
    // the text of the path, so /run/kea (the same directory) fails.
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/var/run/kea/kea-ddns-ctrl-socket"
    },
    "tsig-keys": [],
    "forward-ddns": {
      "ddns-domains": [
        {
          "name": "linds.com.au.",
          "dns-servers": [
            {
              "ip-address": "10.3.1.200",
              "port": 53
            },
            {
              "ip-address": "10.3.1.201",
              "port": 53
            },
            {
              "ip-address": "10.0.50.200",
              "port": 53
            }
          ]
        }
      ]
    },
    // One entry for each reverse zone that the DCs hold for a DHCP subnet
    // of this site, with the same servers as the forward zone. A lease
    // whose address is in none of these zones gets no PTR. Kea writes the
    // PTR only after the A record update succeeds (RFC 4703), and it
    // replaces all PTR records of that address.
    "reverse-ddns": {
      "ddns-domains": [
        {
          "name": "6.168.192.in-addr.arpa.",
          "dns-servers": [
            {
              "ip-address": "10.3.1.200",
              "port": 53
            },
            {
              "ip-address": "10.3.1.201",
              "port": 53
            },
            {
              "ip-address": "10.0.50.200",
              "port": 53
            }
          ]
        }
      ]
    },
    // WARN: at INFO every update logs a ten-line DHCP_DDNS_ADD_SUCCEEDED.
    // Kea 3.2 sends few: a renewal answered from the lease cache sends
    // none, and a renewal sends no remove first (about 3 updates an hour at
    // JD, 2026-10-20; it was about 50 on Kea 2.6). Timeouts and failed
    // updates are ERROR and still show.
    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output-options": [
          {
            "output": "syslog"
          }
        ],
        "severity": "WARN",
        "debuglevel": 0
      }
    ]
  }
}
