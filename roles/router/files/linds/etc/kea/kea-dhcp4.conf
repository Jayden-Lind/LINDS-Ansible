// Managed by LINDS-Ansible: roles/router/files/linds/etc/kea/kea-dhcp4.conf
// kea-dhcp4 (the server behind VyOS 1.4 `service dhcp-server`), ported from
// linds-vyos-01: the same five networks, pools, options and the two Talos
// reservations. Raw sockets bypass netfilter input, as on VyOS; the socket
// retries cover interfaces that are not ready at start.
//
// The subnet ids (1-5) are VyOS's on purpose. VyOS runs kea as well
// (/config/dhcp/dhcp4-leases.csv), and a lease file names each lease's subnet
// by id, so that file can be carried over at cutover and every client keeps
// its address (README, cutover).
//
// One setting is jd-router-01's rather than VyOS's: authoritative. VyOS had
// it false, so a client asking to keep an address the server has no record
// of got silence and waited out a timeout before starting again. This is the
// only DHCP server on these networks; it says no at once.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [
        "lan0",
        "lan0.300",
        "lan0.110",
        "lan0.80",
        "lan0.36"
      ],
      "dhcp-socket-type": "raw",
      "service-sockets-require-all": false,
      // Open the sockets of a link that comes up late for up to 24 h (one try
      // a minute), not 5 minutes. A router built with its LAN links down
      // (linds-router-01) then serves DHCP when they come up, without a restart.
      "service-sockets-max-retries": 1440,
      "service-sockets-retry-wait-time": 60000
    },
    // lease_cmds: lease4-get-all & co over the control socket (the "show
    // dhcp server leases" of this box; see README status table).
    "hooks-libraries": [
      {
        "library": "libdhcp_lease_cmds.so"
      }
    ],
    // Kea 3 accepts a control socket only in /var/run/kea. It compares
    // the text of the path, so /run/kea (the same directory) fails.
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/var/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },
    "valid-lifetime": 86400,
    "calculate-tee-times": true,
    "authoritative": true,
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "127.0.0.1",
      "server-port": 53001
    },
    "ddns-send-updates": true,
    "ddns-update-on-renew": true,
    "ddns-override-client-update": true,
    "ddns-override-no-update": true,
    "ddns-qualifying-suffix": "linds.com.au.",
    // check-exists-with-dhcid: Kea changes a name only if it carries a DHCID
    // (a name Kea wrote), and a remove deletes only that lease's address.
    // With no-check-with-dhcid every add and remove replaced all A records
    // of the name: when an old lease of a phone (an earlier private MAC,
    // same hostname) expired, the phone's live record went too. Names that
    // Windows PCs register themselves have no DHCID and stay theirs; kea-
    // dhcp-ddns logs DHCP_DDNS_FORWARD_REPLACE_REJECTED for those.
    "ddns-conflict-resolution-mode": "check-exists-with-dhcid",
    // TTL of the records that Kea writes. Without it Kea uses a third of
    // the lease (8 h with 24 h leases), so a device that moves to another
    // address stays wrong in DNS caches for hours. Windows registers its
    // own records with 1200 s.
    "ddns-ttl": 1200,
    "hostname-char-set": "[^A-Za-z0-9.-]",
    "hostname-char-replacement": "",
    "shared-networks": [
      {
        "name": "LINDS-LAN",
        "comment": "Main LAN",
        "option-data": [
          {
            "name": "domain-name",
            "data": "linds.com.au"
          },
          {
            "name": "domain-search",
            "data": "linds.com.au"
          },
          {
            "name": "domain-name-servers",
            "data": "192.168.6.1"
          }
        ],
        "subnet4": [
          {
            "id": 1,
            "subnet": "192.168.6.0/24",
            "interface": "lan0",
            "pools": [
              {
                "pool": "192.168.6.2 - 192.168.6.199"
              }
            ],
            "option-data": [
              {
                "name": "routers",
                "data": "192.168.6.1"
              }
            ],
            "reservations": []
          }
        ]
      },
      {
        "name": "LINDS-SERVER",
        "comment": "VLAN 300: servers",
        "option-data": [
          {
            "name": "domain-name",
            "data": "linds.com.au"
          },
          {
            "name": "domain-search",
            "data": "linds.com.au"
          },
          {
            "name": "domain-name-servers",
            "data": "10.3.1.1, 10.3.1.200"
          }
        ],
        "subnet4": [
          {
            "id": 2,
            "subnet": "10.3.1.0/24",
            "interface": "lan0.300",
            "pools": [
              {
                "pool": "10.3.1.2 - 10.3.1.199"
              }
            ],
            "option-data": [
              {
                "name": "routers",
                "data": "10.3.1.1"
              }
            ],
            "reservations": [
              {
                "hw-address": "02:24:11:d4:f3:e1",
                "ip-address": "10.3.1.100",
                "hostname": "talos-linds-worker-01"
              },
              {
                "hw-address": "02:24:11:d4:f3:e2",
                "ip-address": "10.3.1.101",
                "hostname": "talos-linds-worker-02"
              }
            ]
          }
        ]
      },
      {
        "name": "LINDS_CAMERAS",
        "comment": "VLAN 110: cameras",
        "option-data": [
          {
            "name": "domain-name",
            "data": "linds.com.au"
          },
          {
            "name": "domain-search",
            "data": "linds.com.au"
          },
          {
            "name": "domain-name-servers",
            "data": "10.0.110.1"
          }
        ],
        "subnet4": [
          {
            "id": 3,
            "subnet": "10.0.110.0/24",
            "interface": "lan0.110",
            "pools": [
              {
                "pool": "10.0.110.2 - 10.0.110.199"
              }
            ],
            "option-data": [
              {
                "name": "routers",
                "data": "10.0.110.1"
              }
            ],
            "reservations": []
          }
        ]
      },
      {
        "name": "LINDS_MANAGEMENT",
        "comment": "VLAN 80: management. 10.0.80.4 is kept out of the pool, as on VyOS (exclude)",
        "option-data": [
          {
            "name": "domain-name",
            "data": "linds.com.au"
          },
          {
            "name": "domain-search",
            "data": "linds.com.au"
          },
          {
            "name": "domain-name-servers",
            "data": "10.0.80.1"
          }
        ],
        "subnet4": [
          {
            "id": 4,
            "subnet": "10.0.80.0/24",
            "interface": "lan0.80",
            "pools": [
              {
                "pool": "10.0.80.2 - 10.0.80.3"
              },
              {
                "pool": "10.0.80.5 - 10.0.80.199"
              }
            ],
            "option-data": [
              {
                "name": "routers",
                "data": "10.0.80.1"
              }
            ],
            "reservations": []
          }
        ]
      },
      {
        "name": "LINDS_VPN",
        "comment": "VLAN 36: leaves by the NordVPN tunnel",
        "option-data": [
          {
            "name": "domain-name",
            "data": "linds.com.au"
          },
          {
            "name": "domain-search",
            "data": "linds.com.au"
          },
          {
            "name": "domain-name-servers",
            "data": "10.0.36.1"
          }
        ],
        "subnet4": [
          {
            "id": 5,
            "subnet": "10.0.36.0/24",
            "interface": "lan0.36",
            "pools": [
              {
                "pool": "10.0.36.2 - 10.0.36.199"
              }
            ],
            "option-data": [
              {
                "name": "routers",
                "data": "10.0.36.1"
              }
            ],
            "reservations": []
          }
        ]
      }
    ],
    // One line per lease, not five per packet exchange: the root logger is
    // WARN and only the `leases` logger stays at INFO, which is the line that
    // says who got which address. For a debugging session, set the root back
    // to INFO and `config-reload` over the control socket.
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          {
            "output": "syslog"
          }
        ],
        "severity": "WARN",
        "debuglevel": 0
      },
      {
        "name": "kea-dhcp4.leases",
        "output-options": [
          {
            "output": "syslog"
          }
        ],
        "severity": "INFO",
        "debuglevel": 0
      }
    ]
  }
}
