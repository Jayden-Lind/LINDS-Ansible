# Managed by LINDS-Ansible: roles/router/files/linds/etc/swanctl/swanctl.conf.
connections {

    # Site-to-site to JD, route-based over the if_id 10 XFRM interface
    # (ipsec0). This is the other end of the connection of the same name in
    # files/jd/etc/swanctl/swanctl.conf and is kept its mirror image: same
    # proposals, same lifetimes, same certificate (one certificate, both
    # ends, so local and remote identity are the same DN), each end naming
    # the other's dynamic DNS record.
    #
    # Both ends initiate, as they did when this end was VyOS (connection-type
    # initiate). keyingtries=0 keeps retrying through WAN outages, dpd
    # restart re-initiates after a dead peer, and start_action = trap|start
    # leaves a trap policy on if_id 10, so any packet routed into ipsec0
    # while there is no SA (BGP to 10.255.0.1 retries on its own) makes
    # charon initiate again. The jd file tells what that trap is for: the
    # tunnel was twice left down for good on 2026-10-10 when the one attempt
    # made had failed, or the peer had closed cleanly.
    #
    # VyOS offered both address families inside the tunnel (0.0.0.0/0 and
    # ::/0); jd-router-01 only ever agreed to IPv4, so that is what is asked
    # for here.
    LINDS {
        version = 2
        local_addrs = %any
        remote_addrs = jd-pfsense.linds.com.au
        proposals = aes256gcm128-sha256-modp2048
        rekey_time = 28800s
        dpd_delay = 30s
        keyingtries = 0
        mobike = yes
        send_cert = always
        local {
            auth = pubkey
            certs = IPSEC.pem
        }
        remote {
            auth = pubkey
            id = "C=AU, ST=Victoria, L=Langwarrin, O=LINDS-IPSEC, CN=LINDS-IPSEC"
            cacerts = LINDS-CA.pem
        }
        children {
            LINDS {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm128,aes256-sha256
                rekey_time = 3600s
                if_id_in = 10
                if_id_out = 10
                mode = tunnel
                start_action = trap|start
                dpd_action = restart
                close_action = none
            }
        }
    }
}
