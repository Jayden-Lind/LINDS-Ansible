# Managed by LINDS-Ansible: roles/router/files/linds/etc/ssh/sshd_config.d/10-router.conf.
# The two addresses VyOS listened on.
ListenAddress 192.168.6.1
ListenAddress 10.3.1.1
PasswordAuthentication no
KbdInteractiveAuthentication no
# Keys only, and no login as root: root has no key. Use your account and sudo.
AuthenticationMethods publickey
PermitRootLogin no
X11Forwarding no
LoginGraceTime 30
