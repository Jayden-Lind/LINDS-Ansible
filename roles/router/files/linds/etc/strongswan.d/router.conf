# Managed by LINDS-Ansible: roles/router/files/linds/etc/strongswan.d/router.conf. VyOS `vpn ipsec options` and
# `vpn ipsec interface`, as charon settings.
charon {
    # Route-based: the XFRM interfaces and FRR own routing (VyOS
    # disable-route-autoinstall).
    install_routes = no
    install_virtual_ip = yes
    # start_action = start initiates once at load. If that fails because the
    # WAN has no address yet (charon starts before the DHCP lease lands; on the
    # VF this took 16 s) the connection would otherwise sit idle forever.
    retry_initiate_interval = 30
    # IKE only on the WAN (VyOS `vpn ipsec interface`). This is also what
    # keeps a router still being built, with wan0 down and a default route
    # through its management NIC, from opening a second tunnel to JD beside
    # the one linds-vyos-01 holds.
    interfaces_use = wan0
    plugins {
        # ssh-agent key loading; needs CAP_SETUID and logs a warning otherwise.
        agent {
            load = no
        }
        # Virtual IPs via DHCP: not used, and its socket on 0.0.0.0:68 sits
        # next to networkd's DHCP clients.
        dhcp {
            load = no
        }
        farp {
            load = no
        }
    }
}

charon-systemd {
    journal {
        # SA up/down and errors only, as on jd-router-01 (VyOS here had
        # `log level 1`).
        default = 0
    }
}

# The swanctl CLI has its own plugin loader and would otherwise print the
# agent CAP_SETUID warning on every invocation.
swanctl {
    plugins {
        agent {
            load = no
        }
    }
}
