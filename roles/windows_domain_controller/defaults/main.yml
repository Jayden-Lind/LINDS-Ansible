---
# The AD site of the new domain controller: the host variable ad_site.
windows_dc_site: "{{ ad_site }}"

# The Directory Services Restore Mode password. make windows-promote asks for
# it; if you type nothing, the password in the vault is used.
windows_dsrm_password: "{{ lookup('ansible.builtin.env', 'WINDOWS_DSRM_PASSWORD') | default(vault_windows_dsrm_password | default(''), true) }}"

# The DNS forwarders of the server. Set them in the inventory.
windows_dc_dns_forwarders: []

# The resolvers of the server itself: another domain controller first, then
# itself. A domain controller that only asks itself can stop at boot.
windows_dc_dns_client_servers: "{{ windows_dns_servers + ['127.0.0.1'] }}"

# Maximum times to wait, in seconds: for the directory and SYSVOL after the
# restart, and for the RID pool.
windows_dc_ready_timeout: 1800
windows_dc_rid_pool_timeout: 900

# Do not finish the promotion until LDAPS answers with a certificate from the
# domain CA. Set it to false in a domain without an enterprise CA.
windows_dc_require_ldaps: true
windows_dc_ldaps_timeout: 600
