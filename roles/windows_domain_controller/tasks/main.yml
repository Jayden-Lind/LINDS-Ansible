---
- name: Install the directory, DNS and management features
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - DNS
      - GPMC
      - RSAT-AD-Tools
      - RSAT-DNS-Server
    state: present
    include_management_tools: true
  register: windows_dc_features

- name: Restart if the features asked for it
  ansible.windows.win_reboot:
    reboot_timeout: 900
  when: windows_dc_features.reboot_required

- name: See whether this server is already a domain controller
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      # 4 and 5 are backup and primary domain controller.
      (Get-CimInstance Win32_ComputerSystem).DomainRole -ge 4
  register: windows_dc_state
  changed_when: false

- name: A restore-mode password is needed to promote
  ansible.builtin.assert:
    that: windows_dsrm_password | length >= 12
    fail_msg: >-
      Promotion needs a Directory Services Restore Mode password of at least
      12 characters. vault_windows_dsrm_password is missing from the vault and
      none was typed at `make windows-promote HOST=...`.
  when: not windows_dc_state.output[0]

- name: Promote to an additional domain controller
  ansible.windows.win_powershell:
    parameters:
      Domain: "{{ windows_domain }}"
      Site: "{{ windows_dc_site }}"
    sensitive_parameters:
      - name: SafeModePassword
        value: "{{ windows_dsrm_password }}"
    script: |
      param([string]$Domain, [string]$Site, [securestring]$SafeModePassword)
      $ErrorActionPreference = 'Stop'
      Import-Module ADDSDeployment
      Install-ADDSDomainController -DomainName $Domain -SiteName $Site `
          -InstallDns:$true -NoGlobalCatalog:$false -CreateDnsDelegation:$false `
          -SafeModeAdministratorPassword $SafeModePassword `
          -NoRebootOnCompletion:$true -Force:$true -WarningAction SilentlyContinue | Out-Null
      $Ansible.Changed = $true
  when: not windows_dc_state.output[0]
  register: windows_dc_promote

- name: Restart as a domain controller
  ansible.windows.win_reboot:
    reboot_timeout: 1800
    post_reboot_delay: 60
  when: windows_dc_promote is changed

- name: Wait for the directory and SYSVOL to be served
  ansible.windows.win_powershell:
    parameters:
      TimeoutSeconds: "{{ windows_dc_ready_timeout | int }}"
    script: |
      param([int]$TimeoutSeconds)
      $Ansible.Changed = $false
      $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
      do {
          $ready = $false
          try {
              Import-Module ActiveDirectory -ErrorAction Stop
              $dc = Get-ADDomainController -Identity $env:COMPUTERNAME -ErrorAction Stop
              $shares = @(Get-SmbShare -Name SYSVOL, NETLOGON -ErrorAction Stop)
              $ready = $dc -and $shares.Count -eq 2
          } catch { }
          if (-not $ready) { Start-Sleep -Seconds 20 }
      } until ($ready -or (Get-Date) -gt $deadline)
      if (-not $ready) { throw 'The directory or SYSVOL was not being served when the wait ran out.' }
      [pscustomobject]@{ site = $dc.Site; global_catalog = $dc.IsGlobalCatalog }
  register: windows_dc_ready
  changed_when: false

- name: Set the DNS server's forwarders
  ansible.windows.win_powershell:
    parameters:
      Forwarders: "{{ windows_dc_dns_forwarders }}"
    script: |
      param([string[]]$Forwarders)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $have = @((Get-DnsServerForwarder).IPAddress | ForEach-Object { $_.IPAddressToString })
      if (Compare-Object $have $Forwarders -SyncWindow 0) {
          Set-DnsServerForwarder -IPAddress $Forwarders
          $Ansible.Changed = $true
      }

- name: Point the server's own resolver at a partner first, then itself
  ansible.windows.win_powershell:
    parameters:
      Servers: "{{ windows_dc_dns_client_servers }}"
    script: |
      param([string[]]$Servers)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $nic = Get-NetAdapter -Physical | Where-Object Status -eq 'Up' | Select-Object -First 1
      $have = @((Get-DnsClientServerAddress -InterfaceIndex $nic.ifIndex -AddressFamily IPv4).ServerAddresses)
      if (Compare-Object $have $Servers -SyncWindow 0) {
          Set-DnsClientServerAddress -InterfaceIndex $nic.ifIndex -ServerAddresses $Servers
          $Ansible.Changed = $true
      }

# The other site's domain controller, which holds the RID master role, does
# not know this one exists until the next scheduled replication. Until it
# does, this one has no RID pool and cannot create users, groups or computers.
- name: Tell every other domain controller about this one
  ansible.builtin.include_role:
    name: windows_ad_converge
  vars:
    windows_ad_converge_computer: "{{ windows_hostname | default(inventory_hostname_short) }}"
    windows_ad_converge_state: present

- name: Wait for its RID pool
  ansible.windows.win_powershell:
    parameters:
      TimeoutSeconds: "{{ windows_dc_rid_pool_timeout | int }}"
    script: |
      param([int]$TimeoutSeconds)
      $Ansible.Changed = $false
      Import-Module ActiveDirectory
      $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
      do {
          $me = Get-ADComputer -Identity $env:COMPUTERNAME -Properties rIDSetReferences -Server $env:COMPUTERNAME -ErrorAction SilentlyContinue
          $have = [bool]$me.rIDSetReferences
          if (-not $have) { Start-Sleep -Seconds 20 }
      } until ($have -or (Get-Date) -gt $deadline)
      if (-not $have) {
          throw 'No RID pool yet. The RID master has to know this domain controller and be reachable from it: check replication to it (repadmin /replsummary) and dcdiag /test:RidManager /v here.'
      }
  changed_when: false

- name: Run the domain controller health checks
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      # /q prints failures only.
      @(dcdiag /q /test:Advertising /test:Replications /test:RidManager /test:NetLogons /test:Services /test:SysVolCheck 2>&1 |
          ForEach-Object { "$_".Trim() } | Where-Object { $_ })
  register: windows_dc_health
  changed_when: false
  failed_when: windows_dc_health.output | length > 0

# Keycloak binds to the domain controllers over LDAPS, which needs the
# certificate a domain controller autoenrols from the domain's CA. Left alone
# that happens some time in the next eight hours.
- name: Enrol the domain controller certificates now
  ansible.windows.win_powershell:
    parameters:
      TimeoutSeconds: "{{ windows_dc_ldaps_timeout | int }}"
    script: |
      param([int]$TimeoutSeconds)
      $Ansible.Changed = $false
      function Get-ServerCertificate {
          # 1.3.6.1.5.5.7.3.1 is Server Authentication.
          Get-ChildItem Cert:\LocalMachine\My | Where-Object {
              $_.HasPrivateKey -and $_.NotAfter -gt (Get-Date) -and
              ($_.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.1')
          } | Sort-Object NotAfter -Descending | Select-Object -First 1
      }
      $certificate = Get-ServerCertificate
      if (-not $certificate) {
          gpupdate.exe /target:computer /force | Out-Null
          $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
          do {
              certutil.exe -pulse | Out-Null
              Start-Sleep -Seconds 20
              $certificate = Get-ServerCertificate
          } until ($certificate -or (Get-Date) -gt $deadline)
          $Ansible.Changed = [bool]$certificate
      }
      if (-not $certificate) {
          throw 'No server certificate was enrolled. See "certificate autoenrollment and machine-wide DCOM" in docs/windows-domain.md, and the CertificateServicesClient-AutoEnrollment events in the Application log here.'
      }
      [pscustomobject]@{
          subject = $certificate.Subject
          issuer  = $certificate.Issuer
          expires = $certificate.NotAfter.ToString('yyyy-MM-dd')
      }
  register: windows_dc_certificate
  when: windows_dc_require_ldaps | bool

- name: Wait for LDAPS to answer with it
  ansible.windows.win_powershell:
    parameters:
      TimeoutSeconds: "{{ windows_dc_ldaps_timeout | int }}"
    script: |
      param([int]$TimeoutSeconds)
      $Ansible.Changed = $false
      $name = "$env:COMPUTERNAME.$env:USERDNSDOMAIN".ToLower()
      $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
      do {
          $presented = $null; $tcp = $null
          try {
              $tcp = New-Object Net.Sockets.TcpClient($name, 636)
              # The chain is not judged here; only that the directory
              # presents a certificate at all.
              $ssl = New-Object Net.Security.SslStream($tcp.GetStream(), $false, { $true })
              $ssl.AuthenticateAsClient($name)
              # Not the subject: a domain controller certificate has an empty
              # one and carries its names in the alternative-name extension.
              if ($ssl.IsAuthenticated) {
                  $presented = [System.Security.Cryptography.X509Certificates.X509Certificate2]$ssl.RemoteCertificate
              }
          } catch { } finally { if ($tcp) { $tcp.Close() } }
          if (-not $presented) { Start-Sleep -Seconds 15 }
      } until ($presented -or (Get-Date) -gt $deadline)
      if (-not $presented) { throw "LDAPS on ${name}:636 did not complete a TLS handshake." }
      [pscustomobject]@{
          issuer     = $presented.Issuer
          thumbprint = $presented.Thumbprint
          expires    = $presented.NotAfter.ToString('yyyy-MM-dd')
      }
  register: windows_dc_ldaps
  changed_when: false
  when: windows_dc_require_ldaps | bool

- name: Close the pre-domain WinRM opening left by the template
  community.windows.win_firewall_rule:
    name: WinRM bootstrap
    state: absent

- name: Report the result
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} is a domain controller in site
      {{ windows_dc_ready.output[0].site }}, global catalog
      {{ windows_dc_ready.output[0].global_catalog }}.
      {% if windows_dc_require_ldaps | bool %}LDAPS answers with a certificate
      from {{ windows_dc_ldaps.output[0].issuer }} that expires
      {{ windows_dc_ldaps.output[0].expires }}.{% endif %}
