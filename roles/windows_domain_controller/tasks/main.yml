---
- name: Install the directory, DNS and management features
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - DNS
      - GPMC
      - RSAT-AD-Tools
      - RSAT-DNS-Server
    state: present
    include_management_tools: true
  register: windows_dc_features

- name: Restart if the features asked for it
  ansible.windows.win_reboot:
    reboot_timeout: 900
  when: windows_dc_features.reboot_required

- name: Find out if the server is a domain controller
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      # 4 and 5 are backup and primary domain controller.
      (Get-CimInstance Win32_ComputerSystem).DomainRole -ge 4
  register: windows_dc_state
  changed_when: false

- name: Stop if there is no restore-mode password
  ansible.builtin.assert:
    that: windows_dsrm_password | length >= 12
    fail_msg: >-
      Promotion needs a Directory Services Restore Mode password of at least
      12 characters. Put it in the vault as vault_windows_dsrm_password.
  when: not windows_dc_state.output[0]

- name: Promote to an additional domain controller
  ansible.windows.win_powershell:
    parameters:
      Domain: "{{ windows_domain }}"
      Site: "{{ windows_dc_site }}"
    sensitive_parameters:
      - name: SafeModePassword
        value: "{{ windows_dsrm_password }}"
    script: |
      param([string]$Domain, [string]$Site, [securestring]$SafeModePassword)
      $ErrorActionPreference = 'Stop'
      Import-Module ADDSDeployment
      Install-ADDSDomainController -DomainName $Domain -SiteName $Site `
          -InstallDns:$true -NoGlobalCatalog:$false -CreateDnsDelegation:$false `
          -SafeModeAdministratorPassword $SafeModePassword `
          -NoRebootOnCompletion:$true -Force:$true -WarningAction SilentlyContinue | Out-Null
      $Ansible.Changed = $true
  when: not windows_dc_state.output[0]
  register: windows_dc_promote

- name: Restart as a domain controller
  ansible.windows.win_reboot:
    reboot_timeout: 1800
    post_reboot_delay: 60
  when: windows_dc_promote is changed

- name: Wait for the directory and SYSVOL to be served
  ansible.windows.win_powershell:
    parameters:
      TimeoutSeconds: "{{ windows_dc_ready_timeout | int }}"
    script: |
      param([int]$TimeoutSeconds)
      $Ansible.Changed = $false
      $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
      do {
          $ready = $false
          try {
              Import-Module ActiveDirectory -ErrorAction Stop
              $dc = Get-ADDomainController -Identity $env:COMPUTERNAME -ErrorAction Stop
              $shares = @(Get-SmbShare -Name SYSVOL, NETLOGON -ErrorAction Stop)
              $ready = $dc -and $shares.Count -eq 2
          } catch { }
          if (-not $ready) { Start-Sleep -Seconds 20 }
      } until ($ready -or (Get-Date) -gt $deadline)
      if (-not $ready) { throw 'The directory or SYSVOL was not being served when the wait ran out.' }
      [pscustomobject]@{ site = $dc.Site; global_catalog = $dc.IsGlobalCatalog }
  register: windows_dc_ready
  changed_when: false

- name: Set the DNS forwarders and the resolvers
  ansible.builtin.import_tasks: settings.yml

# The other site's domain controller, which holds the RID master role, does
# not know this one exists until the next scheduled replication. Until it
# does, this one has no RID pool and cannot create users, groups or computers.

# What follows promotion is in finish.yml: see there for why it is separate.
