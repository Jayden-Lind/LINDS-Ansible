---
# The settings of a domain controller that exists. playbooks/windows.yml
# applies them to each domain controller in windows_managed.

- name: Set the DNS server's forwarders
  ansible.windows.win_powershell:
    parameters:
      Forwarders: "{{ windows_dc_dns_forwarders }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string[]]$Forwarders)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $have = @((Get-DnsServerForwarder).IPAddress | ForEach-Object { $_.IPAddressToString })
      if (Compare-Object $have $Forwarders -SyncWindow 0) {
          if (-not $Ansible.CheckMode) { Set-DnsServerForwarder -IPAddress $Forwarders }
          $Ansible.Changed = $true
      }

# win_dns_client compares this value with its list. It sets the list with
# Set-DnsClientServerAddress, which has no IPv6 to change on an adapter without
# IPv6, so an old value can show as a change on every run.
- name: Remove the IPv6 resolvers of a server without IPv6
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param()
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      foreach ($key in Get-ChildItem -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters\Interfaces') {
          $resolvers = $key.GetValue('NameServer')
          if ($resolvers) {
              if (-not $Ansible.CheckMode) { $key | Remove-ItemProperty -Name NameServer }
              $Ansible.Changed = $true
              "$($key.PSChildName): remove $resolvers"
          }
      }
  when: not (windows_baseline_ipv6 | default(true) | bool)

- name: Set the resolvers of the server, a partner first and then itself
  ansible.windows.win_dns_client:
    adapter_names: "*"
    dns_servers: "{{ windows_dc_dns_client_servers }}"

# A zone transfer setting belongs to each DNS server, even for an AD-integrated
# zone: it does not replicate, and a new domain controller starts with
# NoTransfer.
- name: Set who may transfer each zone from this DNS server
  ansible.windows.win_powershell:
    parameters:
      Transfers: "{{ windows_dc_dns_zone_transfers | to_json }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$Transfers)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $items = $Transfers | ConvertFrom-Json
      foreach ($t in $items) {
          $zone = Get-DnsServerZone -Name $t.zone
          if ("$($zone.SecureSecondaries)" -ne $t.secure_secondaries) {
              if (-not $Ansible.CheckMode) { Set-DnsServerPrimaryZone -Name $t.zone -SecureSecondaries $t.secure_secondaries }
              $Ansible.Changed = $true
              "$($t.zone): $($zone.SecureSecondaries) -> $($t.secure_secondaries)"
          }
      }
  when: windows_dc_dns_zone_transfers | length > 0
