---
# Runs on the machine that is joining, over the bootstrap connection.
# Needs windows_domain_join_blob from provision.yml.

- name: Join the domain with the offline-join data, and restart
  microsoft.ad.membership:
    offline_join_blob: "{{ windows_domain_join_blob }}"
    state: domain
    reboot: true
    reboot_timeout: 900
  no_log: true

- name: Confirm the machine is a member of the domain
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $cs = Get-CimInstance Win32_ComputerSystem
      [pscustomobject]@{ part_of_domain = [bool]$cs.PartOfDomain; domain = $cs.Domain }
  register: windows_domain_join_result
  failed_when: >-
    not windows_domain_join_result.output[0].part_of_domain
    or windows_domain_join_result.output[0].domain | lower != windows_domain | lower
  changed_when: false
