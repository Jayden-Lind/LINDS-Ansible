---
# The DNS name of the new domain. There is no default.
windows_forest_domain: ""
windows_forest_netbios: "{{ windows_forest_domain.split('.')[0] | upper }}"

# The Directory Services Restore Mode password, from the vault.
windows_dsrm_password: "{{ vault_windows_dsrm_password | default('') }}"

windows_forest_dns_forwarders: "{{ windows_dc_dns_forwarders | default([]) }}"
