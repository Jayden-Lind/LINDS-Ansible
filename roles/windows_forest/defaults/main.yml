---
# Creates a new forest on a freshly built server: the first domain controller
# of a domain that does not exist yet.
#
# For a lab, and for the day the domain has to be rebuilt from nothing. It is
# not how a server joins linds.com.au: that is windows_domain_join and
# windows_domain_controller.
#
# It refuses to run if a domain of that name already answers in DNS from
# where the server stands. Two forests of one name cannot be told apart by
# the machines that would join them.

# The DNS name of the new domain. No default, on purpose.
windows_forest_domain: ""
windows_forest_netbios: "{{ windows_forest_domain.split('.')[0] | upper }}"

# Same password source as an additional domain controller.
windows_dsrm_password: "{{ lookup('ansible.builtin.env', 'WINDOWS_DSRM_PASSWORD') | default(vault_windows_dsrm_password | default(''), true) }}"

windows_forest_dns_forwarders: "{{ windows_dc_dns_forwarders | default([]) }}"
