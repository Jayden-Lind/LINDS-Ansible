---
- name: Check what this server is and what it holds
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $isDc = (Get-CimInstance Win32_ComputerSystem).DomainRole -ge 4
      $roles = @(); $others = 0
      # A member server has no ActiveDirectory module, and needs none here.
      if ($isDc) {
          Import-Module ActiveDirectory
          $me = Get-ADDomainController -Identity $env:COMPUTERNAME
          $roles = @($me.OperationMasterRoles | ForEach-Object { "$_" })
          $others = @(Get-ADDomainController -Filter * | Where-Object Name -ne $env:COMPUTERNAME).Count
      }
      $caRole = [bool](Get-WindowsFeature ADCS-Cert-Authority).Installed
      $caConfigured = [bool](Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\CertSvc\Configuration' -ErrorAction SilentlyContinue).Active
      [pscustomobject]@{ is_domain_controller = $isDc; fsmo_roles = $roles; other_domain_controllers = $others
                         ca_role_installed = $caRole; ca_configured = $caConfigured }
  register: windows_dc_retire_state
  changed_when: false

- name: Refuse to demote a role holder or the last domain controller
  ansible.builtin.assert:
    that:
      - windows_dc_retire_state.output[0].fsmo_roles | length == 0
      - windows_dc_retire_state.output[0].other_domain_controllers >= 1
    fail_msg: >-
      {{ inventory_hostname }} holds FSMO roles
      ({{ windows_dc_retire_state.output[0].fsmo_roles | join(', ') }}) or is the
      only domain controller. Move the roles first (windows_ad_recovery).
  when: windows_dc_retire_state.output[0].is_domain_controller

# An installed Certification Authority role blocks a demotion ("Certificate
# Server is installed"), also when no CA was ever set up. A CA in windows_ca
# was removed by the playbook before this, with its backup. A configured CA
# that the inventory does not know is not removed here.
- name: Stop if the server has a CA that the inventory does not know
  ansible.builtin.assert:
    that: not windows_dc_retire_state.output[0].ca_configured or inventory_hostname in groups['windows_ca'] | default([])
    fail_msg: >-
      {{ inventory_hostname }} has a configured certification authority, and it
      is not in windows_ca. Back it up and remove it by hand first.
  when: windows_dc_retire_state.output[0].is_domain_controller

- name: Remove a Certification Authority role that has no CA
  ansible.windows.win_feature:
    name: [ADCS-Web-Enrollment, ADCS-Enroll-Web-Svc, ADCS-Cert-Authority]
    state: absent
  register: windows_dc_retire_ca_role
  when:
    - windows_dc_retire_state.output[0].is_domain_controller
    - windows_dc_retire_state.output[0].ca_role_installed
    - not windows_dc_retire_state.output[0].ca_configured

- name: Restart if the removal needs it
  ansible.windows.win_reboot:
    reboot_timeout: 1200
  when: windows_dc_retire_ca_role.reboot_required | default(false)

# Between the demotion and its restart the server belongs to nothing: the
# directory is gone and it is not yet a member, so it refuses every new logon
# ("Access is denied"), including the one a separate restart task would need.
# The restart is therefore queued from inside the session that demotes.
- name: Demote the domain controller and restart it
  ansible.windows.win_powershell:
    sensitive_parameters:
      - name: LocalPassword
        value: "{{ windows_dc_retire_local_password }}"
    script: |
      param([securestring]$LocalPassword)
      $ErrorActionPreference = 'Stop'
      Import-Module ADDSDeployment
      Uninstall-ADDSDomainController -LocalAdministratorPassword $LocalPassword `
          -NoRebootOnCompletion:$true -Force:$true -WarningAction SilentlyContinue | Out-Null
      # Detached and delayed, so this task returns before the connection goes.
      Start-Process -FilePath shutdown.exe -ArgumentList '/r', '/t', '10', '/c', '"Demoted: restarting as a member server"'
      $Ansible.Changed = $true
  when: windows_dc_retire_state.output[0].is_domain_controller
  register: windows_dc_retire_demote

- name: Wait for it to come back as a member server
  ansible.builtin.wait_for_connection:
    delay: 90
    connect_timeout: 10
    sleep: 15
    timeout: 1800
  when: windows_dc_retire_demote is changed

- name: Confirm it is no longer a domain controller
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      (Get-CimInstance Win32_ComputerSystem).DomainRole
  register: windows_dc_retire_role
  failed_when: windows_dc_retire_role.output[0] >= 4
  changed_when: false

- name: Stop the retired server
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $true
      # Detached and delayed, so this task returns before the connection goes.
      Start-Process -FilePath shutdown.exe -ArgumentList '/s', '/t', '20', '/c', '"Retired: replaced by a rebuilt server"'
  when: windows_dc_retire_shutdown | bool
