---
# Runs on a domain controller that is staying, in the same site as the one
# being retired, before the demotion.
#
# Replication between two sites goes through one domain controller at each
# end, chosen by the topology generator. If that is the server being retired,
# the other site loses its only partner the moment it is demoted, cannot hear
# that it was demoted, and by default waits two hours before trying another.
# Everything after the demotion needs the sites to agree within minutes.
#
# So the surviving domain controller is made the site's preferred bridgehead,
# the topology is recalculated everywhere, and nothing goes on until
# replication has been seen to work through it in both directions.
# bridgehead-release.yml takes the preference away again afterwards.

- name: Move replication between the sites onto this domain controller
  ansible.windows.win_powershell:
    parameters:
      Retiring: "{{ windows_dc_retire_machine }}"
      TimeoutSeconds: "{{ windows_dc_retire_bridgehead_timeout | int }}"
    script: "{{ lookup('ansible.builtin.file', 'bridgehead.ps1') }}"
  register: windows_dc_retire_bridgehead

- name: Show where replication between the sites runs now
  ansible.builtin.debug:
    msg: "{{ windows_dc_retire_bridgehead.output | default([]) }}"
