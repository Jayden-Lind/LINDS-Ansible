---
# The DFS Replication group of the file servers. Set the values in the
# inventory. With an empty dfsr_group the role changes nothing.

# The name of the replication group.
dfsr_group: ""

# The replicated folders. Each is a folder with this name in the root of the
# data volume of each member.
dfsr_folders: []

# For a new folder whose data is on one member only: that member. The role makes
# it the primary member when it gives the folder its first content path, and
# never again. The folder must not exist on the other members.
dfsr_initial_primary: {}

# The members, and the root of the data volume on each: {COMPUTER: "D:"}.
dfsr_members: {}

# The connections: [{source: A, destination: B}, ...]. Give both directions
# for two-way replication.
dfsr_connections: []

# The staging quota of a folder, in MB. Microsoft recommends at least the total
# size of the 32 largest files in the folder.
dfsr_staging_quota_mb: 4096

# Folders that need a different staging quota: {folder: MB}.
dfsr_staging_quota_overrides_mb: {}

# The Conflict and Deleted quota, in MB. The role only increases it, because a
# decrease deletes the oldest entries immediately.
dfsr_conflict_quota_mb: 4096

# Remote Differential Compression: send only the changed parts of a file.
dfsr_rdc_enabled: true
