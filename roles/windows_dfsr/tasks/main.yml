---
# Declares the NAS replication group: group, folders, members, content paths,
# quotas and connections.
#
# PrimaryMember is deliberately not declared. It is a one-shot initial-sync
# flag that DFSR clears itself once a member has built its database; asserting
# it here would re-arm an initial sync on every run. The one exception is
# dfsr_initial_primary: a new folder's member that holds the data is made
# primary at the moment its membership gets its first content path.

- name: Stop here if no replication group is set
  ansible.builtin.meta: end_role
  when: not dfsr_group

# The DFSR PowerShell module. A domain controller built from the template does
# not have it.
- name: Install the replication management tools
  ansible.windows.win_feature:
    name: RSAT-DFS-Mgmt-Con
    state: present

- name: Make the replication group
  ansible.windows.win_powershell:
    parameters:
      Group: "{{ dfsr_group }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$Group)
      $ErrorActionPreference = 'Stop'
      Import-Module DFSR
      $Ansible.Changed = $false

      if (-not (Get-DfsReplicationGroup -GroupName $Group -ErrorAction SilentlyContinue)) {
          if (-not $Ansible.CheckMode) { New-DfsReplicationGroup -GroupName $Group | Out-Null }
          "made the replication group $Group"
          $Ansible.Changed = $true
      }

- name: Make the replicated folders
  ansible.windows.win_powershell:
    parameters:
      Group: "{{ dfsr_group }}"
      Folders: "{{ dfsr_folders }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$Group, [string[]]$Folders)
      $ErrorActionPreference = 'Stop'
      Import-Module DFSR
      $Ansible.Changed = $false

      $existing = @(Get-DfsReplicatedFolder -GroupName $Group -ErrorAction SilentlyContinue |
                    ForEach-Object { $_.FolderName })
      foreach ($f in $Folders) {
          if ($existing -notcontains $f) {
              if (-not $Ansible.CheckMode) { New-DfsReplicatedFolder -GroupName $Group -FolderName $f | Out-Null }
              "created folder $f"
              $Ansible.Changed = $true
          }
      }

- name: Add the members
  ansible.windows.win_powershell:
    parameters:
      Group: "{{ dfsr_group }}"
      Members: "{{ dfsr_members.keys() | list }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$Group, [string[]]$Members)
      $ErrorActionPreference = 'Stop'
      Import-Module DFSR
      $Ansible.Changed = $false

      $existing = @(Get-DfsrMember -GroupName $Group -ErrorAction SilentlyContinue |
                    ForEach-Object { $_.ComputerName })
      foreach ($m in $Members) {
          if ($existing -notcontains $m) {
              if (-not $Ansible.CheckMode) { Add-DfsrMember -GroupName $Group -ComputerName $m | Out-Null }
              "added member $m"
              $Ansible.Changed = $true
          }
      }

- name: Set the content paths and the quotas
  ansible.windows.win_powershell:
    parameters:
      Group: "{{ dfsr_group }}"
      Folders: "{{ dfsr_folders }}"
      MemberRoots: "{{ dfsr_members }}"
      StagingQuota: "{{ dfsr_staging_quota_mb | int }}"
      StagingOverrides: "{{ dfsr_staging_quota_overrides_mb }}"
      ConflictQuota: "{{ dfsr_conflict_quota_mb | int }}"
      InitialPrimary: "{{ dfsr_initial_primary | default({}) }}"
    script: "{{ lookup('ansible.builtin.file', 'memberships.ps1') }}"

- name: Make and enable the connections
  ansible.windows.win_powershell:
    parameters:
      Group: "{{ dfsr_group }}"
      Connections: "{{ dfsr_connections }}"
      Rdc: "{{ dfsr_rdc_enabled | bool }}"
    script: "{{ lookup('ansible.builtin.file', 'connections.ps1') }}"
