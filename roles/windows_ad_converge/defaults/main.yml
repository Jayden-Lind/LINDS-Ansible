---
# A computer to wait for, and the state to wait for: present (every domain
# controller has the same object) or absent (no domain controller has it).
# Empty: replicate, and do not wait for a computer.
windows_ad_converge_computer: ""
windows_ad_converge_state: present

# The maximum time to replicate and check again, in seconds.
windows_ad_converge_timeout: 900
