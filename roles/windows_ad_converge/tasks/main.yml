---
- name: Replicate between all domain controllers until they agree
  ansible.windows.win_powershell:
    parameters:
      Computer: "{{ windows_ad_converge_computer }}"
      State: "{{ windows_ad_converge_state }}"
      TimeoutSeconds: "{{ windows_ad_converge_timeout | int }}"
    script: "{{ lookup('ansible.builtin.file', 'converge.ps1') }}"
  register: windows_ad_converge_result
  changed_when: false

- name: Show the replication problems that did not stop the agreement
  ansible.builtin.debug:
    msg: "{{ windows_ad_converge_result.output[0].problems }}"
  when: windows_ad_converge_result.output[0].problems | length > 0
