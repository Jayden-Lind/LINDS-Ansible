---
- name: Install Java and the tools
  ansible.builtin.dnf:
    name:
      - screen
      - java-latest-openjdk
      - nfs-utils
      - net-tools
      - wget
    state: present

- name: Start the server at boot
  ansible.builtin.cron:
    name: Minecraft server
    special_time: reboot
    job: screen -d -m bash -c 'cd /root/LINDS/ && /root/LINDS/script.sh'

- name: Set huge pages for the Minecraft server
  ansible.posix.sysctl:
    name: vm.nr_hugepages
    value: "12288"
    state: present

- name: Make the mount folder
  ansible.builtin.file:
    path: /mnt/NAS
    state: directory
    owner: root
    group: root
    mode: "0555"

- name: Mount the NAS
  ansible.posix.mount:
    path: /mnt/NAS
    src: jd-truenas-01.linds.com.au:/mnt/NAS
    fstype: nfs4
    opts: vers=4.2
    state: mounted
    boot: true

# Copy into /mnt/NAS/minecraft, so that the folder is /mnt/NAS/minecraft/LINDS
# every time and not LINDS/LINDS after the first copy.
- name: Copy the server to the NAS every night
  ansible.builtin.cron:
    name: Minecraft server copy
    hour: 23
    minute: 0
    job: mkdir -p /mnt/NAS/minecraft && cp -pr /root/LINDS /mnt/NAS/minecraft/
