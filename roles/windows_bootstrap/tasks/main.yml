---
# A new clone of the template has a random name and a DHCP address. This
# role gives it its name and its static address.
#
# A new address stops the WinRM connection, and a new name needs a restart.
# Thus the server gets a script that makes both changes 20 seconds later and
# then restarts. The next play waits for the server at its new address
# (playbooks/windows-join.yml).

# The template opens WinRM to this network only when Windows setup has
# finished, so there is nothing to answer, and nothing to lock out, before
# the clone is ready.
- name: Wait for the clone to answer on its bootstrap address
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    sleep: 10
    timeout: 900

- name: Give the server its name and address in 20 seconds
  ansible.windows.win_powershell:
    parameters:
      Hostname: "{{ windows_hostname }}"
      Address: "{{ windows_ipv4_address }}"
      Prefix: "{{ windows_ipv4_prefix | int }}"
      Gateway: "{{ windows_ipv4_gateway }}"
      Dns: "{{ windows_dns_servers }}"
    script: "{{ lookup('ansible.builtin.file', 'identity.ps1') }}"
  register: windows_bootstrap_identity
