---
# Runs on one domain controller. The sites are forest-wide, and the domain
# controllers replicate them.

- name: Make the AD sites
  microsoft.ad.site:
    name: "{{ item }}"
    state: present
  loop: "{{ ad_sites }}"

- name: Move each domain controller to its site
  ansible.windows.win_powershell:
    parameters:
      Placement: "{{ dict(groups['windows_dc'] | map('extract', hostvars, 'ansible_host') | zip(groups['windows_dc'] | map('extract', hostvars, 'ad_site'))) }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([hashtable]$Placement)
      Import-Module ActiveDirectory
      $Ansible.Changed = $false
      foreach ($dc in Get-ADDomainController -Filter *) {
        $want = $Placement[$dc.IPv4Address]
        if ($want -and $dc.Site -ne $want) {
          if (-not $Ansible.CheckMode) { Move-ADDirectoryServer -Identity $dc.Name -Site $want -Confirm:$false }
          $Ansible.Changed = $true
          "move $($dc.Name) to $want"
        }
      }

- name: Make the subnets and give each its site
  microsoft.ad.site_subnet:
    name: "{{ item.name }}"
    site: "{{ item.site }}"
    description: "{{ item.description | default(omit) }}"
    state: present
  loop: "{{ ad_subnets }}"
  loop_control:
    label: "{{ item.name }} {{ item.site }}"

# The site link contains exactly the sites in the list.
- name: Set the sites, the cost and the interval of the site link
  microsoft.ad.site_link:
    name: "{{ ad_site_link.name }}"
    sites_included: "{{ ad_site_link.sites }}"
    cost: "{{ ad_site_link.cost }}"
    replication_frequency: "{{ ad_site_link.replication_frequency_minutes }}"
    state: present
  when: ad_site_link.name is defined

# Promoting the forest's first domain controller creates this delegation and
# names only that server in it. Retiring a domain controller removes every NS
# record that points at it, this one included, and nothing puts it back: a
# DNS server re-registers itself at the top of each zone it holds, not in a
# delegation. Every DNS server here holds both zones, so no lookup goes
# through the delegation today; it is what a server holding the parent zone
# alone would follow.

- name: Add every domain controller to the _msdcs delegation
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param()
      Import-Module ActiveDirectory, DnsServer
      $Ansible.Changed = $false
      $forest = (Get-ADForest).RootDomain
      # Where _msdcs is a plain subdomain of the forest zone there is nothing
      # to delegate.
      if (-not (Get-DnsServerZone -Name "_msdcs.$forest" -ErrorAction SilentlyContinue)) { return }
      $have = @(Get-DnsServerZoneDelegation -Name $forest -ChildZoneName '_msdcs' -ErrorAction SilentlyContinue |
                ForEach-Object { $_.NameServer.RecordData.NameServer.TrimEnd('.') })
      foreach ($dc in Get-ADDomainController -Filter *) {
        if ($have -notcontains $dc.HostName) {
          if (-not $Ansible.CheckMode) {
            Add-DnsServerZoneDelegation -Name $forest -ChildZoneName '_msdcs' `
              -NameServer $dc.HostName -IPAddress $dc.IPv4Address
          }
          $Ansible.Changed = $true
          "add $($dc.HostName) to the _msdcs delegation"
        }
      }
