---
# Read the certificate the device serves now and check it is the one just
# vended, by its SHA-256 fingerprint. Checking the issuer alone is not enough:
# on a renewal the old certificate has the same issuer and name, and a device
# can keep serving it for a while after the install. Runs from the control node
# against the device's TLS port, and waits, because a device can take some
# seconds to restart its web server.

- name: Work out the fingerprint of the new certificate
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ cluster_cert_tmp.path }}/tls.crt", -noout, -fingerprint, -sha256]
  delegate_to: localhost
  register: cluster_cert_new_fingerprint
  changed_when: false

- name: Read the served certificate until it is the new one
  ansible.builtin.command:
    argv:
      - "{{ role_path }}/files/read-served.sh"
      - "{{ cluster_cert_endpoint_host }}:{{ cluster_cert_endpoint_port }}"
      - "{{ cluster_cert_common_name }}"
  delegate_to: localhost
  register: cluster_cert_served
  changed_when: false
  retries: "{{ cluster_cert_verify_retries }}"
  delay: 3
  until:
    - cluster_cert_served.rc == 0
    - cluster_cert_new_fingerprint.stdout | trim in cluster_cert_served.stdout

- name: Show what the device now serves
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: now serving {{ cluster_cert_served.stdout_lines | join(' | ') }}"
