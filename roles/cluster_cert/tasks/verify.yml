---
# Read the certificate the device serves now and check it is the vended one:
# issued by linds-CA and carrying the common name. Runs from the control node
# against the device's TLS port, and waits, because some devices swap the
# certificate a few seconds after they are told to.

- name: Read the served certificate until it is the new one
  ansible.builtin.command:
    argv:
      - "{{ role_path }}/files/read-served.sh"
      - "{{ cluster_cert_endpoint_host }}:{{ cluster_cert_endpoint_port }}"
      - "{{ cluster_cert_common_name }}"
  delegate_to: localhost
  register: cluster_cert_served
  changed_when: false
  retries: 10
  delay: 3
  until:
    - cluster_cert_served.rc == 0
    - "'linds-CA' in cluster_cert_served.stdout"
    - cluster_cert_common_name in cluster_cert_served.stdout

- name: Show what the device now serves
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: now serving {{ cluster_cert_served.stdout_lines | join(' | ') }}"
