---
# The baseline of every Windows server. See README.md.

# Turn on Windows Firewall for these profiles. The role does not change rules.
windows_baseline_firewall_profiles:
  - Domain
  - Private
  - Public

# Turn on Microsoft Defender real-time protection. Defender excludes the files
# of AD DS, DNS and DFS Replication by itself.
windows_baseline_defender_realtime: true

# Stop the Print Spooler. These servers share no printers, and on a domain
# controller the spooler is a known attack path.
windows_baseline_disable_spooler: true

# Services that these servers do not use. The role stops each one and sets
# it to Disabled. A name that the server does not have is skipped. A service
# comes before the services that it needs (Audiosrv needs
# AudioEndpointBuilder). The GPO `Server - Baseline` has the same list
# (inventory/group_vars/windows/gpo.yml).
windows_baseline_services_disabled:
  # Microsoft: "OK to disable" on a server with Desktop Experience.
  - Audiosrv             # Windows Audio: a VM has no sound device
  - AudioEndpointBuilder # Windows Audio Endpoint Builder
  - PcaSvc               # Program Compatibility Assistant
  - RmSvc                # Radio Management: no Wi-Fi, no Bluetooth
  - ShellHWDetection     # AutoPlay for removable media
  - WpnService           # push notifications of Store apps
  - lfsvc                # Geolocation
  # Not in the guidance of Microsoft. Each has no work on these servers.
  - DiagTrack            # telemetry to Microsoft (Connected User Experiences)
  - SysMain              # preloads programs into memory (Superfetch)
  - DPS                  # Diagnostic Policy: the troubleshooting wizards
  - TrkWks               # Distributed Link Tracking: repairs shortcuts
  - BalloonService       # VirtIO balloon: the VMs have no balloon device
  - UALSVC               # User Access Logging: counts clients for licences

# Windows features that these servers do not use. The role removes them. A
# removal is complete after the next restart of the server.
windows_baseline_features_absent:
  - Wireless-Networking # Wireless LAN Service: a VM has no Wi-Fi adapter
  - XPS-Viewer          # a viewer for XPS documents

# LLMNR and mDNS: a computer asks all computers on its network for a name,
# and any of them can answer. true keeps the Windows default (both on). false
# turns both off: the servers find names with DNS only. The change to mDNS
# takes effect at the next restart.
windows_baseline_multicast_names: true

# The maximum size of each event log. The Security log must keep more than
# one day.
windows_baseline_event_logs:
  Security: 1GB
  System: 256MB
  Application: 256MB

# Allow Remote Desktop, with Network Level Authentication.
windows_baseline_rdp: true

# The Windows mitigations for Spectre variant 2 and Meltdown. true keeps the
# Windows default. false turns them off, and with them the MDS buffer clearing
# on an Intel host. The change takes effect at the next restart.
windows_baseline_cpu_mitigations: true

# IPv6. true keeps the Windows default. false turns it off on each network
# adapter now, and on the server at the next restart. The loopback address ::1
# stays.
windows_baseline_ipv6: true

# The offloads of the VirtIO network adapter, at the driver defaults: large
# send (LSO) and receive segment coalescing (RSC) on. With them off, the server
# sends and receives 1500-byte packets only. A change restarts the adapter, and
# the network stops for about 3 seconds. {} leaves the adapter as it is.
windows_baseline_nic_offloads:
  "*LsoV2IPv4": "1"
  "*LsoV2IPv6": "1"
  OffLoad.TxLSO: "2"
  "*RscIPv4": "1"
  "*RscIPv6": "1"

# Install Windows updates. This can take one hour and restarts the server.
# windows/prepare.yml and windows/join.yml set it to true.
windows_baseline_updates: false
windows_baseline_update_categories:
  - SecurityUpdates
  - CriticalUpdates
  - UpdateRollups
  - DefinitionUpdates

# Updates that the role does not install. They report success and are offered
# again, so win_updates stops with a loop. Windows Update installs them.
windows_baseline_update_reject:
  - KB5007651 # Update for Windows Security platform
