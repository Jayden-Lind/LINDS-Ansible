---
# The baseline of every Windows server. See README.md.

# Turn on Windows Firewall for these profiles. The role does not change rules.
windows_baseline_firewall_profiles:
  - Domain
  - Private
  - Public

# Turn on Microsoft Defender real-time protection. Defender excludes the files
# of AD DS, DNS and DFS Replication by itself.
windows_baseline_defender_realtime: true

# Stop the Print Spooler. These servers share no printers, and on a domain
# controller the spooler is a known attack path.
windows_baseline_disable_spooler: true

# The maximum size of each event log. The Security log must keep more than
# one day.
windows_baseline_event_logs:
  Security: 1GB
  System: 256MB
  Application: 256MB

# Allow Remote Desktop, with Network Level Authentication.
windows_baseline_rdp: true

# The Windows mitigations for Spectre variant 2 and Meltdown. true keeps the
# Windows default. false turns them off, and with them the MDS buffer clearing
# on an Intel host. The change takes effect at the next restart.
windows_baseline_cpu_mitigations: true

# Install Windows updates. This can take one hour and restarts the server.
# windows-prepare.yml and windows-join.yml set it to true.
windows_baseline_updates: false
windows_baseline_update_categories:
  - SecurityUpdates
  - CriticalUpdates
  - UpdateRollups
  - DefinitionUpdates

# Updates that the role does not install. They report success and are offered
# again, so win_updates stops with a loop. Windows Update installs them.
windows_baseline_update_reject:
  - KB5007651 # Update for Windows Security platform
