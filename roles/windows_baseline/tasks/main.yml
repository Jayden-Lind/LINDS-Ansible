---
# Works the same over the bootstrap connection (local Administrator, before the
# domain) and over Kerberos afterwards.

- name: Turn Windows Firewall on for every profile
  ansible.windows.win_firewall:
    state: enabled
    profiles: "{{ windows_baseline_firewall_profiles }}"

# The policy value, the same as the GPO "Server - Baseline" sets. It wins over
# a setting made with Set-MpPreference.
- name: Turn Microsoft Defender real-time protection on
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection
    name: DisableRealtimeMonitoring
    data: 0
    type: dword
  when: windows_baseline_defender_realtime | bool

- name: Remove the SMB1 feature
  ansible.windows.win_feature:
    name: FS-SMB1
    state: absent
  register: windows_baseline_smb1

- name: Refuse SMB1 on the server side
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: SMB1
    data: 0
    type: dword

- name: Stop and disable the Print Spooler
  ansible.windows.win_service:
    name: Spooler
    state: stopped
    start_mode: disabled
  when: windows_baseline_disable_spooler | bool

- name: Set the sizes of the event logs
  ansible.windows.win_eventlog:
    name: "{{ item.key }}"
    maximum_size: "{{ item.value }}"
    overflow_action: OverwriteAsNeeded
    state: present
  loop: "{{ windows_baseline_event_logs | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value }}"

- name: Allow Remote Desktop
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword
  when: windows_baseline_rdp | bool

- name: Require Network Level Authentication for Remote Desktop
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
    name: UserAuthentication
    data: 1
    type: dword
  when: windows_baseline_rdp | bool

# The rule group "Remote Desktop". The firewall stores the group by this
# resource name, not by its display name.
- name: Open the Remote Desktop firewall rules
  community.windows.win_firewall_rule:
    group: "@FirewallAPI.dll,-28752"
    enabled: true
    state: present
  when: windows_baseline_rdp | bool

- name: Set Windows' CPU side-channel mitigations
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management
    name: "{{ item }}"
    data: 3
    type: dword
    state: "{{ 'absent' if windows_baseline_cpu_mitigations | bool else 'present' }}"
  loop: [FeatureSettingsOverride, FeatureSettingsOverrideMask]
  register: windows_baseline_mitigations
  tags: cpu-mitigations

- name: Say that the change needs a restart
  ansible.builtin.debug:
    msg: The change to the CPU mitigations takes effect when {{ inventory_hostname }} next restarts.
  when: windows_baseline_mitigations is changed
  tags: cpu-mitigations

# 255 turns off IPv6 on every interface except the loopback. It also covers a
# new network adapter, but it takes effect only at the next restart.
- name: Set IPv6 on the server
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
    name: DisabledComponents
    data: 255
    type: dword
    state: "{{ 'absent' if windows_baseline_ipv6 | bool else 'present' }}"
  register: windows_baseline_ipv6_server
  tags: ipv6

- name: Say that the IPv6 change needs a restart
  ansible.builtin.debug:
    msg: The change to IPv6 on the server takes effect when {{ inventory_hostname }} next restarts.
  when: windows_baseline_ipv6_server is changed
  tags: ipv6

# This removes the IPv6 addresses now, without a restart.
- name: Set IPv6 on the network adapters
  community.windows.win_net_adapter_feature:
    interface: "*"
    component_id: ms_tcpip6
    state: "{{ 'enabled' if windows_baseline_ipv6 | bool else 'disabled' }}"
  tags: ipv6

- name: Keep the offloads of the VirtIO network adapter on
  ansible.windows.win_powershell:
    parameters:
      Offloads: "{{ windows_baseline_nic_offloads | to_json }}"
    script: "{{ lookup('ansible.builtin.file', 'nic-offloads.ps1') }}"
  register: windows_baseline_nic
  when: windows_baseline_nic_offloads | length > 0
  tags: nic-offloads

- name: Wait for the server after the adapter restart
  ansible.builtin.wait_for_connection:
    delay: 30
    timeout: 300
  when:
    - windows_baseline_nic is changed
    - not ansible_check_mode
  tags: nic-offloads

- name: Install Windows updates
  ansible.windows.win_updates:
    category_names: "{{ windows_baseline_update_categories }}"
    reject_list: "{{ windows_baseline_update_reject }}"
    state: installed
    reboot: true
    reboot_timeout: 3600
  when: windows_baseline_updates | bool
  tags: updates
