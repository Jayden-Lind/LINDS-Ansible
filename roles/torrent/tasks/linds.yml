---
- name: Deploy qBittorrent configuration
  ansible.builtin.include_tasks: config.yml
  vars:
    torrent_config_src: qBittorrent_linds.conf

- name: Create nas directory
  ansible.builtin.file:
    path: /mnt/nas
    state: directory
    mode: "0755"

- name: Mount NFS NAS
  ansible.posix.mount:
    path: /mnt/nas
    src: "{{ nfs_server }}:{{ nfs_path }}"
    fstype: nfs4
    opts: vers=4.2,soft
    state: mounted
    boot: true
  register: mount

- name: Mount NAS if changed
  ansible.builtin.command: mount -a
  when: mount.changed
