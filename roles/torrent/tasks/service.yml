---
# qbittorrent-nox@root.service runs in the slice system-qbittorrent\x2dnox.slice.
# Do not stop that slice: it stops the service. Only an old unit
# qbittorrent.service, if it exists, is stopped and disabled.
- name: Read the services
  ansible.builtin.service_facts:

- name: Stop and disable the old qbittorrent unit
  become: true
  ansible.builtin.service:
    name: qbittorrent
    state: stopped
    enabled: false
  when: "'qbittorrent.service' in ansible_facts.services"

# A host that moved to an unprivileged torrent_user still has the root unit.
# It must not run beside the new one: both would take the same ports.
- name: Stop and disable the root unit
  become: true
  ansible.builtin.service:
    name: qbittorrent-nox@root.service
    state: stopped
    enabled: false
  when:
    - torrent_user != 'root'
    - "'qbittorrent-nox@root.service' in ansible_facts.services"

- name: Enable and start qBittorrent
  become: true
  ansible.builtin.service:
    name: "{{ torrent_service_name }}"
    state: started
    enabled: true
