---
# qbittorrent-nox@root.service runs in the slice system-qbittorrent\x2dnox.slice.
# Do not stop that slice: it stops the service. Only an old unit
# qbittorrent.service, if it exists, is stopped and disabled.
- name: Read the services
  ansible.builtin.service_facts:

- name: Stop and disable the old qbittorrent unit
  become: true
  ansible.builtin.service:
    name: qbittorrent
    state: stopped
    enabled: false
  when: "'qbittorrent.service' in ansible_facts.services"

- name: Enable and start qBittorrent
  become: true
  ansible.builtin.service:
    name: "{{ torrent_service_name }}"
    state: started
    enabled: true
