---
torrent_packages_debian:
  - qbittorrent-nox
  - cifs-utils
  - nfs-common

torrent_packages_redhat:
  - qbittorrent
  - qbittorrent-nox
  - cifs-utils
  - nfs-utils

# The account qBittorrent runs as. A torrent client takes whatever its peers
# send it, so it should not be root; root stays the default so that a host
# moves only when its group says so (inventory/torrent.yml). For another
# account the role makes a system user and moves the profile over from root
# once (tasks/user.yml).
torrent_user: root

# Holds the profile: ~/.config/qBittorrent and ~/.local/share/qBittorrent.
torrent_home: "{{ '/root' if torrent_user == 'root' else '/var/lib/' + torrent_user }}"

torrent_service_name: "qbittorrent-nox@{{ torrent_user }}.service"

torrent_config_dir: "{{ torrent_home }}/.config/qBittorrent"

# The categories, as in qBittorrent's categories.json: {name: {save_path}}.
# Empty: the role leaves the file alone.
torrent_categories: {}

torrent_sysctl_file: /etc/sysctl.d/99-torrent.conf

torrent_sunrpc_modprobe_file: /etc/modprobe.d/sunrpc.conf

# Initial NFS RPC slot count. The kernel default of 2 ramps too slowly for
# sustained torrent writes onto NFS.
torrent_sunrpc_slot_table_entries: "64"

torrent_sysctl_settings:
  net.core.rmem_max: "33554432"
  net.core.wmem_max: "33554432"
  net.core.rmem_default: "262144"
  net.core.wmem_default: "262144"

  net.core.netdev_max_backlog: "16384"
  net.core.somaxconn: "1024"

  net.ipv4.ip_local_port_range: "10240 65535"

  net.ipv4.tcp_fin_timeout: "15"

  net.ipv4.tcp_keepalive_time: "120"
  net.ipv4.tcp_keepalive_intvl: "30"
  net.ipv4.tcp_keepalive_probes: "5"

  net.ipv4.tcp_syncookies: "1"

  net.ipv4.tcp_mtu_probing: "1"

  vm.dirty_ratio: "15"
  vm.dirty_background_ratio: "5"
  vm.swappiness: "10"
