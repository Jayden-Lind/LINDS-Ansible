---
# The edition to convert an Evaluation installation to: ServerStandard or
# ServerDatacenter.
windows_edition_target: ServerStandard

# The product key. playbooks/windows-edition.yml asks for it. Do not put it in
# a file.
windows_product_key: ""

# true: let an Evaluation installation continue (for a test server only).
windows_edition_allow_evaluation: false
