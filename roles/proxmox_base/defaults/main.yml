---
# Base settings for the Proxmox hosts at both sites. README.md says what each
# part does. If a host needs a different value, set it in
# inventory/host_vars/<host>/proxmox_base.yml.

# The rsyslog line that sends all logs to Alloy in the cluster: UDP port 1514,
# RFC 5424 format. It is the same line as common_rsyslog_remote_line in the
# role common. If the value is empty, the role does not write the file.
proxmox_base_rsyslog_remote_line: "*.* @(o)172.16.1.23:1514;RSYSLOG_SyslogProtocol23Format"

# If false, the role stops and disables rpcbind. A host that exports or mounts
# NFS needs rpcbind, so the default is true.
proxmox_base_rpcbind_enabled: true

# The CPU frequency governor that cpu-governor.service sets at boot, for
# example "schedutil". If the value is empty, the role does not install the
# unit.
proxmox_base_cpu_governor: ""

# The interfaces that nic-ring-tuning@.service gives larger ring buffers at
# boot, and the number of receive and transmit descriptors. If the list is
# empty, the role does not install the unit.
proxmox_base_nic_ring_interfaces: []
proxmox_base_nic_ring_size: 4096

# If false, the role stops and disables ksmtuned, stops KSM and splits the
# shared pages. Then the VMs keep their 2 MiB pages. Set it to false only on a
# host that has more free memory than KSM saves.
proxmox_base_ksm_enabled: true

# The kernel settings that the role writes to
# /etc/sysctl.d/90-proxmox-base.conf, as name and value. If the value is
# empty, the role does not write the file.
proxmox_base_sysctl: {}
