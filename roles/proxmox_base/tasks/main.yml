---
# Each part has a tag, so that one part can run alone (--tags syslog).
- name: Send the logs to Alloy
  ansible.builtin.import_tasks: syslog.yml
  tags: syslog

- name: Stop the services that the hosts do not use
  ansible.builtin.import_tasks: services.yml
  tags: services

- name: Let the ipmiutil watchdog service restart cron
  ansible.builtin.import_tasks: ipmi-watchdog.yml
  tags: ipmi-watchdog

- name: Set the CPU governor and the ring buffers at boot
  ansible.builtin.import_tasks: tuning.yml
  tags: tuning

- name: Stop KSM on the hosts that have free memory
  ansible.builtin.import_tasks: ksm.yml
  tags: ksm

- name: Write the kernel settings of the host
  ansible.builtin.import_tasks: sysctl.yml
  tags: sysctl
