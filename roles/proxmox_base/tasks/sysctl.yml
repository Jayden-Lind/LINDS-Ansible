---
# One file holds the kernel settings of the host. The handler loads the file
# when it changes.

- name: Write the kernel settings
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/90-proxmox-base.conf
    owner: root
    group: root
    mode: "0644"
  when: proxmox_base_sysctl | length > 0
  notify: Load the kernel settings
