---
# The role does not make snapshot tasks. On linds-truenas-01 the pool NAS is
# the target of the nightly pull from jd-proxmox-02 (replication task 2), and
# local snapshots on a target stop the next incremental pull.

- name: Set the host name
  arensb.truenas.hostname:
    name: "{{ truenas_hostname }}"
  when: truenas_hostname | length > 0

- name: Share the datasets with NFS
  arensb.truenas.sharing_nfs:
    path: "{{ item.path }}"
    networks: "{{ item.networks | default(omit) }}"
    maproot_user: "{{ item.maproot_user | default(omit) }}"
    maproot_group: "{{ item.maproot_group | default(omit) }}"
  loop: "{{ truenas_nfs_shares }}"
  loop_control:
    label: "{{ item.path }}"

- name: Read the syslog settings
  ansible.builtin.command: midclt call system.advanced.config
  register: truenas_advanced
  changed_when: false
  check_mode: false
  when: truenas_syslog_server | length > 0

# TrueNAS 25.10 keeps a list, syslogservers: [{host, transport, tls_certificate}].
- name: Send syslog to the remote server
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - system.advanced.update
      - "{{ {'syslogservers': [{'host': truenas_syslog_server, 'transport': truenas_syslog_transport}]} | to_json }}"
  changed_when: true
  when:
    - truenas_syslog_server | length > 0
    - (truenas_advanced.stdout | from_json).syslogservers | default([])
      | map(attribute='host') | list != [truenas_syslog_server]
      or (truenas_advanced.stdout | from_json).syslogservers | default([])
      | map(attribute='transport') | list != [truenas_syslog_transport]
