---
# The file server settings of one server. Set them in host_vars. The role makes
# the listed shares and exports exact; it does not touch others.

# Data volumes, found by their label: [{label: NAS, letter: E}].
windows_fileserver_volumes: []

# SMB shares:
#   - name: NAS
#     path: E:\
#     description: ""
#     access_based_enumeration: false
#     permissions:
#       - {who: Everyone, rights: Change}      # Full, Change or Read
windows_fileserver_shares: []

# NTFS permissions of folders. The role makes the permissions of each folder
# exact: SYSTEM and Administrators with full control, then the listed rules.
# The folder does not inherit from its parent. With clean_below, the role also
# removes the own entries for windows_fileserver_broad_identities from the
# items below the folder, so that they inherit from it.
#   - path: D:\Music
#     clean_below: true
#     rules:
#       - {who: LINDS\FreeNAS Read & Write, rights: Modify}
#       - who: LINDS\Domain Users
#         rights: ReadAndExecute
#         inherit: ObjectInherit              # default: ContainerInherit, ObjectInherit
#         propagation: NoPropagateInherit     # default: None
# Set a replicated folder on one member only. DFS Replication copies the
# permissions to the other members.
windows_fileserver_folder_permissions: []

# Identities that must not have an own entry below a folder with clean_below.
windows_fileserver_broad_identities:
  - S-1-1-0        # Everyone
  - S-1-5-11       # Authenticated Users
  - S-1-5-32-545   # BUILTIN\Users
  - Domain Users   # the domain group

# NFS exports. A client that is not listed gets no access:
#   - name: NAS
#     path: E:\
#     authentication: [sys]
#     unmapped_user_access: true
#     clients:
#       - {client: 192.0.2.20, permission: readwrite, root: true}
windows_fileserver_nfs_shares: []

# Settings of the NFS server, given to Set-NfsServerConfiguration. Empty:
# the Windows defaults. Example: {EnableNFSV2: false, EnableNFSV3: false}
windows_fileserver_nfs_server: {}

# Shadow copies (Previous Versions), one scheduled task for each volume:
#   - {letter: E, days: [monday, friday], times: ["07:00", "12:00"]}
windows_fileserver_shadow_copies: []

# true or false: require SMB signing on the server side. Not set: the role does
# not change it, and a GPO or the Windows default (required on Server 2025)
# applies.
# windows_fileserver_smb_require_signing:

# true: the server is a DFS Replication member. The role then installs DFS-R and
# clears the replication data of an earlier member from the volumes. The role
# windows_dfsr manages the membership.
windows_fileserver_replication: false

# The shares in the access report (tasks_from: access-report).
windows_fileserver_report_shares: [NAS]
