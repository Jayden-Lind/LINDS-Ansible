---
# The file server settings of one server. Set them in host_vars. The role makes
# the listed shares and exports exact; it does not touch others.

# Data volumes, found by their label: [{label: NAS, letter: E}].
windows_fileserver_volumes: []

# SMB shares:
#   - name: NAS
#     path: E:\
#     description: ""
#     access_based_enumeration: false
#     permissions:
#       - {who: Everyone, rights: Change}      # Full, Change or Read
windows_fileserver_shares: []

# NFS exports. A client that is not listed gets no access:
#   - name: NAS
#     path: E:\
#     authentication: [sys]
#     unmapped_user_access: true
#     clients:
#       - {client: 192.0.2.20, permission: readwrite, root: true}
windows_fileserver_nfs_shares: []

# Settings of the NFS server, given to Set-NfsServerConfiguration. Empty:
# the Windows defaults. Example: {EnableNFSV2: false, EnableNFSV3: false}
windows_fileserver_nfs_server: {}

# Shadow copies (Previous Versions), one scheduled task for each volume:
#   - {letter: E, days: [monday, friday], times: ["07:00", "12:00"]}
windows_fileserver_shadow_copies: []

# true: the server is a DFS Replication member. The role then installs DFS-R and
# clears the replication data of an earlier member from the volumes. The role
# windows_dfsr manages the membership.
windows_fileserver_replication: false
