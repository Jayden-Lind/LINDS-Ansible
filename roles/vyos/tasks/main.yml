---
# Configuration common to every VyOS router.
#
# Everything here is driven from role defaults + group_vars, so this file holds
# no site-specific values and never sets something a site file has to delete
# again. Per-site configuration lives in jd.yml / linds.yml, selected by the
# `vyos_site` group var.
#
# Repetitive `set` blocks are rendered from templates/*.j2 — the data lives in
# group_vars, the CLI syntax lives in the template, and the task list stays
# short enough to read in one screen.

# Cert/key blobs exceed the network_cli terminal width (512); the fetched
# running config is corrupted at each wrap point, so vyos_config can never
# see these lines as present and reports phantom drift on every run. Gate the
# PKI tasks on a prefix match instead (first 400 chars arrive intact) — they
# still fire when a cert is missing or rotated.
- name: Read PKI state (long lines defeat vyos_config's diff — see README)
  vyos.vyos.vyos_command:
    commands:
      - show configuration commands | match "set pki"
  register: vyos_pki_running
  changed_when: false

- name: Install LINDS-CA into PKI
  vyos.vyos.vyos_config:
    lines:
      - set pki ca LINDS certificate '{{ item }}'
  with_file: linds-ca.cer
  when: lookup('file', 'linds-ca.cer')[:400] not in vyos_pki_running.stdout[0]

- name: System, conntrack, sysctl, DNS forwarder, NTP and LLDP base
  vyos.vyos.vyos_config:
    lines: "{{ lookup('template', 'system.j2').splitlines() | select | list }}"

- name: Set vyos user password hash
  vyos.vyos.vyos_config:
    lines:
      - set system login user vyos authentication encrypted-password '{{ vyos_user_password_hash }}'
  when: vyos_user_password_hash is defined

- name: Firewall LAN-Addresses network-group
  vyos.vyos.vyos_config:
    lines: >-
      {{ ["set firewall group network-group LAN-Addresses description 'LAN Networks'"]
         + vyos_rfc1918
           | map('regex_replace', '^(.*)$',
                 "set firewall group network-group LAN-Addresses network '\1'")
           | list }}

- name: Cloudflare dynamic DNS
  vyos.vyos.vyos_config:
    lines:
      - set service dns dynamic name service-Cloudflare-{{ wan_interface }} address interface '{{ wan_interface }}'
      - set service dns dynamic name service-Cloudflare-{{ wan_interface }} protocol cloudflare
      - set service dns dynamic name service-Cloudflare-{{ wan_interface }} username token
      - set service dns dynamic name service-Cloudflare-{{ wan_interface }} password '{{ cf_dyn_dns_key }}'
      - set service dns dynamic name service-Cloudflare-{{ wan_interface }} ip-version both
      - set service dns dynamic name service-Cloudflare-{{ wan_interface }} host-name '{{ dyn_host }}'
      - set service dns dynamic name service-Cloudflare-{{ wan_interface }} zone '{{ cf_dyn_dns_zone }}'

- name: Site configuration
  ansible.builtin.include_tasks:
    file: "{{ vyos_site }}.yml"
