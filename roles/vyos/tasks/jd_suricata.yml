---
# Suricata IDS -> Grafana. Native CLI config only; the two things VyOS has no
# node for are handled elsewhere:
#   * The EVE syslog facility/level template patch and the journald size cap
#     live in the post-boot script (jd_postboot.yml).
#   * Rule tuning is /etc/suricata/disable.conf, consumed by suricata-update
#     on every run (weekly task-scheduler job, or a manual `update suricata`).
#     /etc does not survive image upgrades, so the post-boot script re-seeds
#     the same file.
#
# A fresh image needs one manual `update suricata` to fetch ET Open before the
# daemon has any rules to load; after that the scheduler keeps them current.

- name: Suricata IDS + EVE-to-Loki syslog shipping
  vyos.vyos.vyos_config:
    lines: "{{ lookup('template', 'jd_suricata.j2').splitlines() | select | list }}"

- name: Suricata rule tuning (disable.conf, read by suricata-update)
  vyos.vyos.vyos_command:
    commands:
      - sudo sh -c 'printf "%s\n" {{ vyos_suricata_disabled_sids | join(" ") }} > /etc/suricata/disable.conf'
  changed_when: false
