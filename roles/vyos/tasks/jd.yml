---
# jd-vyos-01 (10.0.50.1) — orchestrator only.
#
# Ordering matters in two places:
#   * interfaces before DHCP/firewall/NAT — rules reference interface names.
#   * IPsec before routing — BGP peers over vti0, which the tunnel creates.

- name: Interfaces (WAN, LAN trunk, VLANs, cellular backup)
  ansible.builtin.include_tasks: jd_interfaces.yml

- name: DHCP server
  ansible.builtin.include_tasks: jd_dhcp.yml

- name: DNS forwarder
  ansible.builtin.include_tasks: jd_dns.yml

- name: Services (SSH, SNMP, router-advert)
  ansible.builtin.include_tasks: jd_services.yml

- name: Suricata IDS + EVE log shipping to Loki
  ansible.builtin.include_tasks: jd_suricata.yml

- name: Firewall
  ansible.builtin.include_tasks: jd_firewall.yml

- name: NAT
  ansible.builtin.include_tasks: jd_nat.yml

- name: IPsec site-to-site (LINDS peer)
  ansible.builtin.include_tasks: jd_site_to_site.yml

- name: IPsec remote-access (mobile clients)
  ansible.builtin.include_tasks: jd_remote_access.yml

- name: WireGuard egress tunnels + policy routing
  ansible.builtin.include_tasks: jd_wireguard.yml

- name: Routing (static, dual-WAN failover, BGP)
  ansible.builtin.include_tasks: jd_routing.yml

- name: Post-boot script (ethtool + IPsec RA UDP-encap)
  ansible.builtin.include_tasks: jd_postboot.yml
