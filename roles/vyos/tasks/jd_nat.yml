---
# Source NAT, destination NAT (port forwards), and the WAN interface-group the
# source rules match on. Rule tables are data in group_vars/jd_vyos.yml.

- name: Firewall WAN interface group (primary + cellular backup)
  vyos.vyos.vyos_config:
    lines:
      - set firewall group interface-group WAN interface "{{ wan_interface }}"
      - set firewall group interface-group WAN interface "{{ main_lan_interface }}.{{ vyos_backup_wan_vif }}"

- name: NAT — source and destination rules
  vyos.vyos.vyos_config:
    lines: "{{ lookup('template', 'nat.j2').splitlines() | select | list }}"
