---
# Dual-WAN failover between {{ wan_interface }} (primary) and
# {{ main_lan_interface }}.99 (cellular backup), implemented with
# `protocols failover`.
#
# Design goals:
#   * Health-check ONLY the primary ({{ wan_interface }}). While it can reach
#     the internet the default route rides {{ wan_interface }} (metric 1).
#   * If the primary's internet fails, the default swings to
#     {{ main_lan_interface }}.99 (metric 10). The backup is NOT health-checked
#     for internet reachability (its check only pings its own gateway), so a
#     dead/flapping backup can NEVER influence the primary path, and the backup
#     is used regardless of whether it actually has working internet.
#
# Implementation notes:
#   * DHCP is told not to install a default route (no-default-route) so
#     `protocols failover` owns the default outright — no metric fights.
#   * The daemon's health check runs `ping -I {{ wan_interface }} <target>`,
#     which still needs a route to the target. So the check targets are pinned
#     out {{ wan_interface }} with /32 static routes; without these the check
#     dead-locks at cold start (no default route -> no route to target -> check
#     fails -> no default route). Non-DNS IPs (8.8.8.8 / 8.8.4.4) are used as
#     targets so a primary outage never blackholes the DNS forwarder upstreams
#     (1.1.1.1 / 1.0.0.1).
#   * next-hop gateways are the DHCP-assigned WAN gateways. They are stable in
#     practice (NBN /17 subnet gateway; cellular router LAN gateway) but are
#     hard-coded here because `dhcp-interface` gateway learning does not work
#     alongside no-default-route. Update {{ wan_gateway }} if the ISP ever
#     changes the WAN gateway.
#
# Replaces the previous `load-balancing wan` + wlb-localfix.sh setup, which
# load-balanced router-originated traffic (incl. the on-box DNS forwarder)
# across BOTH WANs by weight and broke connectivity whenever the cellular
# backup flapped.

- name: Failover — WAN gateway facts
  ansible.builtin.set_fact:
    wan_gateway: "1.159.127.254"
    backup_gateway: "192.168.0.1"

- name: Failover — remove legacy WAN load-balancing
  vyos.vyos.vyos_config:
    lines:
      - delete load-balancing wan
      - delete load-balancing

- name: Failover — remove stale wlb-localfix.sh hook script
  vyos.vyos.vyos_command:
    commands:
      - rm -f /config/scripts/wlb-localfix.sh

- name: Failover — hand the default route to protocols failover (suppress DHCP defaults)
  vyos.vyos.vyos_config:
    lines:
      - delete interfaces ethernet "{{ wan_interface }}" dhcp-options default-route-distance
      - delete interfaces ethernet "{{ main_lan_interface }}" vif 99 dhcp-options default-route-distance
      - set interfaces ethernet "{{ wan_interface }}" dhcp-options no-default-route
      - set interfaces ethernet "{{ main_lan_interface }}" vif 99 dhcp-options no-default-route

- name: Failover — pin primary health-check targets out {{ wan_interface }}
  vyos.vyos.vyos_config:
    lines:
      - set protocols static route 8.8.8.8/32 next-hop "{{ wan_gateway }}"
      - set protocols static route 8.8.4.4/32 next-hop "{{ wan_gateway }}"

- name: Failover — primary ({{ wan_interface }}, health-checked) + cellular backup (unconditional)
  vyos.vyos.vyos_config:
    lines:
      # Primary: installed only while it can reach the internet
      - set protocols failover route 0.0.0.0/0 next-hop "{{ wan_gateway }}" interface "{{ wan_interface }}"
      - set protocols failover route 0.0.0.0/0 next-hop "{{ wan_gateway }}" metric 1
      - set protocols failover route 0.0.0.0/0 next-hop "{{ wan_gateway }}" check type icmp
      - set protocols failover route 0.0.0.0/0 next-hop "{{ wan_gateway }}" check target 8.8.8.8
      - set protocols failover route 0.0.0.0/0 next-hop "{{ wan_gateway }}" check target 8.8.4.4
      # Backup: higher metric, check only its own gateway (not the internet)
      - set protocols failover route 0.0.0.0/0 next-hop "{{ backup_gateway }}" interface "{{ main_lan_interface }}.99"
      - set protocols failover route 0.0.0.0/0 next-hop "{{ backup_gateway }}" metric 10
      - set protocols failover route 0.0.0.0/0 next-hop "{{ backup_gateway }}" check type icmp
      - set protocols failover route 0.0.0.0/0 next-hop "{{ backup_gateway }}" check target "{{ backup_gateway }}"
