---
- name: Turn on the AD Recycle Bin
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param()
      Import-Module ActiveDirectory
      $Ansible.Changed = $false
      $rb = Get-ADOptionalFeature -Filter { Name -like 'Recycle Bin Feature' }
      if (@($rb.EnabledScopes).Count -eq 0) {
        if (-not $Ansible.CheckMode) {
          Enable-ADOptionalFeature -Identity 'Recycle Bin Feature' `
            -Scope ForestOrConfigurationSet -Target (Get-ADForest).RootDomain -Confirm:$false
        }
        'turn on the AD Recycle Bin'
        $Ansible.Changed = $true
      }
  when: enable_ad_recycle_bin | bool

- name: Move the FSMO roles to their domain controllers
  ansible.windows.win_powershell:
    parameters:
      Placement: "{{ fsmo_placement }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([hashtable]$Placement)
      Import-Module ActiveDirectory
      $Ansible.Changed = $false

      $current = @{}
      $d = Get-ADDomain; $f = Get-ADForest
      $current['PDCEmulator']          = $d.PDCEmulator
      $current['RIDMaster']            = $d.RIDMaster
      $current['InfrastructureMaster'] = $d.InfrastructureMaster
      $current['SchemaMaster']         = $f.SchemaMaster
      $current['DomainNamingMaster']   = $f.DomainNamingMaster

      # Transfer one role at a time. Requesting several in a single call can
      # fail with "the server is unwilling to process the request" even when
      # each transfer succeeds individually.
      foreach ($role in $Placement.Keys) {
        $want = $Placement[$role]
        if ($current[$role].ToLower() -ne $want.ToLower()) {
          "move $role to $want"
          $Ansible.Changed = $true
          if ($Ansible.CheckMode) { continue }
          Move-ADDirectoryServerOperationMasterRole -Identity ($want -split '\.')[0] `
            -OperationMasterRole $role -Confirm:$false
          Start-Sleep -Seconds 5
        }
      }
  run_once: true
  register: windows_ad_recovery_fsmo

# The GPO "PDC Emulator - Time" follows the PDC emulator role through a WMI
# filter, but only at the next Group Policy refresh, up to two hours later.
# Until then the new PDC emulator has no time source. This is the play's host
# when it is the PDC emulator in fsmo_placement, which is the usual case.
- name: Apply Group Policy on the new PDC emulator and resync its time
  ansible.windows.win_command: "{{ item }}"
  loop:
    - gpupdate /target:computer /force
    - w32tm /resync /rediscover
  changed_when: false
  when:
    - windows_ad_recovery_fsmo is changed
    - "'PDCEmulator' in windows_ad_recovery_fsmo.output | default([]) | join(' ')"
    - fsmo_placement.PDCEmulator | lower == inventory_hostname | lower
