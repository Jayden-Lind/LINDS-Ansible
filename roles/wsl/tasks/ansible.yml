---
- name: Install Ansible Pip packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: latest
  with_items:
    - python3-argcomplete
    - python3-paramiko
    - pipx

- name: Clone LINDS Ansible
  ansible.builtin.git:
    repo: https://github.com/Jayden-Lind/LINDS-Ansible.git
    dest: "{{ wsl_root_dir }}/LINDS-Ansible"
    update: false
  become: true
  become_user: "{{ wsl_user }}"

- name: Install the Ansible requirements
  ansible.builtin.command: ansible-galaxy install -r {{ wsl_root_dir }}/LINDS-Ansible/requirements.yml
  become: true
  become_user: "{{ wsl_user }}"
  register: wsl_galaxy
  changed_when: "'was installed successfully' in wsl_galaxy.stdout"

- name: Make the SSH folder of the user
  ansible.builtin.file:
    path: /home/{{ wsl_user }}/.ssh
    state: directory
    owner: "{{ wsl_user }}"
    group: "{{ wsl_user }}"
    mode: "0700"

- name: Copy private key
  ansible.builtin.copy:
    dest: /home/{{ wsl_user }}/.ssh/id_rsa
    content: "{{ ssh_private_key }}"
    owner: "{{ wsl_user }}"
    group: "{{ wsl_user }}"
    mode: "0600"
