---
- name: See whether a CA is configured here
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      [bool](Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\CertSvc\Configuration' -ErrorAction SilentlyContinue).Active
  register: windows_ca_present
  changed_when: false

- name: Remove the CA from this server
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      Import-Module ADCSDeployment
      # Its certificate stays trusted in the directory, and its key and
      # database stay on this disk; only the service and the enrolment entry go.
      Uninstall-AdcsCertificationAuthority -Force | Out-Null
      $Ansible.Changed = $true
  when: windows_ca_present.output[0]

- name: Remove the role itself, which is what blocks a demotion
  ansible.windows.win_feature:
    name: ADCS-Cert-Authority
    state: absent
  register: windows_ca_feature_removed

- name: Restart if removing it asked for one
  ansible.windows.win_reboot:
    reboot_timeout: 1200
  when: windows_ca_feature_removed.reboot_required
