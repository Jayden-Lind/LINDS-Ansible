---
# The backup is encrypted with the vault on the controller; win_copy decrypts
# it on the way. It lands in a folder only administrators and SYSTEM can open
# and is removed again whatever happens.
- name: Read the password of the backup
  ansible.builtin.include_vars:
    file: "{{ windows_state_dir }}/ca/backup/password.yml"
  no_log: true

- name: Make a folder for the backup on the server
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $work = Join-Path $env:SystemRoot ('Temp\ca-restore-' + [guid]::NewGuid().ToString('N'))
      New-Item -ItemType Directory -Path $work | Out-Null
      & icacls.exe $work /inheritance:r /grant:r '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-18:(OI)(CI)F' | Out-Null
      $work
  register: windows_ca_restore_dir

- name: Restore, and clean up afterwards
  vars:
    work: "{{ windows_ca_restore_dir.output[0] }}"
  block:
    - name: Copy the backup to the server
      ansible.windows.win_copy:
        src: "{{ item }}"
        dest: "{{ work }}\\{{ item | basename }}"
      loop: "{{ query('ansible.builtin.fileglob', windows_state_dir ~ '/ca/backup/*') | reject('search', 'password.yml$') | list }}"
      loop_control:
        label: "{{ item | basename }}"

    # As the operator: this writes the CA back into the forest's configuration.
    - name: Install the CA with its existing certificate and key
      ansible.windows.win_powershell:
        parameters:
          Work: "{{ work }}"
        sensitive_parameters:
          - name: Password
            value: "{{ windows_ca_backup_password }}"
        script: |
          param([string]$Work, [securestring]$Password)
          $ErrorActionPreference = 'Stop'
          Import-Module ADCSDeployment
          $p12 = Get-ChildItem -LiteralPath $Work -Filter *.p12 | Select-Object -First 1
          Install-AdcsCertificationAuthority -CAType EnterpriseRootCa -CertFile $p12.FullName -CertFilePassword $Password -Force | Out-Null
          $Ansible.Changed = $true

    # As SYSTEM: the CA only takes its database back from the server itself.
    - name: Put back the database and the settings
      ansible.windows.win_powershell:
        parameters:
          Work: "{{ work }}"
        script: |
          param([string]$Work)
          $ErrorActionPreference = 'Stop'
          Import-Module ADCSAdministration
          Stop-Service certsvc -Force
          $zip = Get-ChildItem -LiteralPath $Work -Filter *-database.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath "$Work\DataBase" -Force
          Restore-CARoleService -Path $Work -DatabaseOnly -Force
          # Stored as UTF-8 text for the sake of diffs; reg.exe wants UTF-16.
          $reg = Get-ChildItem -LiteralPath $Work -Filter *-configuration.reg | Select-Object -First 1
          [IO.File]::WriteAllText("$Work\import.reg", [IO.File]::ReadAllText($reg.FullName, [Text.Encoding]::UTF8), [Text.Encoding]::Unicode)
          # reg.exe reports success on the error stream, which would stop the
          # script here; judge it by its exit code instead.
          $ErrorActionPreference = 'Continue'
          & reg.exe import "$Work\import.reg" 2>&1 | Out-Null
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($code -ne 0) { throw "reg import failed ($code)" }
          Start-Service certsvc
          # The service reports "running" some seconds before it answers;
          # publishing at once failed with "RPC server unavailable".
          $ErrorActionPreference = 'Continue'
          foreach ($try in 1..24) {
              & certutil.exe -ping 2>&1 | Out-Null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 5
          }
          & certutil.exe -crl 2>&1 | Out-Null
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($code -ne 0) { throw "The restored CA could not publish a CRL ($code)" }
          $Ansible.Changed = $true
      become: true
      become_method: ansible.builtin.runas
      become_user: SYSTEM
  always:
    - name: Remove the backup from the server
      ansible.windows.win_file:
        path: "{{ work }}"
        state: absent
